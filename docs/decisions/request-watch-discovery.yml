$schema: https://refinery.systems/ontology/decision-record
title: The request watcher reconciles each thread's durable request records
relationships:
  related-to:
    - request-watch
  references:
    - library-facades
description: >-
  The request watcher reports every request raised across a T3 Code server
  once, including requests raised and settled while it was disconnected and
  requests in archived threads. The server's only cross-thread stream is the
  shell (`orchestration.subscribeShell`). Each of its thread rows carries one
  pending request summary, it coalesces a thread's events into the current
  row, and it lists active threads only. The decision is how the watcher learns
  about every request in every thread from what the server offers.
considered-options:
  reconcile-durable-records: >-
    A thread projection's `runtimeRequests` hold every request the thread
    raised, settled ones included. The watcher keeps a ledger of the requests it
    has accounted for and reconciles each included thread's `runtimeRequests`
    against it. A thread that waits or runs is reconciled from a `threads.watch`
    subscription after every event. Any other thread is reconciled by a
    projection read whenever its row changes or the stream removes it, and the
    archived snapshot covers archived threads. Each thread's `updatedAt` in the
    initial snapshots is its start boundary.
  watch-waiting-threads: >-
    While an included thread's row shows a pending summary, the watcher holds a
    thread watch on it, and it reports the pending requests the watch's tracker
    announces.
  replay-events-from-cursors: >-
    After an outage, the watcher subscribes each changed thread from its
    last-known sequence and reads the replayed events for requests raised in
    between.
  read-on-every-row-change: >-
    The watcher reads a thread's pending requests whenever its shell row
    changes, without thread watches.
  watch-every-thread: >-
    The watcher holds a thread watch on every thread on the server.
  poll-every-thread: >-
    The watcher reads every thread's requests on an interval.
decision-outcome:
  chosen-option: reconcile-durable-records
  justification: |
    `runtimeRequests` is the only record the server keeps of a request after
    it settles, and a bounded projection carries all of it
    (`applyToProjection` in `ProjectionStore.ts`, `buildBoundedThreadProjection`
    in `threadHistoryPaging.ts` at upstream v0.1.10). Reconciling against it
    finds a request raised and answered while the watcher was away, which
    nothing in the shell shows: the shell's replay is the thread's current row,
    and a removal for an archived thread.

    Watching only waiting threads misses exactly those requests. Replaying
    events from cursors fails once the gap passes the server's replay budget or
    pruned sequence, where the server sends a snapshot instead. Reading on every
    row change reads busy threads on every streamed update. Watching every
    thread streams the full activity of every thread. Polling bounds latency by
    the interval. Combining watches for waiting and running threads with reads
    for the rest keeps the stream on the threads where activity is, and reads
    on the rare changes of the others.
expected-outcomes:
  positive: |
    - Every request raised after the start is reported, settled or not, after
      any outage and in archived threads.
    - A start boundary from server timestamps classifies a request the same
      way whichever source reaches it first.
    - The thread watch's resume and replay semantics carry over unchanged. The
      ledger makes every repeat harmless, so reconciliation is idempotent.
  negative: |
    - Each waiting or running included thread costs one subscription, with a
      bounded snapshot when it opens, and streams all its events to the
      watcher while it runs.
    - A change to an idle thread costs one bounded projection read, and the
      watcher reads the archived snapshot at start and after an authoritative
      resume.
    - A settled request whose card is outside the bounded window costs one
      full thread detail read.
    - A request reported after it settled reaches consumers, which act on its
      status.
