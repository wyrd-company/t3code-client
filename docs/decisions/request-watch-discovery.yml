$schema: https://refinery.systems/ontology/decision-record
title: The request watcher watches the threads that wait, and reads requests from thread watches
relationships:
  related-to:
    - request-watch
  references:
    - library-facades
description: >-
  The request watcher reports every request it can see pending, once per run:
  the requests pending at its start and at each reconnect, and each request
  that becomes pending while it is connected, within five seconds
  (wyrd-company/t3code-client#169, issuecomment-7044502674). The server's only
  cross-thread stream is the shell (`orchestration.subscribeShell`): each row
  carries one pending summary, the server coalesces a thread's events into the
  current row, holds back an equal row for five seconds, lists active threads
  only and publishes every event of an archived thread as a removal. The
  decision is how the watcher learns which threads hold pending requests, and
  reads those requests, from what T3 Code 0.1.10 offers.
considered-options:
  watch-waiting-threads: >-
    The shell's rows and removals say which threads to look at. An included
    thread whose row shows a summary gets a thread watch, a bounded
    subscription that holds every pending request with its card, and keeps it
    while its row shows a summary or the thread watch holds a pending request.
    A removed thread gets one while it holds a pending request or a running
    run. Every report comes from a request a thread watch holds pending.
  inventories-from-startup-reads: >-
    At startup the watcher lists every thread, active and archived, and reads
    each one in full, keeping an inventory of every request id it holds. A
    request missing from an inventory, seen in any later read, is new and is
    reported, settled or not.
  watch-every-thread: >-
    The watcher holds a thread watch on every thread on the server.
  poll-waiting-threads: >-
    The watcher reads the shell on an interval, and reads the pending requests
    of each thread whose row shows a summary.
  listing-archived-threads: >-
    As the chosen option, and the watcher also reads
    `orchestration.getArchivedShellSnapshot` at its start and at each resync,
    so that requests pending in archived threads are found.
decision-outcome:
  chosen-option: watch-waiting-threads
  justification: |
    A row's summary is non-null whenever its thread holds a pending runtime
    request, and the server never holds back a row whose summary changed from
    null. A thread watch opened on that row, and kept while the thread waits,
    sees every later request as it is raised, so the five-second bound holds
    whichever rows the server holds back. A bounded thread snapshot keeps
    every pending request and its card, so a thread watch's first snapshot is
    a complete view of what the thread holds pending, and no full thread read
    is needed. Startup and each resync read only the threads that wait, and
    reports come from one path.

    Inventories report requests settled before the watcher saw them, which
    the contract leaves out, and cost a full read of every thread at startup.
    Watching every thread opens a server stream per thread. Polling bounds
    latency by the interval and reads the whole shell on every pass. The
    archived listing is a single unpaged socket call that can exceed the
    client's message limit on a large server, and the operator left requests
    already pending in archived threads at start out of the contract (item 5).
expected-outcomes:
  positive: |
    - Every request a thread watch holds pending at the start or a resync is
      reported, and every request that becomes pending while the run is
      synchronized is reported within five seconds.
    - Startup reads only the threads that wait, so its cost grows with the
      number of waiting threads, not with the server's thread history.
    - The thread watch's resume and replay semantics carry over unchanged. The
      set of reported keys makes every repeat harmless.
    - Each report carries the status a thread watch saw, `pending` unless the
      request settled while the watcher waited for its card.
  negative: |
    - A request that settles before a thread watch holds it pending is not
      reported, including one named by a summary in the shell snapshot that
      settles before the thread watch's first snapshot.
    - Requests already pending in an archived thread at start are reported
      only if a later event of the thread publishes a removal while they are
      pending.
    - An archived thread that no listing, row or removal has named, and that
      raises a request inside a gap the shell cannot replay (an outage past
      the replay window, or a start whose catch-up the server refuses), is
      outside the view until its next event publishes a removal. This follows
      from item 5 of the operator's contract; wyrd-company/t3code-client#176
      covers it.
    - Each waiting included thread costs one subscription and one bounded
      snapshot when it opens, and streams all its events while it waits. A
      removed thread costs the same while it runs.
