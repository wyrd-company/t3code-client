$schema: https://refinery.systems/ontology/specification
title: t3c command-line contract
description: >-
  t3c is a Node command-line interface to stock T3 Code. The colocated native
  asset cli-surface.json defines commands, arguments, options, constraint groups,
  output modes and exit codes. Command and global notes define dispatch,
  connection, profile, request, signal, deadline and failure behavior. The public
  usage guides explain this contract. The CLI composes @wyrd-company/t3code-lib
  for profiles, auth, projects, dispatch, watches and interruption.
format: cli
validation-criteria: >-
  Validate cli-surface.json against the CLI Command Specification schema and
  this artifact against the specification type's defined fields. Compare help
  and command registration with the native input. Verify source-to-built surface
  equality, supported golden paths and likely failures. Verify real commands
  against stock T3 Code 0.1.2/protocol 2 in fresh external owned homes with
  gpt-6-luna subjects and operational overrides cleared. Verify Dagu stdin,
  continuation, output, timeout and exit behavior through the installed CLI.
  Workspace task check is the handoff gate.
relationships:
  references:
    - cli-surface
    - cli-architecture
    - library
    - testing
    - releasing
