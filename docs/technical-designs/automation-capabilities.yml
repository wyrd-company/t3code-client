$schema: https://refinery.systems/ontology/technical-design
title: Shared scheduling and inspection capabilities
objective: >-
  Expose stock T3 Code scheduler, thread inspection, provider status and usage
  operations through the library, command line and complementary MCP tools.
relationships:
  references:
    - library
    - library-facades
    - command-line
    - cli-architecture
    - mcp
    - testing
proposed-design:
  boundaries: |
    The library owns native HTTP and RPC contracts, permission checks, derived
    inspection values and scheduler updates. CLI handlers and MCP tools compose
    these APIs. Every read and mutation accepts cancellation. Objects retain
    unknown metadata and growing discriminators follow the library's existing
    forward-compatibility rules. Server versions are informational.
  scheduler: |
    `T3Client.scheduledTasks` is a `ScheduledTasksApi` facade. It exposes `list`,
    `get`, `upsert`, `update`, `setEnabled`, `delete`, `runNow`,
    `rotateWebhookToken`, `listWebhookDeliveries`, `getWebhookDelivery` and
    `watch`. `get(id)` returns undefined for an absent task. Mutation results
    unwrap the RPC's task field. Updates load the existing task, preserve omitted
    values and send `requireExisting: true`. An omitted webhook signing secret
    and omitted filters keep their stored values; null signature and an empty
    filters array retain the server's distinct clearing semantics. Secrets are
    write-only. Unknown delivery outcomes are accepted through
    `acceptAnyOutcome: true` and decoded as growing strings.

    `webhookEndpoint(id)` returns the task id, relative `path`, a `url` resolved
    against this client's selected server URL, optional/null `connectUrl`, and
    `hasSecret`. A missing task fails as not found; a non-webhook task fails as
    a precondition. A caller without endpoint access receives an authorization
    error, not an invented or reconstructed token. The relative path and direct
    URL remain useful without T3 Connect. They do not assert public reachability.

    Scheduler list/watch require orchestration:read. Scheduler mutations and
    delivery records require orchestration:operate. The server removes endpoint
    fields from read-only results. The facade preserves that distinction.
  provider-and-usage: |
    `server.providerStatus(instanceId?)` reports provider instances with their
    authentication, installation, availability and usage-limit metadata. It uses
    the live server configuration and supports an exact optional instance filter.
    It does not log in, install providers, consume reset credits or alter limits.

    `server.usageSummary(input)` wraps server.getUsageSummary with
    diagnostics:read. The input requires sinceDay, untilDay and IANA timeZone,
    with the server's optional resolution, sinceTime, untilTime and awaitRefresh.
    Results retain usage buckets, cost-source provenance, source diagnostics,
    pricing and scan metadata. Historical usage and current provider limits are
    separate results; consumers do not invent totals by adding incompatible
    counters or currencies.
  thread-inspection: |
    `threads.status(id)` returns thread identity/configuration, active and latest
    runs, queued runs and queue-held state, pending request counts and provider
    background work. `threads.usage(id)` returns provider-thread context usage
    and provider-turn token/cost metadata with their owning ids. Full HTTP detail
    supplies historical records. Unknown and unavailable fields retain their
    server meaning; absence is not zero usage.

    `threads.pendingRequests(id)` supplies explicit questions and approvals.
    `threads.diff(id, range?)` uses the full-thread diff by default and the
    server's fromTurnCount/toTurnCount range when supplied. `threads.search`
    exposes bounded cross-thread search, and `threads.searchContent` exposes
    the server's within-thread search. Search results retain the server's bounds,
    result positions and incompleteness semantics.
  cli: |
    Schedule commands provide list/show/create/update/enable/disable/delete/run,
    endpoint lookup, webhook token rotation and delivery list/read. JSON file or
    stdin input supplies structured create/update payloads; focused flags expose
    ordinary selections without inventing a schedule expression language.
    Execution configuration includes provider/model/options, workspace strategy,
    target thread and modes. Omitted update fields remain omitted.

    `thread status`, `thread requests`, `thread usage`, `thread diff` and
    `thread search` expose structured inspection. `provider status [instanceId]`
    exposes current provider diagnostics. `usage summary` requires explicit date
    bounds and time zone. Inspection uses the existing `{data, exitCode, error?}`
    JSON envelope, text output and error mapping.

    Launch and continuation selections accept repeatable `--model-option
    key=value` and `--clear-model-options`, with boolean/select values validated
    against advertised descriptors. Explicit entries override inherited entries;
    clearing starts with an empty option set. Workspace selection supports a new
    worktree, an existing worktree or the project root. `--branch` applies to a new
    worktree. Positive/negative start-from-origin flags preserve an omitted value
    and pass explicit true/false to the server. Continuation retains its workspace.
  verification: |
    Fake HTTP/RPC tests prove permission scopes, exact payloads, omitted-versus-null
    updates, forward decoding, endpoint availability and error propagation.
    CLI tests cover argument relationships, model-option validation, workspace
    selections, output and failures. Live tests use isolated stock server homes
    for schedule CRUD, endpoints, webhook delivery, provider status and usage.
    Library and CLI tarballs are installed together for consumer checks.
