$schema: https://refinery.systems/ontology/technical-design
title: Library fake-server fixtures and isolated live harness
objective: Verify library contracts with colocated unit tests, sanitized stock-server fixtures and
  configurable isolated live-server execution.
relationships:
  references:
    - library
    - command-line
    - composition
    - releasing
    - testing
proposed-design:
  high-level-overview: Library unit tests use fake HTTP and WebSocket boundaries; live tests use
    the pinned stock server or explicit caller-selected server overrides. Agent subjects are explicit
    opt-in cases. Commands and code paths in this design are relative to packages/t3code-lib.
  unit-tests: |
    `pnpm run test` runs `src/**/*.test.ts`. The tests use
    `test/support/fakeServer.ts`, an in-process `ws` server plus a fake `fetch`
    that speak the same envelope protocol and HTTP routes as T3 Code. No network.

    `test/fixtures/` holds payloads captured from the targeted server with the
    client itself (environment descriptor, server config, shell snapshot, thread
    detail), with paths, names, and provider accounts replaced by generic values
    and the server's skill and command listings emptied. `task fixtures` captures
    them again (`test/live/captureFixtures.ts`). The server reads this machine's
    provider logins, so review the result for anything identifying before
    committing it. The schema tests decode them, so a fixture
    captured from a newer server shows where the schemas have to change.
  live-tests: |
    `pnpm run test:live` runs `test/live/**` against a real server.
    `test/live/globalSetup.ts` starts the `t3` devDependency on a free loopback
    port with its own data directory, issues a bearer token, and stops the server
    when the run ends. Both owned server and token-issuance processes omit
    `T3_SERVICE_LAUNCHER_CONTEXT` without reading its value, so an app launcher
    context cannot attach the test server to the app service lifecycle. The parent
    environment and explicit external-server selection remain intact.
    Linux process evidence captures the owned launcher's descendant identities.
    If a proc entry disappears and a signal-zero check confirms that PID is
    absent, the roster retains its PID, available identity fields and
    `absentDuringCapture: true`. Surviving siblings retain complete identities.
    Missing proc data for an existing PID and other capture errors fail setup.
    Teardown checks every recorded PID for absence, including partial rows.
    Startup failures report the failed setup stage, process exit/signal and an
    allowlisted system error code. Raw server logs and dependency error payloads
    are never read or embedded in startup diagnostics; they can contain pairing
    credentials and QR output. The stopped server's owned home remains available
    for explicit diagnosis. Failure reporting preserves lifecycle evidence errors.
    The `t3` version is the server build this library targets,
    so the live suite is the check that the client still matches it.

    | Variable          | Meaning                                                             |
    | ----------------- | ------------------------------------------------------------------- |
    | `T3_LIVE_URL`     | base URL of a server to use instead of starting one                 |
    | `T3_LIVE_TOKEN`   | bearer token for that server (`t3 auth session issue`)              |
    | `T3_LIVE_KEEP=1`  | keep the started server's data directory and log after the run      |
    | `T3_LIVE_MODEL`   | optional, default `gpt-6-luna` on provider instance `codex`         |
    | `T3_LIVE_AGENT=1` | also run tests that start a real agent turn (spends credit)         |
    | `T3_LIVE_QUEUED`  | with `T3_LIVE_AGENT=1`, run the two-message steer-or-queue scenario |

    Set both `T3_LIVE_URL` and `T3_LIVE_TOKEN` to test against a server you run
    yourself; nothing is started then.

    The agent tests need a configured provider on the server. They never run in
    continuous integration.
