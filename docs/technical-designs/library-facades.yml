$schema: https://refinery.systems/ontology/technical-design
title: T3 Code project and thread facades
objective: >-
  Map project, thread and runtime-request operations to typed calls, and follow the server-linked run through pending requests and terminal outcomes.
relationships:
  related-to:
    - library
  references:
    - profiles
    - testing
    - releasing
proposed-design:
  high-level-overview: >-
    The library implements stock T3 Code 0.1.2 and orchestration protocol 2.
    Related library designs carry the wire, transport, auth, usage and facade
    contracts. The library architecture links the canonical design family.
  api-facades: |
    Facades hold no state beyond references to the transports. They validate
    inputs with the schemas, fill server-required bookkeeping fields
    (`commandId`, `messageId`, `createdBy`, `creationSource`) so callers never
    hand-build a command, and translate stream items into domain items.

    Project repository identities can include `origin.remoteUrl`, an optional
    trimmed nonempty string naming the checkout remote when its repository differs
    from the canonical repository. Omission does not imply a missing remote.

    ```ts
    export class ProjectsApi {
      list(): Promise<OrchestrationProjectShell[]>                    // from the shell snapshot
      snapshot(): Promise<ProjectSnapshot>                            // GET /api/projects: full records
      get(projectId): Promise<OrchestrationProjectShell | undefined>
      findByWorkspaceRoot(workspaceRoot: string): Promise<OrchestrationProjectShell | undefined>  // normalises trailing slashes
      create(input: { projectId?; title; workspaceRoot; createWorkspaceRootIfMissing?; defaultModelSelection?; scripts? }): Promise<Project>
      ensure(input: { workspaceRoot; title; createWorkspaceRootIfMissing? }): Promise<OrchestrationProjectShell>
      update(projectId, patch: ProjectUpdatePayload): Promise<Project>
      delete(projectId, options?: { force?: boolean }): Promise<void>  // idempotent: not found resolves
      ensureScratch(): Promise<ProjectEnsureScratchResult>             // server finds or creates the Scratch project
      createNew(input: { name: string }): Promise<ProjectCreateNewResult>  // server makes the folder, first commit, and project
      files: { list, read, write, searchEntries, searchContents }      // thin typed RPC wrappers
    }

    export class ThreadsApi {
      list(options?: { projectId?: ProjectId; includeArchived?: boolean }): Promise<OrchestrationV2ThreadShell[]>  // archived ones from the RPC archived shell
      get(threadId): Promise<OrchestrationV2ThreadShell | undefined>  // active first, then the archived shell
      detail(threadId): Promise<OrchestrationV2ThreadDetailSnapshot>  // HTTP, the full projection; T3NotFoundError
      projection(threadId): Promise<OrchestrationV2ThreadProjection>  // RPC, bounded timeline window
      historyPage(threadId, cursor, options?: { throughEntryId?; view?: "conversation" | "activity" }): Promise<OrchestrationV2ThreadHistoryPage>
      transcript(threadId): Promise<OrchestrationV2ThreadTranscript>  // HTTP, the visible timeline; T3NotFoundError, T3HttpError thread_transcript_too_large
      create(input: ThreadCreateInput): Promise<OrchestrationV2ThreadShell>   // caller may pass threadId; else generated
      ensure(input: ThreadCreateInput & { threadId: ThreadId }): Promise<OrchestrationV2ThreadShell>   // exists → return as is
      launch(input: ThreadLaunchInput): Promise<OrchestrationV2ThreadLaunchResult>  // thread + workspace + optional first message
      update(threadId, patch: ThreadMetadataUpdatePayload): Promise<void>
      archive / unarchive / settle / unsettle / delete (threadId): Promise<void>  // archive and delete idempotent
      setRuntimeMode(threadId, mode) / setInteractionMode(threadId, mode) / setModelSelection(threadId, selection)
      startTurn(input: StartTurnInput): Promise<TurnHandle>
      interrupt(threadId, runId?, options?: { reason?; holdQueue? }): Promise<void>  // active run when runId omitted; no-op when idle
      stop(threadId): Promise<void>                                                // interrupt + holdQueue
      respondToApproval(input: { threadId; requestId; decision: ProviderApprovalDecision }): Promise<void>
      respondToUserInput(input: { threadId; requestId; answers: Record<string, unknown>; attachmentsByQuestionId? }): Promise<void>
      dismissUserInput(input: { threadId; requestId }): Promise<void>
      pendingRequests(threadId): Promise<PendingRequest[]>                         // pending runtime requests joined with their turn items
      watch(threadId, options?: WatchOptions): AsyncIterable<ThreadWatchItem>       // resumable live view
      phase(thread: OrchestrationV2ThreadShell): ThreadPhase                        // pure; "waiting_for_approval" | "waiting_for_input" | "failed" | "starting" | "running" | "completed" | "idle"
      dispatch(command: OrchestrationV2Command): Promise<DispatchResult>
    }

    export interface StartTurnInput { threadId: ThreadId; text: string; attachments?: ChatAttachment[]; context?: OrchestrationMessageContext;
      modelSelection?: ModelSelection; runtimeMode?: RuntimeMode; interactionMode?: ProviderInteractionMode; titleSeed?: string;
      delivery?: "auto" | "steer" | "restart" | "queue" | "start"; origin?: CreationOrigin; signal?: AbortSignal }

    export interface TurnHandle {
      readonly threadId: ThreadId
      readonly messageId: MessageId
      readonly commandId: CommandId
      readonly sequence: number                          // dispatch receipt
      readonly runId: RunId | undefined                  // once the server has linked the message to its run
      events(): AsyncIterable<ThreadWatchItem>           // from first iteration until the run settles; nothing is buffered before that
      readonly completion: Promise<TurnOutcome>          // resolves when the run that took this message reaches a terminal state
      interrupt(): Promise<void>
    }
    export type TurnOutcome = { state: "completed" | "interrupted" | "failed" | "cancelled" | "rolled_back"; runId: RunId; run: OrchestrationV2Run;
      assistantMessage?: OrchestrationV2ConversationMessage; error?: string; projection: OrchestrationV2ThreadProjection }

    export type ThreadWatchItem =
      | { kind: "snapshot"; snapshot: OrchestrationV2ThreadDetailSnapshot }
      | { kind: "synchronized" }
      | { kind: "event"; sequence: number; event: OrchestrationV2DomainEvent }
      | { kind: "assistant-delta"; runId; itemId; messageId; text; delta; streaming }   // text so far; delta is what the update appended
      | { kind: "approval-requested"; requestId; request: OrchestrationV2RuntimeRequest; item? }
      | { kind: "user-input-requested"; requestId; request; item?; questions: OrchestrationV2UserInputQuestion[] }
      | { kind: "request-resolved"; requestId }
      | { kind: "turn-settled"; outcome: TurnOutcome }
      | { kind: "decode-error"; error: T3DecodeError }
      | { kind: "reconnected"; afterSequence: number }
    ```

    `startTurn` sets the thread's runtime and interaction modes first when the
    caller names them, then dispatches `message.dispatch`. `delivery` chooses
    how a busy thread takes the message: `auto` (the default), `steer`, and
    `restart` ask for `start_immediately` with that `deliveryIntent`, so the
    server resolves the mode against its own state; `queue` asks for
    `queue_after_active`; `start` asks for `start_immediately` without an
    intent.

    `watch` subscribes with `orchestration.subscribeThread`; on socket loss it
    resubscribes with `afterSequence` set to the last sequence seen and emits
    `reconnected`. The snapshot frame seeds the derived items (pending requests)
    so a consumer that joins late sees the current state first. Events whose
    sequence is at or below the cursor are replay overlap and are skipped. The
    tracker applies every known event to its projection and announces
    `turn-settled` once per run when the run reaches a terminal status. Each
    request is announced once. A user-input request's questions are on its
    timeline item, which can arrive after the request, so the tracker announces a
    user-input request when that item is in the projection.

    Both thread and shell watches wait through transient first-connection failures
    and retry subscriptions that disconnect before delivering an item, without an
    attempt limit. Each connection attempt uses the transport's backoff. A watch
    keeps its last cursor across the gap and filters replay overlap. Credential
    rejections end the watch with the connection error; caller abort ends it quietly,
    and `client.close()` ends it with a closed connection error. The transport's
    connecting state determines whether a connection failure triggers a retry,
    rather than its reason or the number of empty subscriptions, with one
    exception: a `message_too_large` failure ends the watch with that error when
    the subscription delivered nothing, because the server sends the same
    snapshot on every attempt. A watch that was already live resubscribes, and
    ends only if that fresh subscription fails the same way. A connection
    error raised while the socket is open, including an HTTP detail failure while
    seeding a resumed thread watch, ends the watch with that error.

    The server links a message to its run: a new run's `userMessageId` names the
    message that started it, and the message record's `runId` names the run that
    took it, also when the message was steered into a run that was already
    active. A `TurnHandle` follows the run either link names and settles when
    that run reaches a terminal status; `assistantMessage` is the last assistant
    message of that run, and `error` the failure recorded by the run's `error`
    turn item. A message steered into an active run therefore settles with that
    run's id, together with the message that started it.

    ```ts
    export class ShellApi {
      snapshot(): Promise<OrchestrationV2ShellSnapshot>; // HTTP: projects, threads, archivedThreads
      archivedSnapshot(): Promise<OrchestrationV2ArchivedShellSnapshot>; // RPC
      watch(options?): AsyncIterable<ShellWatchItem>; // resumable like threads
      watchArchived(options?): AsyncIterable<ArchivedShellWatchItem>;
    }
    export class ServerApi {
      probe();
      getConfig();
      getSettings();
      refreshProviders(input?);
      watchConfig();
      watchLifecycle();
      environment();
    }
    export class VcsApi {
      listRefs;
      status;
      createWorktree;
      removeWorktree;
      createRef;
      switchRef;
      watchStatus;
    }
    export class TerminalApi {
      open;
      attach(stream);
      write;
      resize;
      close;
    }
    ```

  optional-environment-theme-capability: |
    `ExecutionEnvironmentCapabilities.environmentThemes` is an optional boolean
    available through `server.environment`, `server.getConfig` and configuration
    stream snapshots. True advertises environment-theme publication through
    configuration streams; false and omission are preserved without inference.
    Omission does not advertise support. Non-boolean supplied values fail decoding.

  optional-usage-limit-source-capability: |
    `ExecutionEnvironmentCapabilities.usageLimitSources` is an optional boolean
    available through `server.environment`, `server.getConfig` and configuration
    stream snapshots. True advertises quota streaming from configured usage-limit
    sources; false and omission are preserved without inference. Omission does
    not advertise support. Non-boolean supplied values fail decoding. This flag
    is distinct from the usage-limit-source snapshots and subscription input.

  optional-usage-price-override-capability: |
    `ExecutionEnvironmentCapabilities.usagePriceOverrides` is an optional boolean
    available through `server.environment`, `server.getConfig` and configuration
    stream snapshots. True advertises custom model rate persistence and application
    to usage summaries; false and omission are preserved without inference. Omission
    does not advertise support. Non-boolean supplied values fail decoding. This
    metadata flag does not configure custom model rates.

  optional-usage-model-alias-capability: |
    `ExecutionEnvironmentCapabilities.usageModelAliases` is an optional boolean
    available through `server.environment`, `server.getConfig` and configuration
    stream snapshots. True advertises model-name mapping through configured usage
    aliases; false and omission are preserved without inference. Omission does
    not advertise support. Non-boolean supplied values fail decoding. This
    metadata flag does not configure usage aliases.

  optional-thread-pinning-capability: |
    `ExecutionEnvironmentCapabilities.threadPinning` is an optional boolean
    available through `server.environment`, `server.getConfig` and configuration
    stream snapshots. True advertises support for pinning threads; false and
    omission are preserved without inference. Omission does not advertise support.
    Non-boolean supplied values fail decoding. This metadata flag does not pin
    a thread.

  optional-thread-pin-reorder-capability: |
    `ExecutionEnvironmentCapabilities.threadPinReorder` is an optional boolean
    available through `server.environment`, `server.getConfig` and configuration
    stream snapshots. True advertises support for reordering pinned threads;
    false and omission are preserved without inference. Omission does not
    advertise support. Non-boolean supplied values fail decoding. This metadata
    flag does not reorder a thread.

  optional-thread-active-reorder-capability: |
    `ExecutionEnvironmentCapabilities.threadActiveReorder` is an optional boolean
    available through `server.environment`, `server.getConfig` and configuration
    stream snapshots. True advertises persistence of manual Active thread order;
    false and omission are preserved without inference. Omission does not
    advertise support. Non-boolean supplied values fail decoding. This metadata
    flag does not reorder a thread.

  optional-thread-auto-settle-opt-out-capability: |
    `ExecutionEnvironmentCapabilities.threadAutoSettleOptOut` is an optional boolean
    available through `server.environment`, `server.getConfig` and configuration
    stream snapshots. True advertises support for disabling auto-settle per thread;
    false and omission are preserved without inference. Omission does not
    advertise support. Non-boolean supplied values fail decoding. This metadata
    flag does not change auto-settle.

  optional-project-file-reads: |
    `projects.files.read` mirrors `projects.readFile`. Its optional `allowMissing`
    input is a boolean. When true, an absent file returns empty contents, zero
    byteLength, truncated false and exists false. Omitted or false retains the
    server's missing-file error. The optional boolean result field `exists` can
    be omitted by the server; callers must not infer absence from omission.

  optional-repository-root-detection: |
    `vcs.listRefs` returns an optional boolean `isAtRepositoryRoot` that reports
    whether the requested `cwd` is the repository root. Omission does not mean
    false. Unknown result fields remain available for forward compatibility.

  optional-upstream-references: |
    Each reference from `vcs.listRefs` can include `upstreamRef`, an optional
    trimmed nonempty string containing the full Git ref, such as
    `refs/remotes/origin/main`. Callers must handle omission. Unknown reference
    fields remain available for forward compatibility.

  optional-working-tree-root: |
    `vcs.status` and local status from `vcs.watchStatus` snapshots and updates
    expose `workingTree.rootPath` as an optional nonempty string. It contains
    the absolute worktree root on the server environment; each
    `workingTree.files[].path` is relative to that root. Paths preserve
    whitespace. The server omits the root when it cannot resolve it; callers
    must handle omission. Unknown working-tree fields remain available.

  terminal-attach: |
    `terminal.attach` accepts optional boolean `resume`. With `resume: true`,
    resubscriptions preserve closed, exited and evicted terminals instead of
    restarting them, even with `restartIfNotRunning: true`. Unknown terminal IDs
    can recover when `cwd` is supplied, including after a server restart.
    Omission and `false` retain ordinary attach behavior. Unknown IDs without
    `cwd` fail lookup. The stock server owns terminal lifecycle behavior.
  provider-installed-version: |
    Provider records in server configuration reads, provider lists and config
    streams expose `installedVersion` as an optional nullable trimmed nonempty
    string. It reports the installed CLI version for a local provider with a
    separate server. Null means unknown; omission leaves legacy snapshots on
    `version`. The library does not infer a value or enforce a version policy.
  provider-workspace-options: |
    Provider workspace snapshots in configuration reads, provider lists and config
    streams expose optional `optionDescriptors` arrays. Each entry uses the
    existing boolean/select provider option descriptor union. Omission means no
    descriptor snapshot was supplied; an empty array supplies no options.
    Unknown descriptor types decode to `{ unknown: true, raw }`; malformed known
    types fail decoding. The library does not infer workspace options.
  provider-workspace-slash-commands: |
    Provider workspace snapshots in configuration reads, provider lists and config
    streams expose optional boolean `slashCommandsPending`. True marks pending
    slash-command discovery; the stock server can retain previous slash commands
    while discovery is pending. False and omission are preserved without inference.
    Non-boolean supplied values fail decoding.
