  optional-thread-stop-capability: |
    `ExecutionEnvironmentCapabilities.threadStop` is an optional boolean available
    through `server.environment`, `server.getConfig` and configuration stream
    snapshots. True advertises support for the upstream thread-stop command.
    False and omission are preserved; omission does not advertise support.
    Supplied non-boolean values fail decoding. Unknown fields remain intact.
    This metadata flag does not dispatch a command or change `threads.stop`.

  optional-server-self-update-capability: |
    `ExecutionEnvironmentCapabilities.serverSelfUpdate` is an optional growing
    literal available through `server.environment`, `server.getConfig` and
    configuration stream snapshots. `boot-service`, `respawn` and `desktop-managed`
    identify the advertised server update path. Omission is preserved and advertises
    no update path. Unknown strings are preserved for forward compatibility;
    supplied non-string values fail decoding. Unknown fields remain intact.
    This metadata does not start an update or restart a server or desktop app.

  optional-theme-canvas: |
    `EnvironmentTheme.canvas` is an optional string matching #RGB or #RRGGBB.
    Letter case is preserved; whitespace and other strings are invalid. Omission
    remains absent. Null and non-string values fail decoding. The member is typed
    in configuration theme arrays and `environmentThemesUpdated` payloads. Unknown
    theme metadata survives. Reading the seed color does not apply a theme.
  optional-theme-accent: |
    `EnvironmentTheme.accent` is an optional string matching #RGB or #RRGGBB.
    Decoding preserves the exact color and case, and keeps omission distinct from
    a present value. Malformed present values fail decoding. The field is typed
    in configuration theme arrays and `environmentThemesUpdated` payloads. Unknown
    theme metadata is preserved. Reading accent does not apply a theme.
  optional-theme-version: |
    `EnvironmentTheme.version` is an optional literal number 1. It is theme-file
    metadata in configuration theme arrays and `environmentThemesUpdated`
    payloads. Omission stays absent; other values are malformed. Unknown theme
    metadata is preserved. Reading it does not apply a theme or check the server version.

  optional-theme-colors: |
    `EnvironmentTheme.colors` is an optional palette map. Keys match
    /^[a-zA-Z][a-zA-Z0-9]{0,63}$/; values are trimmed, nonempty strings of at most
    64 characters after trimming. Values are not restricted to hexadecimal colors.
    Empty maps are valid, omission stays absent and unknown theme metadata is
    preserved. Configuration reads and snapshots reject malformed maps. Theme
    update streams report decode errors and continue to later valid events.
    Reading palette metadata does not apply a theme.

  optional-theme-variants: |
    `EnvironmentTheme.variants` is an optional object with independently optional
    `light` and `dark` palette maps. Keys match /^[a-zA-Z][a-zA-Z0-9]{0,63}$/;
    values are trimmed nonempty strings of at most 64 characters, including CSS
    forms beyond hex. Empty variants and empty palettes are valid; omission stays
    absent. Unknown theme and variant metadata is preserved. Configuration reads
    and snapshots reject malformed known palettes; theme stream decode-errors
    remain recoverable. Reading this metadata does not apply a theme.
  provider-icon-url: |
    Provider records in configuration reads, provider lists and configuration
    streams expose optional `iconUrl`: a trimmed nonempty string of at most
    2,048 characters. Omission stays absent. Malformed provider records are
    omitted by existing forward-compatible arrays in reads and streams. Unknown provider
    metadata is preserved. Reading this metadata does not fetch or render icons;
    consumers that render remote icons must validate the owning driver origin.
  provider-setup-documentation: |
    Provider setup records in configuration reads, provider lists and configuration
    streams expose optional `documentationUrl`: a trimmed nonempty string of at
    most 2,048 characters. Setup and field omission stay absent. Malformed provider
    records are omitted by existing forward-compatible arrays; later valid records
    remain available. Unknown setup and provider metadata is preserved. Reading
    this metadata does not fetch or open documentation.
  provider-configurability: |
    Provider records in configuration reads, provider lists and configuration
    streams expose optional boolean `configurableProviders`: true advertises that
    the provider accepts provider configuration. False and omission are preserved;
    omission does not advertise support. Non-boolean values make the provider
    record malformed; existing forward-compatible arrays omit it and later valid
    records remain available. Unknown provider metadata is preserved. Reading this
    flag does not add or call provider configuration operations.
  provider-supported-runtime-modes: |
    Provider records in configuration reads, provider lists and configuration
    streams expose optional `supportedRuntimeModes` arrays using the existing
    RuntimeMode literal set. Omission stays absent; empty arrays stay empty.
    Known modes and unknown strings, including duplicates, retain their order.
    Malformed array entries are dropped. A non-array field makes the provider
    record malformed; existing forward-compatible arrays omit that record while
    later valid records remain available. Unknown provider metadata is preserved.
    This metadata does not select a mode or change runtime defaults or policy.
  provider-native-sessions: |
    Provider records in configuration reads, provider lists and configuration
    streams expose optional `nativeSessions` metadata. When present, `canList`,
    `canLoad` and `canResume` are required booleans; `canDelete` is optional.
    False and omission are preserved, and omission does not advertise support.
    Unknown nested and provider metadata is preserved. Malformed native-session
    metadata makes the provider record malformed; existing forward-compatible
    arrays omit it while later valid records remain available. Reading this
    metadata does not perform a native-session operation.

  observability-url-metadata: |
    Configuration observability exposes optional `otlpTracesUrl`,
    `otlpMetricsUrl` and `otlpLogsUrl`: trimmed nonempty strings without a URL-format
    or length restriction. Omission stays
    absent. Null, blank and non-string values fail configuration decoding;
    unknown observability metadata is preserved. Configuration snapshots use
    the same schema, and later valid stream chunks remain available after a
    decode error. Reading this metadata does not configure telemetry or contact
    an endpoint.
  provider-auth-can-logout: |
    Provider auth records in configuration reads, provider lists and configuration
    snapshots/providerStatuses expose optional boolean `canLogout`. True, false
    and omission are preserved; omission does not advertise support. Unknown auth
    and provider metadata is preserved. Non-boolean values make the provider record
    malformed; existing forward-compatible arrays omit it while later valid records
    remain available. Reading this metadata does not log out or change authentication.

  provider-auth-action: |
    Provider auth records in configuration reads, provider lists and configuration
    snapshots/providerStatuses expose optional `action` metadata. The object requires
    `elicitationId` (trimmed nonempty string, maximum 256 characters), `url` (string,
    maximum 2048) and `message` (string, maximum 1024). Optional `createdAt` and
    `expiresAt` are strings of at most 128 characters. Only the elicitation id is
    trimmed; the other strings permit empty and arbitrary text. Omission stays
    absent. Unknown action, auth and provider metadata is preserved. Malformed
    action metadata makes the provider record malformed; existing forward-compatible
    arrays omit it while later valid records remain available. Reading this metadata
    does not open a URL, authenticate or change authentication state.

  optional-app-thread-wake-metadata: |
    App-thread records expose optional nullable `lastSnoozeWakeAt` through
    `threads.detail`, `threads.projection`, watch snapshots and thread-state
    events. The timestamp records a manual wake without changing the sidebar
    sort position. Date-time strings and null survive, omission stays absent,
    and nonstring nonnull values fail decoding under the existing IsoDateTime
    representation. Unknown metadata survives. Shell records retain their
    separate timestamp field. Reading this metadata does not wake a thread
    or change a timer.
  remote-open-username-metadata: |
    Configuration reads and snapshots expose optional `RemoteOpenTarget.username`
    as a trimmed nonempty string, without an extra format or length constraint.
    Omission remains absent. Unknown target metadata and growing kind strings
    are preserved. Null, blank and non-string values invalidate the target
    record; the existing forward-compatible array decoder omits malformed records
    and preserves later valid rows and stream chunks. Reading this metadata
    does not look up a username, build a remote link or open an SSH connection.
