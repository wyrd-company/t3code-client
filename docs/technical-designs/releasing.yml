$schema: https://refinery.systems/ontology/technical-design
title: Independent package release and publication pipeline
objective:
  Build, verify and publish independent library, CLI and MCP release units with saved-plan agreement
  and reproducible package artifacts.
relationships:
  references:
    - testing
    - library
    - command-line
    - mcp
proposed-design:
  high-level-overview: Intentional owns independent package versions and release records. Release
    validates and applies one saved plan; Publish verifies the selected record and distributes the
    same package bytes.
  release-units: |
    [Intentional](https://github.com/wyrd-company/intentional) owns versions,
    changelogs, intents and annotated release records. The root package is private.
    The independent units are:

    | Unit         | Manifest                           | npm name                   | Record             |
    | ------------ | ---------------------------------- | -------------------------- | ------------------ |
    | `t3code-lib` | `packages/t3code-lib/package.json` | `@wyrd-company/t3code-lib` | `t3code-lib@X.Y.Z` |
    | `t3code-cli` | `packages/t3code-cli/package.json` | `@wyrd-company/t3code-cli` | `t3code-cli@X.Y.Z` |
    | `t3code-mcp` | `packages/t3code-mcp/package.json` | `@wyrd-company/t3code-mcp` | `t3code-mcp@X.Y.Z` |
    | `t3c-docs`   | `docs/user/docs.yml`               | none (tag-only)            | `t3c-docs@X.Y.Z`   |
    | `t3mcp-docs` | `docs/user/docs.yml`               | none (tag-only)            | `t3mcp-docs@X.Y.Z` |

    `t3c-docs` is the docs unit of the `t3c` product. Its path is `docs/user/t3c`
    and it depends on `t3code-cli`. It is tag-only: it has no package and no
    GitHub Release. Intentional projects the `t3code-cli` version into
    `/products/t3c/version` and the `t3c-docs` version into
    `/products/t3c/docs-version` of `docs/user/docs.yml`, so `intentional apply`
    writes both. `t3mcp-docs` similarly owns `docs/user/t3mcp` and depends on
    `t3code-mcp`. The MCP code and docs units project `/products/t3mcp/version`
    and `/products/t3mcp/docs-version`. Each product has its own catalog entry,
    navigation and assets. A new docs unit has one initial major intent.

    The root CHANGELOG.md and `t3code-client@*` tags are historical records for the
    retired package. Keep them intact. Bob owns deprecation of the old npm name.
  intents: |
    Each package has exactly one major intent before its initial 0.1.0 release.
    Update that intent's message with the package's complete outcome rather than
    adding an intent for each implementation task. Author it through Intentional:

    ```bash
    intentional add --release-unit t3code-lib:major --message "Describe the library outcome."
    intentional add --release-unit t3code-cli:major --message "Describe the CLI outcome."
    ```

    For later releases, an intent accompanies each consumer-visible change.
    Bump names state change significance: `major` for a breaking change, `minor`
    for a new capability and `patch` for a fix. Before 1.0.0, `major` increments
    the minor version; `minor` and `patch` increment the patch version.
    Graduation to 1.0.0 requires an explicit `graduate` intent.
  baseline-and-first-release: |
    Manifests start at 0.0.0. No authoritative tags are made on an epic branch.
    `task intents` and CI use a disposable clone, overlay the current configuration
    and manifests, and create local-only baselines for missing zero-version units.
    These clones never push. The working repository's tags remain intact. The units
    and their projection files come from `.intentional/config.yml`; a docs unit
    is baselined at the version its `docs/user/docs.yml` projection holds.

    Only at staged epic finalization, after Bob's UAT, client default-branch merge
    and epic retrospective, establish
    authority on the merged main commit:

    ```bash
    intentional tag --baseline --dry-run
    intentional tag --baseline
    git push --atomic origin refs/tags/t3code-lib@0.0.0 refs/tags/t3code-cli@0.0.0
    intentional status
    intentional check
    intentional plan > release-plan.json
    ```

    Each initial major intent computes 0.1.0. Baseline records do not start publication.
    The tag-only docs unit starts at the `docs-version` in `docs/user/docs.yml`:

    ```bash
    intentional tag --baseline --version t3c-docs=0.1.0
    git push origin refs/tags/t3c-docs@0.1.0
    ```

    A `t3c-docs` record starts a documentation publish, so the first push publishes
    the docs.
    The CLI scaffold removes `private` and supplies its executable, build, tests,
    license, README and npm shrinkwrap before finalization. Private placeholders
    cannot be packed or released. First publication is pre-approved only at that
    finalization boundary.
  cutting-a-release: |
    On up-to-date main, inspect `intentional status` and `intentional plan`.
    Check the public npm package history, including unpublished-version tombstones,
    before selecting a publication version. An unpublished version remains reserved
    by npm. If publication encounters a reserved version, retain its immutable
    release record and author a new Intentional patch intent for the package and
    its documentation unit. Do not move the record or reuse the reserved version.
    Run `task check`, then dispatch **Release** with the exact expected record set:

    ```bash
    gh workflow run release.yml --ref main \
      -f 'expected-records=t3code-lib@0.1.0 t3code-cli@0.1.0 t3c-docs@0.1.1'
    ```

    Intentional applies the whole pending plan. It has no per-unit apply switch.
    Release compares the entire planned record set against the expected set and
    fails on any difference. To release only one unit, only that unit may be pending;
    name only its record. `depends-on` does not bump `t3c-docs`: a CLI intent
    names `t3c-docs` too, so a CLI release plans a `t3c-docs` record with it;
    a docs-only change plans only `t3c-docs`. MCP docs use `t3mcp-docs` in the
    same way; an MCP consumer change names that docs unit when its guides change.
    No unrelated unit is bumped
    implicitly. Versions are independent even when a single dispatch releases
    several units.

    Release checks main, validates intents, runs the checks, saves the canonical
    plan and verifies the exact record set and public package identities. It
    recomputes and compares the plan immediately before apply. After apply it updates
    the pnpm lockfile, builds the selected units and regenerates the CLI shrinkwrap with
    the applied package versions. It checks formatting, commits the projections and consumed
    intents, and creates records from the saved plan. The commit and selected records
    are pushed atomically. App credentials start downstream Publish workflows
    through tag events for up to three records. GitHub suppresses tag push events
    when one push creates more than three tags. For a larger record set, Release
    explicitly dispatches Publish once per package record after the atomic push,
    using a job-scoped actions:write workflow token. The package tag selects the
    workflow and immutable source commit. Docs records coalesce with those package
    runs. This preserves one atomic release authority without depending on events
    the platform does not emit.
    A concurrent main update makes the push fail; nothing is force-pushed.
  publication: |
    **Publish** responds to either unit's annotated record. It verifies the record
    identity, version, annotation, checked-out head and main ancestry. It checks
    and packs only the selected unit. A library tarball contains compiled JavaScript
    and declarations, LICENSE and README, with no source or tests. The consumer gate
    checks runtime imports and TypeScript NodeNext and Bundler resolution using
    TypeScript 5.9. Public imports are the package root and `./package.json`.

    The CLI tarball contains `dist/cli.js` and `npm-shrinkwrap.json`. The shrinkwrap
    must match the package identity/version and contain registry resolutions, with
    no workspace, file or link dependencies. The scaffold owns shrinkwrap production
    from the built CLI and its resolved library dependency; `pnpm pack` must include
    it. CLI consumer verification installs the local library and CLI tarballs together
    and runs `t3c --version`, so it does not depend on first-publication ordering.
    The local Homebrew gate installs the matching library and CLI tarballs together;
    the public formula resolves the library through the registry.

    The package upload/download artifact is named `package-<selected-record>`;
    all jobs consume that same artifact. Publish checks tarball identity again,
    publishes with npm provenance, and creates the GitHub Release with the same
    tarball and the package's changelog section. A rerun verifies an existing npm
    integrity value and GitHub asset bytes instead of replacing them.

    Documentation publishes to wyrd.foo through the reusable workflow
    `wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@v2`, called by the
    `docs` job of **Publish**. A plan job decides whether a run publishes:

    - a CLI or MCP code record publishes after its GitHub Release exists;
      each product page reads its own code Release;
    - a `t3c-docs@X.Y.Z` or `t3mcp-docs@X.Y.Z` record publishes alone for a
      docs-only release; pushed with either product code record, it waits for
      those package runs. `plan-docs.sh` checks records on the exact commit;
      zero-version baselines never publish;
    - a `t3code-lib` record and the zero baseline records publish nothing;
    - a manual run publishes the `ref` it is given, and may feature the product.

    A plain push to main does not publish. The package jobs run only for package
    records. The call passes only the two publisher secrets, not the repository's
    other secrets.
  tracking-t-code: |
    The library pins the `t3` devDependency. Main targets the newest release;
    a preparation branch targets the newest nightly. Upstream release tags are
    `vX.Y.Z`; nightly tags are `vX.Y.Z-nightly.YYYYMMDD.N`.

    1. Read `npm view t3 dist-tags`, update the library's devDependency and install.
       Keep only the target build's `minimumReleaseAgeExclude` entries in the root
       `pnpm-workspace.yaml`.
    2. Compare upstream contracts (`packages/contracts/src`), server RPC handlers,
       auth scopes and HTTP routes between the two tags. Update library schemas
       and the typed registry. Methods outside the library design's scope stay
       reachable through `rpc.callRaw` and `rpc.streamRaw`.
    3. Capture library fixtures again (see [testing](library-testing.yml))
       and run `task lib:test:live`.
    4. Update the build named in the library design and the package intent.
  recovery-and-verification: |
    - Release failed before its atomic push: fix main and dispatch again with the
      reviewed expected record set. No request tag needs deletion.
    - Publish failed: rerun Publish for the same record. Existing artifacts must
      match; different bytes fail. If no run was created, dispatch package recovery
      explicitly without deleting or replacing the release record:

      ```bash
      gh workflow run publish.yml --ref main \
        -f ref=t3code-lib@0.3.0 -f publish-package=true
      ```
    - Missing baseline at a nonzero version: stop and recover authoritative history.
      The ephemeral baseline check accepts only missing zero-version units.

    `task release:test`, `actionlint` and `shellcheck -x scripts/release/*.sh` validate
    local release boundaries. Actual main/tag events, npm provenance, GitHub assets
    and registry installation remain finalization gates.
  repository-setup: |
    | Secret                    | Used by | Purpose                                |
    | ------------------------- | ------- | -------------------------------------- |
    | `WYRD_CI_APP_ID`          | Release | GitHub App pushing commits and records |
    | `WYRD_CI_APP_PRIVATE_KEY` | Release | App key                                |
    | `NPM_TOKEN`               | Publish | npm automation token for package units |
    | `WYRD_TOOLS_DOCS_PUBLISHER_APP_ID` | Publish | Organization secret; mints the wyrd.foo publisher token |
    | `WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY` | Publish | Organization secret; the publisher App key |

    The App needs Contents write. Publish requires an Intentional release record
    whose commit is on main. A tag ruleset allowing only the App to create
    `t3code-lib@*`, `t3code-cli@*`, `t3code-mcp@*`, `t3c-docs@*` and `t3mcp-docs@*` records enforces that release
    authority.
  documentation-and-homebrew-finalization: |
    The CLI/MCP code records, product docs records and manual runs publish `docs/user` to wyrd.foo
    (see publication). Everything under `docs/user` is published, and assets are listed in
    `docs/user/docs.yml`; other `docs` folders stay private.
    `task docs` generates the library API source and published reference through
    `task lib:docs` and the CLI projection. Command, output and Dagu usage pages
    are authored guides to the canonical specification.
    `task demo` owns a fresh external server home, uses `gpt-6-luna` and clears
    `DISPLAY` and `WAYLAND_DISPLAY` before VHS. Ordinary live-test overrides remain
    available outside isolated demo/acceptance commands.

    First publication follows these gates:

    1. Bob tests and merges the client epic PR, then the epic retrospective completes.
    2. During staged finalization establish main baseline records, dispatch Release
       for both units and publish both npm units. This first publication is
       pre-approved; notify Bob through Pushover after it runs.
    3. Download the published CLI npm tarball. Regenerate the tap formula from those
       exact bytes and the npm tarball URL; verify the URL and SHA256. The tap epic
       PR receives a focused reviewer check of this regenerated formula delta.
    4. Return the epic to review for Bob alone to merge the tap epic PR, then clean up.

    The provisional 0.0.0 formula stays on the tap epic branch. It records an actual
    local pack checksum, not a published release checksum. Never merge it to tap
    main. Published tarball verification is a deferred finalization gate; local
    packing does not prove registry availability or provenance. Nothing else waits
    for the tap merge. `scripts/publish-homebrew-tap.sh` updates an explicit tap
    checkout, compares the downloaded bytes before writing the formula, and commits
    the generated formula; pushing is an explicit finalization
    step. It follows the tap publisher checkout/commit/push convention.

    `task homebrew:test` creates a temporary tap, installs local CLI/library archives,
    checks style/audit and runs the formula test, then removes only its formula/tap.
    It preserves an existing `t3c` installation by refusing to replace it. Every
    Homebrew install/test uses `HOMEBREW_NO_AUTO_UPDATE=1`,
    `HOMEBREW_NO_INSTALL_UPGRADE=1`,
    `HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1`, and
    `HOMEBREW_NO_AUTOREMOVE=1`, and `HOMEBREW_NO_INSTALL_CLEANUP=1`. Cleanup uses `brew uninstall` only; never autoremove,
    upgrade or remove existing dependency kegs to validate a local formula.
  library-release-identity: |
    The library release unit is `t3code-lib`, its manifest is `packages/t3code-lib/package.json`, and its changelog is `packages/t3code-lib/CHANGELOG.md`. The root historical changelog belongs to the retired package.

  complementary-mcp-package: |
    The MCP package starts at 0.0.0 with one initial major intent. Its npm tarball
    contains the built stdio executable and public factory declarations. Consumer
    checks install locally packed MCP and library archives together and exercise
    version, tool listing and runtime imports without starting agent work.
    CI includes the MCP package in static, protocol, isolated live and package
    checks. The `t3code-mcp@0.0.0` baseline publishes nothing. MCP code and docs
    records publish the separate t3mcp product after its code release is available.
    Release and Publish select it through the same unit-aware saved-plan
    and record checks as the other npm packages. Public first publication requires
    explicit user approval; adding the package and workflow wiring grants none.
