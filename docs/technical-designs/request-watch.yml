design-challenges:
  requests-between-observations: |
    The shell, the server's only cross-thread stream, gives each thread row one
    pending request summary and coalesces a thread's events into its current
    row. A request raised and settled between two rows the watcher sees,
    during an outage or inside one batch, never appears in a summary. The
    durable record is the thread's `runtimeRequests`, and the only complete
    read of it is the full thread snapshot (`threads.detail`): the RPC
    projection and bounded snapshots read a window that drops settled
    requests. The watcher keeps, for every thread, the inventory of request ids
    it has accounted for, and reconciles each included thread against it:
    through a thread watch while the thread waits or runs, and through a full
    thread snapshot whenever another thread changes. [The decision
    record](../decisions/request-watch-discovery.yml) weighs this against the
    alternatives.
  one-start-cut: |
    `skipExisting` must skip exactly the requests pending at the start, and no
    request raised after the start may be lost, so every request is placed
    before or after one start cut: the sequence `S0` of the HTTP shell
    snapshot of the cut the run keeps. A request carries no sequence and its timestamps
    do not follow event order, so the watcher places requests by reading
    every thread once at startup, subscribing to each from `S0` before its
    first read, so the server's replay of the thread's events after `S0`, or
    its snapshot, places each request. T3 Code 0.1.10 cannot place a request
    in some startup cases. The operator decided four of them on #169
    ([7038649689](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7038649689),
    [7041498801](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7041498801)),
    and a standing rule for the rest is proposed there
    ([7042028104](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7042028104));
    `startup` specifies every case in one table.
  two-kinds-of-shell-snapshot: |
    The shell stream sends two kinds of `snapshot` item. An authoritative
    snapshot has no `resolvedRepositoryIdentityRoots` and lists every active
    thread and project at its `snapshotSequence`. An enrichment snapshot carries
    `resolvedRepositoryIdentityRoots`, lists only projects whose repository
    identity resolved, and no thread rows; the server sends one after a fresh
    snapshot, alone at the start of a resume it can replay, and whenever an
    identity resolves while the stream is live. An enrichment snapshot's
    `snapshotSequence` is the server's latest sequence, so a watch that moved
    its cursor to it would skip the replayed rows that follow it. `shell.watch`
    therefore moves its cursor only on an authoritative snapshot, and the
    request watch's index takes only project titles from an enrichment
    snapshot. The request watch subscribes with `httpSnapshotFallback`, so a
    resume past the replay window answers `snapshot-required` and the
    authoritative state comes from the HTTP shell snapshot (reconnects).
  rows-the-server-holds-back: |
    The server coalesces a thread's events in a 50 ms batch into one row of its
    current state, and holds back a row equal to the last row it sent for that
    thread, apart from `updatedAt`, when that row went out less than five
    seconds earlier. An event on a thread therefore either produces a row, or
    happens within five seconds after a row the server sent for it. A row for
    an unwatched thread therefore makes the watcher watch that thread until six
    seconds after the latest row it received for it: the thread watch sees
    every event in the window as it happens, including the events whose row
    the server held back, and its closing read accounts for the rest.
  archived-threads: |
    The live stream lists active threads. It publishes the archive of a thread,
    and every later event of an archived thread, as `thread.removed`, and an
    archived thread can still hold a pending request. The watcher reads
    `shell.archivedSnapshot()` at startup and after a resume past the shell's
    replay window, reads a thread in full on every `thread.removed`,
    and watches an archived thread that waits or runs like an active one.
  requests-before-their-cards: |
    A request's detail (the command, the files, the questions) is on its
    timeline card, and the card can arrive after the runtime request: the
    Claude adapter emits the request's event and then the card's. A request is
    reported once its card is in the watcher's view. A pending request whose
    card has not arrived two seconds after its record is reported from a full
    thread snapshot taken after those two seconds, with the card the snapshot
    holds or with none. A stalled connection delays that read; it never stands
    in for it.
  recoverable-failures: |
    A dropped socket rejects in-flight calls, and a restarting server refuses
    reads, while the transport reconnects. Those failures keep the work they
    interrupted: a read is retried once the connection is back, and a thread
    watch resubscribes. Only a closed client, an aborted signal or a rejected
    credential ends the run. A thread the server keeps refusing is reported as
    a `thread-error` and retried with backoff; readiness names it as degraded
    instead of claiming complete coverage.
  exactly-once-across-outages: |
    Reconnects resubscribe the shell and every thread watch, a thread watch
    that closes and opens again presents the same requests again, and a read
    presents every request the thread ever raised. One ledger for the run,
    keyed by thread id and request id, absorbs every repeat, so reconciliation
    is idempotent.
  untrusted-content-and-hooks: |
    Request content is written by agents. It reaches a hook only as the bytes
    of the request line on the hook's stdin. The hook's command line is the
    operator's `--exec` text, fixed when the watcher starts and never read from
    a file. Ids that t3c prints on stderr are JSON strings, so control
    characters in a caller-chosen thread id are escaped.
proposed-design:
  guarantees: |
    A run is one iteration of `client.requests.watch(options)`, or one
    `t3c requests watch` process. A request is identified by its thread id and
    its runtime request id. The start cut `S0` is the sequence of the HTTP
    shell snapshot of the cut the run keeps (`startup`), and the run starts
    there. A thread is included when the
    filters select it; the filters apply to the thread record of the view that
    holds the request when the watcher reports it.

    1. **At most once per run.** A run reports a request at most once, across
       reconnects, server restarts, resubscriptions, thread watches that close
       and open again, and repeated reads.
    2. **Every request raised after the start is reported.** A runtime request
       of a selected kind, raised after `S0` in an included thread, is
       reported, whether it is still pending or already settled when the
       watcher reaches it. That includes a request raised and answered,
       expired or cancelled while the watcher was disconnected or the server
       was down, and a request in an archived or deleted thread. A request is
       reported with the status the watcher's view holds, so a consumer acts
       only on `request.status` `pending`. One case is excepted, as #169
       decides: a request in a thread created and deleted during an outage
       longer than the shell's replay window (more than 1,000 events or
       8 MiB, or a cursor the server pruned), which no 0.1.10 API lets the
       watcher see.
    3. **Existing requests.** A request raised before `S0` and still pending at
       it is reported, unless `skipExisting` is set, which skips exactly those.
       A request settled before `S0` is never reported. #169 defines two
       startup cases in which 0.1.10 cannot place a request against `S0`; in
       them the watcher reports the thread's pending requests, with or without
       `skipExisting`, and treats its settled requests as settled before
       `S0` (`startup`). The operator decided two further startup cases on
       #169, and a standing rule for the cases 0.1.10 cannot place is proposed
       there; `startup` defines each case, and marks the rows that apply the
       proposed rule.
    4. **Detail.** A request is reported with its timeline card when the server
       holds one: from the watcher's view, or for a pending request whose card
       has not arrived after two seconds, from a full thread snapshot taken
       after them.
    5. **Readiness.** `synchronized` means every thread on the server has been
       read for the start, so every request is placed and every later request
       is reported as it is seen. Until then, after a first pass over every
       thread, `degraded` names the threads not yet read; their requests are
       reported once a read succeeds.
    6. **Read only.** The watcher reads with `orchestration:read` and never
       answers a request. Answering stays with `threads.respondToApproval`,
       `threads.respondToUserInput` and `t3c thread respond`.
    7. **Hooks.** Each request line on stdout starts exactly one run of the
       `--exec` hook, unless the watcher is forced to stop: a second signal, or
       a process end t3c does not control. A hook run is never retried. A hook
       that fails, times out, is stopped or never starts is named on stderr.

    A secret or link card is not a runtime request and is never reported.
  upstream-request-model: |
    These are the server facts the design rests on, read from upstream
    `pingdotgg/t3code` at tags `v0.1.9` and `v0.1.10`. File paths are in that
    repository; line numbers are at `v0.1.10`.

    - **Runtime requests.** A thread projection's `runtimeRequests` hold the
      approvals and questions a provider raised, with `status` `pending`,
      `resolved`, `expired` or `cancelled`. Each has a timeline card: an
      `approval_request` item (`requestKind`, `prompt`, `reason`, `options`,
      `appName`) or a `user_input_request` item (`questions`). For a command
      approval the Claude adapter puts the command itself in `prompt`, and the
      Codex adapter puts the provider's reason when it gives one and the
      command otherwise
      (`apps/server/src/orchestration-v2/Adapters/ClaudeAdapterV2.ts`,
      `CodexAdapterV2.ts`). The library's `pendingRequests` joins each pending
      request with its card. Its kind is `user-input` for a `user_input`
      request and `approval` for every other request kind; this is the
      classification `t3c thread requests` reports.
    - **The shell summary.** A thread row's `pendingRuntimeRequest` is null when
      the thread has no pending runtime request and no waiting secret or link
      card. Otherwise it summarizes one: pending runtime requests sort approvals
      before questions and newest first, and a waiting secret or link card
      replaces a null or question summary when the card is at least as new. A
      card summary has kind `user_input` and the card's turn item id as its id
      (`threadShellFromProjection`, `pendingRuntimeRequestSummary` and
      `secretRequestAsPendingInput` in
      `apps/server/src/orchestration-v2/ProjectionStore.ts`).
    - **What 0.1.10 changes.** Runtime request records, the two card types and
      the response methods are the same in both tags. Two 0.1.10 changes
      touch pending requests:
      - A card summary carries `userOnly: true`
        (`OrchestrationV2PendingRuntimeRequestSummary` in
        `packages/contracts/src/orchestrationV2.ts`): only the user can answer
        a secret or link card. 0.1.9 sends the same card summaries without
        the flag.
      - The shell publishes a subagent thread's secret card, link card and
        user message updates, so a subagent's card summary appears and clears
        on the shell; 0.1.9 drops every subagent turn item update.

      The watcher reads runtime requests from thread watches and full thread
      snapshots, and uses a summary only as the sign that its thread waits, so
      it reports the same requests on both versions. A card summary makes its
      thread waiting like any other, because the card can stand in front of a
      pending question.
    - **The complete read.** The full thread snapshot
      (`GET /api/orchestration/threads/:threadId`, `threads.detail`) reads the
      thread's projection without a window, so it holds every runtime request
      and every card, and its `snapshotSequence` is the thread's latest event
      sequence, read in the same transaction (`getThreadSnapshot`,
      `ProjectionStore.ts:6550-6566`). Cards pass through the wire projection,
      which caps the size of large fields (`projectThreadProjectionForWire`,
      `WireProjection.ts:309`). A soft-deleted thread stays readable: the read
      looks the thread row up by id alone. Reading a pre-V2 thread for the
      first time imports it, which writes its events then
      (`LegacyV1ThreadImporter.ts`). The RPC projection
      (`orchestration.getThreadProjection`) and bounded thread snapshots read a
      window: they keep pending requests and requests whose node or provider
      turn is in the window (`ProjectionStore.ts:4173-4178`), and the cards of
      pending requests (`isRetainedDependency` in `threadHistoryPaging.ts`), so
      they can drop a settled request.
    - **Request updates.** Every site in v0.1.10 that emits a
      `runtime_request.updated` provider event or a `runtime-request.updated`
      domain event, outside tests, is one of these. Paths are under
      `apps/server/src/orchestration-v2/` or `packages/`:

      | Site | What it emits |
      | --- | --- |
      | `Adapters/CodexAdapterV2.ts:5790,5904,5976,6039,6126,6190,6258,6318` | creation, pending |
      | `Adapters/ClaudeAdapterV2.ts:12148,12288,12392` | creation, pending |
      | `Adapters/ClaudeAdapterV2.ts:8921` | settles a pending request (withdrawal) |
      | `Adapters/ClaudeAdapterV2.ts:12437` | `cancelled` on abort without checking the stored state, so it can follow a server settlement |
      | `provider-acp/src/server/adapter.ts:6037,6162` | creation, pending |
      | `provider-acp/src/server/adapter.ts:6263` | settles a pending request |
      | `provider-opencode/src/server/v2/adapter.ts:2576` | creation, pending |
      | `provider-opencode/src/server/v2/adapter.ts:2407` | settles a pending request |
      | `provider-opencode/src/server/adapter.ts:2107` | creation, pending |
      | `provider-opencode/src/server/adapter.ts:2131` | settles a request without checking its stored status, so it can repeat |
      | `provider-pi/src/server/adapter.ts:1882` | creation, pending |
      | `provider-pi/src/server/adapter.ts:1661` | settles a pending request |
      | `provider-pi/src/server/adapter.ts:3596` | `resolved` after delivering a response the server has already settled |
      | `provider-muse/src/server/adapter.ts:1172` | creation, and a re-send of the same request, pending, keeping its id and `createdAt` (the retry at 1328) |
      | `provider-muse/src/server/adapter.ts:1014` | settles a pending request |
      | `ProviderEventIngestor.ts:596` | passes provider events through as domain events, unfiltered |
      | `ProviderEventIngestor.ts:314` | cancels pending native user-input requests at a terminal turn; `EventSink.ts:347-390` drops a `user_input` cancellation unless the stored request is still pending |
      | `ProviderSessionManager.ts:837` | settles pending requests when it releases a session |
      | `Orchestrator.ts:10999` | settles a pending request with the user's answer, refusing any other (10803) |
      | `Orchestrator.ts:12515` | settles pending requests on a run interrupt |
      | `ThreadDeletion.ts:117` | settles pending requests on deletion |
      | `ProviderRuntimeRecoveryService.ts:669` | re-sends a pending question, same id and `createdAt`, answerable by message |
      | `ProviderRuntimeRecoveryService.ts:679` | settles the other pending requests at a restart |

      `RunExecutionService.ts:579`, `ProviderSessionManager.ts:359`,
      `UsageLimitRecoveryWorker.ts:86`, `DelegatedTaskQuestionReactor.ts`,
      `EventSink.ts:373`, `apps/server/src/mcp/OrchestratorMcpService.ts:151`
      and `provider-core/src/server/ProviderAdapter.ts:169` only read or
      declare the event. So a request's first event is its creation, with
      status pending. A later pending event is a re-send by Muse or by restart
      recovery, and a settled event can repeat or follow a settlement. A
      replayed event carries the whole record, not which of these it is.
    - **Thread time.** A request's `createdAt` is stamped when the adapter builds
      it (`ClaudeAdapterV2.ts:8811`), and each event's `occurredAt` when the
      ingestor applies it (`ProviderEventIngestor.ts:282`), so timestamps do
      not order requests against event sequences. Every applied event, request
      and card events included, sets the thread's `updatedAt`
      (`applyToProjection`).
    - **Snapshot answers.** A subscription is answered with a snapshot
      instead of a replay in exactly these cases (`apps/server/src/ws.ts`,
      `ThreadStream.ts`, `ShellStream.ts`, `OrchestrationEventStore.ts`):

      - `orchestration.subscribeThread`, measured over the thread's own events
        after `afterSequence` up to its latest event when the subscription
        starts (`ws.ts:1026,1036`):
        - no `afterSequence` (`ws.ts:1126`);
        - `afterSequence` after that latest event (`ws.ts:1048`);
        - a pruned cursor, before the read or during it
          (`ws.ts:1049,1093-1107`);
        - more than 128 events or more than 1,048,576 bytes of stored payload
          (`ws.ts:1054-1074`, `ThreadStream.ts:17-21`);
        - the range holds the creation of a thread that still exists
          (`ws.ts:1077-1089`);
        - after coalescing, more than 128 events or more than 1 MiB encoded
          (`decideThreadResume`, `ThreadStream.ts:100-118`).

        The subscription first imports a pre-V2 thread
        (`ensureLegacyTranscript`, `ws.ts:918`).
      - `orchestration.subscribeShell`, measured up to the latest application
        sequence when the subscription starts (`ws.ts:1359`):
        - no `afterSequence` (`ws.ts:1336-1342`);
        - a gap of more than 1,000 events, or a cursor ahead of the head
          (`canResumeShellFrom`, `ShellStream.ts:45,63-65`);
        - a pruned cursor, before the read or during it
          (`ShellStream.ts:66`, `ws.ts:1381-1383`);
        - more than 8 MiB of stored payload in the gap (`ShellStream.ts:47,68`).

      With `httpSnapshotFallback` the shell answers each of these with one
      `snapshot-required` item instead. A snapshot is one stream item, sent
      as one socket message whose size the server does not cap, so a large
      one can exceed the client's message limit and fail with
      `message_too_large` (inferred from `rpcInitialItems`; the limit is the
      client transport's).
    - **What no API offers.** Shell listings leave deleted threads out
      (`selectShellThreadRows`, `includeDeleted = false`,
      `ProjectionStore.ts:7857`), and no orchestration RPC method or HTTP route
      replays events across threads or lists deleted threads
      (`ORCHESTRATION_V2_WS_METHODS`, `orchestrationV2.ts:3819`;
      `environmentHttp.ts:764-797`).
    - **Shell publishing.** Every thread event makes the server read the
      thread's row again. It batches a thread's events for 50 ms and coalesces
      them into one row (`subscribeOrchestrationV2Shell` in
      `apps/server/src/ws.ts`). It holds back a row equal to the last row it
      sent for the thread, comparing with `updatedAt` masked, when that row
      went out less than five seconds earlier; a held-back row does not move
      the five seconds (`skipUnchangedThreadShells`,
      `UNCHANGED_THREAD_SHELL_RESEND_MS`, `ShellStream.ts:751-790`). For
      subagent threads the server leaves out node, turn item, provider turn and
      message updates, except, in 0.1.10, secret and link cards and user
      messages; runtime request events always pass
      (`shouldPublishShellApplicationEvent`).
    - **Shell snapshots and resume.** A fresh subscription starts with an
      authoritative snapshot, followed by an enrichment snapshot when some
      project's repository identity is resolved. A subscription with
      `afterSequence` that the server can replay starts with an enrichment
      snapshot when some project's identity is resolved, then the current rows
      of the threads changed after the cursor, then `synchronized`. Any other
      cursor gets the fresh subscription's frames (`subscribeOrchestrationV2Shell`
      in `apps/server/src/ws.ts`; `shellStreamItemsFromInitialSnapshot` and
      `shellStreamItemsFromResumeSnapshot` in `ShellStream.ts`). Upstream's own
      client tells the two kinds apart by `resolvedRepositoryIdentityRoots`
      (`packages/client-runtime/src/state/shell.ts`).
    - **Card order.** The Claude adapter emits a request's
      `runtime_request.updated` event and then its card's `turn_item.updated`
      event, one after the other (`ClaudeAdapterV2.ts:12280-12297`), so a view
      can hold the request before its card.
    - **Archived threads.** The stream's snapshots list active threads. For an
      archived thread, `shellStreamItemFromThreadShell` turns its row into
      `thread.removed`, for the archive and for every later event of the
      thread, and `skipUnchangedThreadShells` never holds back a removal;
      unarchiving publishes its row again. An archived thread keeps its
      `runtimeRequests`. `orchestration.getArchivedShellSnapshot`
      (`shell.archivedSnapshot()`) lists the archived rows, in the same shape
      as active ones, with a `snapshotSequence`.
    - **Process identity.** The server publishes a lifecycle `ready` event once
      per process start, with `payload.at` stamped then
      (`apps/server/src/serverRuntimeStartup.ts:674-684`), and serves the latest
      `ready` event to every subscriber of `subscribeServerLifecycle`
      (`ws.ts`), which needs `orchestration:read`
      (`apps/server/src/auth/RpcAuthorization.ts:218`). A different `ready.at`
      after a reconnect means the server restarted; the same one means the
      connection dropped. The server awaits its startup recovery before it
      publishes `ready` (`serverRuntimeStartup.ts`), so every recovery update
      of a process comes before that process's `ready` event or, at shutdown,
      before the next process's.
    - **Restarts.** When the server shuts down, and again when it starts, it
      ends every pending request (`cancelled` at shutdown, `expired` at
      startup) except live questions with complete cards outside
      provider-native subagent threads, and requests already answerable by
      message. Those keep their id and stay pending, answerable by message. A
      run the restart cut short can continue and raise new requests with new ids
      (`ProviderRuntimeRecoveryService.ts`). Event sequences and projections are
      stored, so cursors stay valid across a restart.
    - **Scopes.** `orchestration.subscribeShell`, `orchestration.subscribeThread`,
      `orchestration.getThreadProjection`,
      `orchestration.getArchivedShellSnapshot`, `subscribeServerLifecycle`,
      `GET /api/orchestration/shell`, the HTTP thread snapshot and
      `GET /api/projects` require `orchestration:read`
      (`apps/server/src/auth/RpcAuthorization.ts`).
  library-api: |
    Task 5 builds this API. `T3Client.requests` is a `RequestsApi` facade over
    the client's `shell` and `threads` facades:

    ```ts
    import { ProfileManager, T3Client } from "@wyrd-company/t3code-lib";

    const client = T3Client.create(await new ProfileManager().resolve());
    const controller = new AbortController();
    process.once("SIGINT", () => controller.abort());
    try {
      for await (const item of client.requests.watch({
        kind: "approval",
        excludeThreadIds: [reviewerThreadId],
        excludeTags: ["reviewer"],
        signal: controller.signal,
      })) {
        if (item.kind === "request") await forward(item.request);
        else if (item.kind === "thread-error") console.error(item.threadId, item.error.code);
      }
    } finally {
      await client.close();
    }
    ```

    ```ts
    export type PendingRequestKind = PendingRequest["kind"]; // "approval" | "user-input"

    /** Which requests a watch reports. Every filter is optional; none selects every request. */
    export interface RequestWatchFilters {
      /** Only threads in these projects. */
      readonly projectIds?: readonly ProjectId[];
      /** Only requests of this kind. */
      readonly kind?: PendingRequestKind;
      /** Never the threads with exactly these ids. */
      readonly excludeThreadIds?: readonly ThreadId[];
      /** Never the threads that carry one of these tags. */
      readonly excludeTags?: readonly string[];
    }

    export interface RequestWatchOptions extends RequestWatchFilters {
      /** Skip the requests pending at the start cut instead of reporting them. */
      readonly skipExisting?: boolean;
      readonly signal?: AbortSignal;
    }

    /** A pending request with the thread and project it belongs to. */
    export type ReportedRequest = PendingRequest & {
      readonly thread: { readonly id: ThreadId; readonly title: string; readonly tags: readonly string[] };
      /** `title` is the project's name; null while the watch has not seen the project. */
      readonly project: { readonly id: ProjectId; readonly title: string | null };
    };

    export type RequestWatchItem =
      | { readonly kind: "request"; readonly request: ReportedRequest }
      | { readonly kind: "synchronized" }
      | { readonly kind: "degraded"; readonly reason: "start-cut" | "unread-threads"; readonly threadIds: readonly ThreadId[] }
      | { readonly kind: "reconnected"; readonly afterSequence: number }
      | { readonly kind: "thread-error"; readonly threadId: ThreadId; readonly error: T3Error }
      | { readonly kind: "decode-error"; readonly error: T3DecodeError };

    export class RequestsApi {
      /** Every request raised on the server after the start, once per run; read-only. */
      watch(options?: RequestWatchOptions): AsyncIterable<RequestWatchItem>;
    }
    ```

    `PendingRequest` is the library's existing type from `threadDerived.ts`, so
    a reported request has the shape `threads.pendingRequests` and
    `t3c thread requests --json` already return, plus `thread` and `project`.
    Its `request` is the record as the watcher's view holds it when it reports,
    so its `status` can already be `resolved`, `expired` or `cancelled`.

    - `request` reports one request, when it becomes reportable: its card is
      in the view, or it comes from a full thread snapshot. Requests that
      become reportable together are reported oldest `createdAt` first.
      Requests of different threads have no order between them.
    - `synchronized` comes once per run, when every thread on the server has
      been read for the start and every initial thread watch has delivered its
      first `synchronized` item (`startup`). From then on, every request is
      placed against the start cut and every later request is reported as it
      is seen.
    - `degraded` comes when the run is not yet synchronized and cannot become
      so without a retry. With `reason: "start-cut"` the watch is retaking the
      start cut and `threadIds` is empty. With `reason: "unread-threads"` every
      thread has been tried once for the start and some could not be read yet;
      `threadIds` names them. The watch keeps retrying, reports their requests
      once a read succeeds, and yields `synchronized` when it is complete. It
      can come again with a shorter list.
    - `reconnected` comes when the shell subscription resumes after a dropped
      socket; `afterSequence` is its cursor.
    - `thread-error` reports a thread watch or read that failed for one thread.
      The watch tries that thread again, as `discovery` describes.
    - `decode-error` passes on a shell or thread item that failed to decode.

    The watch validates its options before it subscribes: ids are nonempty
    strings, `kind` is one of the two kinds, and each tag is a valid
    `ThreadTag` (trimmed, one line, at most 64 characters). A malformed option
    raises `T3PreconditionError`.

    The run ends in three ways. Aborting the signal ends the iteration
    quietly. `client.close()` ends it with the closed connection error. A
    rejected credential ends it with that error: a `T3AuthError`, a
    `T3RpcError` whose tag is `EnvironmentAuthorizationError` (whether or not
    its record decoded), or the transport's fatal refusal of the socket: a 4xx
    answer to the upgrade, close code 1008, or a credential error while
    preparing the socket, which the library reports as a `T3ConnectionError`
    once the transport stops reconnecting (`transport/socket.ts`,
    `transport/socketClose.ts`). Every other failure is recoverable. A thread watch
    resubscribes as `threads.watch` does, and the lifecycle watch resubscribes
    the same way, which task 5 adds around `server.watchLifecycle()`, a single
    subscription. A read that fails with a
    `T3ConnectionError` or a server error (`T3HttpError` with a 5xx status),
    including a call the socket drop rejected, keeps its trigger and runs again
    once the transport is open, with the client's reconnect backoff. Any other
    read or thread watch failure produces a `thread-error` item and is retried
    with that backoff.

    A message too large for the socket closes the socket, so every stream on it
    fails with `message_too_large`, not only the one whose message was too
    large; the error does not name its stream. The watch therefore never ends
    on it: each shell, lifecycle and thread watch resubscribes from its own
    cursor, as after any drop. The shell watch subscribes with
    `httpSnapshotFallback: true` (task 5 adds the option to `shell.watch`), so
    the server answers a resume past its replay window with a small
    `snapshot-required` item instead of an authoritative snapshot frame, and
    thread watches take bounded snapshots, so neither sends a frame of
    unbounded size. When `message_too_large` comes back three times within a
    minute, the watch finds the stream that causes it: it closes every thread
    watch and reopens them one at a time, each after the previous delivered
    its snapshot. A thread whose watch still fails is covered, for as long as
    it stays watched, by full thread snapshots over HTTP at most one second
    apart; the first one that succeeds counts as that thread watch's first
    `synchronized` item. The shell watch's other terminal errors end the run as
    `shell.watch` defines.

    Modules: `src/api/requests.ts` holds `RequestsApi`; `src/api/requestWatch.ts`
    the watch, which drives the shell watch, the lifecycle watch, thread
    watches and reads; `src/api/requestStartup.ts` the startup pass and its
    classification; `src/api/requestIndex.ts` the index and the inclusion rule
    as pure functions; and `src/api/requestLedger.ts` reconciliation: the
    inventories, the card join and the ledger, as pure functions over a
    projection. `src/index.ts` exports `RequestsApi` and the types above.
  discovery: |
    Task 5 builds this. [The decision record](../decisions/request-watch-discovery.yml)
    explains the shape.

    **The index.** The watch reads `shell.snapshot()` and
    `shell.archivedSnapshot()`, and consumes `shell.watch()` from the HTTP
    snapshot's sequence without omission options (`startup`), so it holds a
    row for every thread on the server that is not deleted. For each thread the index keeps its id,
    whether it is active or archived, its project id, title and tags, whether
    its summary is non-null (it waits), and whether `activeRunId` or
    `activityRunStatus` is non-null (it runs). For each project it keeps the
    title.

    | Source | Index change |
    | --- | --- |
    | `shell.snapshot()` at startup | The active rows and projects at `S0`. |
    | `snapshot-required`, then the HTTP shell snapshot | Take the ids the index holds, then replace the active rows with the listed threads, and add or update the listed projects (reconnects). |
    | enrichment `snapshot` | Add or update the listed projects. Threads are unchanged. |
    | `thread.updated` | Add or update the active row. |
    | `thread.removed` | The thread is archived or deleted; its row is marked removed until a full thread snapshot refreshes it. |
    | `project.updated`, `project.removed` | Add, update or remove the project's title. |
    | `shell.archivedSnapshot()` | Add or update every archived row. |
    | a full thread snapshot | Refresh the row from `projection.thread`: project, title, tags, archived or deleted, and whether it waits or runs. |
    | `synchronized`, `reconnected`, `decode-error` | See `startup` and reconnects. |
    | authoritative `snapshot` frame | Not received: the shell watch subscribes with `httpSnapshotFallback` and always with a cursor. |

    **Inclusion.** A thread is excluded when its id is exactly one of
    `excludeThreadIds`, or when one of its own tags, trimmed, equals one of
    `excludeTags`. No other thread is excluded with it: a subagent thread has
    its own id, and is excluded only by its own id or tags. A thread is
    included when it is not excluded and `projectIds` is absent, empty or
    lists its project. Excluded ids are not checked for existence, so a
    reviewer thread can be excluded before it exists. The index decides which
    threads are watched and read; before reporting, the watch applies the
    filters again to the thread record of the view that holds the request,
    the thread watch's projection or the full thread snapshot. A thread whose
    row came only from a removal is filtered on its full thread snapshot.

    **Inventories.** For every thread the watch has read for the start, it
    keeps the thread's inventory: the ids of every runtime request it has
    accounted for, settled ones included. The startup read makes the
    inventory complete for the thread at that read (`startup`), so a request
    whose id is not in it, seen in any later view, was raised after the start
    cut, and is new. A thread first named after the startup catch-up is
    classed against the start cut when it is first seen, with the startup
    subscription and table (`startup`), and its inventory starts there.

    **Two sources of requests.** An included thread is watched while it waits
    or runs, and until six seconds after the latest shell row the watch
    received for it (`rows-the-server-holds-back`). The watch opens
    `threads.watch(threadId, { acceptBoundedSnapshot: true, acceptCompactTurnItems: true })`
    and applies each `snapshot` and `event` item to a projection of its own with
    `applyThreadEvent`, the reducer the thread tracker uses. It reconciles that
    projection after every event. A bounded snapshot can drop a settled
    request, so every `snapshot` item, the first one and any that a resume
    brings, is followed by one full thread snapshot of the thread, and the
    reconciliation runs on it. Every other included thread is read with the
    full thread snapshot, `threads.detail(threadId)`, when:

    - the stream removes it, which it does for an archive, a deletion, and every
      event of an archived thread;
    - it stops being watched, so events its thread watch had not applied yet
      are accounted;
    - it becomes included; or
    - a resume past the shell's replay window answers `snapshot-required`
      (reconnects).

    Each thread has at most one read in flight; a trigger during a read
    schedules one more read after it. A read that shows an archived thread
    waiting or running starts its watch; the watch of an archived thread ends
    when its own projection shows it neither waits nor runs.

    **Reconciliation.** Reconciliation compares a view's `runtimeRequests` with
    the thread's inventory. Each request not in it is added to the inventory
    and, when its startup class says so (`startup`), reported: new requests
    always, existing ones unless `skipExisting` is set, settled-before-start
    ones never. The `kind` filter applies here, per request; the other filters
    apply as `Inclusion` says. A request to report is reported once the view
    holds its card, the `approval_request` or `user_input_request` turn item
    whose `requestId` is the request's id. A settled request is reported from
    a full thread snapshot, with the card it holds or with none. A pending
    request without its card, in any view, waits up to two seconds; in a
    watched thread the card's arrival reports it. Otherwise the watch takes a
    full thread snapshot after the two seconds, retried like any read while the
    connection is down, and reports the request from it, with the card it holds
    or with none. Reporting adds the
    key to the ledger and builds the `ReportedRequest` from the request, its
    card and the view's thread record: the thread's title and tags, and the
    project id with the index's project title.

    **Failures.** A failed read or thread watch is retried as `library-api`
    says. While a thread's startup read has not succeeded, the thread is
    degraded (`startup`). A failed read after startup keeps its trigger, so
    no change of the thread goes unread.
  startup: |
    Task 5 builds this. It applies the operator's decision on #169
    ([comment](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7038649689)).

    **The cut.** The watch subscribes to the server lifecycle
    (`server.watchLifecycle()`) and records the latest `ready` event's
    `payload.at`, the process identity, waiting for that event when the server
    is still starting, so the startup recovery is behind the cut. It reads the
    HTTP shell snapshot (`shell.snapshot()`); its `snapshotSequence` is the
    start cut `S0`, and its threads are the active rows at `S0`. It reads
    `shell.archivedSnapshot()`, whose rows are the archived threads at its own
    sequence `Sa`, later than `S0`. It then subscribes to the shell with
    `afterSequence: S0` and `httpSnapshotFallback: true`, as upstream's own
    client resumes after an HTTP snapshot: the catch-up brings the current row
    of every thread that changed after `S0`, or a removal, and ends with
    `synchronized` at a sequence no earlier than `Sa`. The socket connection
    that carries the lifecycle subscription must stay open from the lifecycle
    read through the archived read; a server restart drops every socket, so an
    unbroken connection shows that one server process served the cut.

    **Retaking the cut.** The catch-up must replay. When the server answers it
    with `snapshot-required`, because the gap since `S0` passed the shell's
    replay window, or the connection drops before the archived read completes,
    the startup set cannot be known from this cut. The watch then yields
    `degraded` with reason `start-cut`, drops the cut, and takes a new one:
    the lifecycle check, the HTTP shell snapshot, the archived snapshot and the
    catch-up, with the client's reconnect backoff between attempts. No thread
    is read or classed for the startup until a cut's catch-up has replayed and
    ended with `synchronized`. The start of the run is the cut it keeps: a
    request that settled before that cut, on an earlier attempt's watch or not,
    settled before the start, as it would for a watcher launched at that cut.

    **The startup set.** The startup set is every thread in either snapshot,
    and every other thread that an item of the catch-up names. A thread that
    existed at `S0` and is not deleted is in one of them: it was active at
    `S0`, archived at `Sa`, or unarchived between the two reads, which the
    catch-up shows. A thread first named later, by a row or a removal, is
    classed against `S0` the same way when it is first seen, so the time the
    watch discovers a thread is never evidence of when it was created.

    **The startup read.** The watch reads every thread in the startup set once,
    a few at a time, whether it is included or not, threads the HTTP shell
    snapshot does not list first, and so learns every thread's inventory. For
    each thread it first subscribes from the cut with a raw
    `orchestration.subscribeThread` call (`afterSequence: S0`,
    `acceptBoundedSnapshot: true`, `acceptCompactTurnItems: true`,
    `requestCompletionMarker: true`), not `threads.watch`, which would load an
    HTTP snapshot of its own. The server starts the live stream before it reads
    the thread's high-water, so every event after the subscription starts
    arrives on it. It then answers with a replay of the thread's events after
    `S0` followed by `synchronized`, which is `synchronized` alone when there
    is nothing to replay, or with a bounded snapshot
    (`upstream-request-model`, Snapshot answers). Then the watch takes the full
    thread snapshot over HTTP, whose `snapshotSequence` is `Dt`, the thread's
    latest event, and keeps reading the subscription until it has seen the
    thread's events through `Dt`; replay and live items carry their sequences.

    - A snapshot whose `snapshotSequence` is at or before `S0` comes from the
      idle branch: the thread had no event after the cut when the server read
      its high-water, so every later event arrives live, and the answer counts
      as an empty replay.
    - A snapshot whose `snapshotSequence` is after `S0` can be the replay
      limit, the creation of a live thread or a pruned cursor, or the idle
      branch with an event between the server's two reads. The watch
      subscribes from `S0` once more: the thread's high-water is now after
      `S0`, so a second snapshot after `S0` is not the idle branch, and the
      answer stands as the server's. A replay on the retry is classed as a
      replay.

    The subscription stays open as the thread watch when the thread is
    watched, and closes otherwise.

    The class of each request `R` in the full snapshot depends on these facts:

    - **A**: `snapshot` when the subscription's answer, after the retry, is a
      snapshot whose `snapshotSequence` is after `S0`; otherwise `replay`.
    - **C**: the replayed or live events through `Dt` include the thread's
      creation. The server replays it only for a thread that no longer
      exists; for a live thread it sends a snapshot instead.
    - **L**: the HTTP shell snapshot lists the thread.
    - **W**: the thread was waiting at `S0`: listed, with a non-null summary.
    - **X**: the server restarted between the lifecycle read before `S0` and the
      thread's full read. X is false when the socket connection stayed open
      through that whole interval. After a reconnect in it, the watch reads
      the lifecycle again on the new connection: a `ready.at` other than the one
      recorded before `S0` makes X true, the same one false. The thread's class
      waits for that read.
    - **E**: `R`'s first event through `Dt`: none, pending or settled.
    - **K**: `R` is known pending at `S0`: it is the thread's summary at `S0`,
      or `Dt` is at or before `S0` and `R` is pending in the full snapshot.

    | # | Condition | Class |
    | --- | --- | --- |
    | 1 | A snapshot, not L | new: the thread counts as created after `S0` (decided, [7041498801](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7041498801)) |
    | 2 | A snapshot, L | pending `R`: reported, also with `skipExisting`; settled `R`: settled before start (the replay limit, decided, [7038649689](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7038649689)) |
    | 3 | A replay, C | new: the thread was created after `S0` |
    | 4 | A replay, not C, X, at least one event after `S0`, and W or not L | pending `R`: reported, also with `skipExisting`; settled `R`: settled before start (a restart, decided, [7038649689](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7038649689)) |
    | 5 | A replay, not C, not row 4, E none | existing if pending, settled before start if settled: nothing changed `R` since `S0` |
    | 6 | A replay, not C, not row 4, E pending, K | existing: `R` was pending at `S0` |
    | 7 | A replay, not C, not row 4, E pending, not K, L and not W | new: nothing was pending at `S0`, so the event created `R` |
    | 8 | A replay, not C, not row 4, E pending, not K, W or not L | new: the event is `R`'s creation or a re-send of a request pending at `S0`, which 0.1.10 cannot tell apart (pending the standing rule, [7042028104](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7042028104)) |
    | 9 | A replay, not C, not row 4, E settled, L and not W | settled before start: nothing was pending at `S0`, so the event re-emits a settlement |
    | 10 | A replay, not C, not row 4, E settled, K | existing: `R` was pending at `S0` and settled after it |
    | 11 | A replay, not C, not row 4, E settled, not K, W | existing (decided, [7041498801](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7041498801)) |
    | 12 | A replay, not C, not row 4, E settled, not K, not L | existing: the thread's state at `S0` is unknown (pending the standing rule, [7042028104](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7042028104)) |

    Each request falls on exactly one row. A is `replay` or `snapshot`, and a
    snapshot answer splits on L (rows 1 and 2). A replay splits on C (row 3),
    and then meets row 4's condition or not; an idle-branch answer with no
    event after `S0` never does, and its state at `S0` is exact. Otherwise E is
    none, pending or settled. E none is row 5. With E pending, K holds or not;
    without K, L and not W is the complement of W or not L (rows 6 to 8). With E
    settled, L and not W excludes K, because K needs W or a `Dt` at or before
    `S0`, which leaves E none; the rest splits on K and then on W, and not W
    there means not L (rows 9 to 12).

    Rows 1 to 3 come before row 4, so creation evidence and the replay limit
    take precedence over the restart case: a thread created after `S0` is new
    even when the server restarted before its read. Rows 4 to 12 hold threads
    that existed at `S0`. Rows 8 and 12 apply the standing rule proposed on
    #169, which gives a request 0.1.10 cannot place the class under which it is
    reported, and row 2's replay limit is the server's whole limit (more than
    128 events, more than 1 MiB, or a pruned cursor) as the same proposal reads
    the decided case. They stand as written until the operator answers; an
    answer that differs changes those rows only.

    The decided and proposed rows cost the following, and nothing else is
    lost or over-reported at startup:

    - Rows 2 and 4 report a pending request even with `skipExisting`, and lose
      a request raised after `S0` that settled before the thread's read.
    - Row 1 reports the settled requests of a thread archived at `S0`, or one
      the watch first sees long after startup, whose replay is past the limit,
      though they settled before `S0`.
    - Row 11 reports, without `skipExisting`, a request whose settlement a
      provider re-emitted after `S0` though it settled before `S0`.
    - Row 8 reports a request pending at `S0` that a provider re-sent, even
      with `skipExisting`; row 12 reports, without `skipExisting`, a request
      of a thread archived at `S0` that settled before `S0`, when a provider
      re-emitted its settlement.

    A pre-V2 thread is imported when its startup subscription first touches
    it (`ensureLegacyTranscript`); the events the import writes come after
    `S0`, and the table classes them like any others.

    Every request a thread gains after its startup read is new. Until a
    thread's startup read has classed its requests, the watch holds that
    thread's other read triggers and its thread watch's reconciliation, and
    runs them after it.

    **Readiness.** The watch yields `synchronized` when the shell's catch-up
    has ended with `synchronized`, the archived snapshot has been read,
    every thread in the startup set has had its startup read, and every
    included thread that waits or runs has delivered its first `synchronized`
    item, or, for a thread whose watch is replaced by full thread snapshots,
    had its first one succeed. While it retakes the cut, it yields `degraded`
    with reason `start-cut`. When every thread has been tried once and some
    startup reads failed, it yields `degraded` with reason `unread-threads`
    and those threads' ids, keeps retrying them, and yields `synchronized`
    when the last one succeeds. A script that sees
    `synchronized` knows every request on the server is placed; one that sees
    `degraded` knows which threads are not yet covered.

    The CLI prints `t3c: watching for requests` on stderr at `info` level for
    `synchronized`, so a script run with `--log-level info` can wait for it,
    and `t3c: retaking the start cut` or `t3c: watching, but <n> threads are
    not read yet` at `warn` level for `degraded`.
  reconnects-and-restarts: |
    Task 5 builds this, on the resume behavior of `shell.watch` and
    `threads.watch` that `library-facades` defines. The watch relies on
    `shell.watch` moving its resume cursor only on an authoritative snapshot,
    as `two-kinds-of-shell-snapshot` explains; a `shell.watch` that moves it on
    an enrichment snapshot drops the rows that follow it. `shell.watch`
    follows that rule, for live and resumed subscriptions, by task 2's commit
    `8ecef8a` (`fix(lib): keep the shell watch cursor at a marked snapshot`)
    on the epic branch, and task 5 builds on it.

    - **Dropped connection.** The transport reconnects with backoff. The shell
      watch, the lifecycle watch and each open thread watch resubscribe with
      their own cursor and wait through failures without an attempt limit.
      Reads that the drop interrupted run again once the transport is open. A
      resumed thread watch applies the replayed events to its projection, or
      takes a full thread snapshot after a new bounded snapshot, so a request
      raised and settled in a watched thread during the outage is reported.
    - **Shell replay.** A resume the server can replay brings the current row of
      every thread that changed after the cursor, and a removal for every
      thread archived or deleted, each a read trigger. A deleted thread stays
      readable, so its requests are reported.
    - **Authoritative resume.** A resume past the shell's replay window is
      answered with `snapshot-required`. The watch reads the HTTP shell
      snapshot, which no socket limit applies to, and `shell.archivedSnapshot()`
      again, and subscribes once more with `afterSequence` set to the HTTP
      snapshot's `snapshotSequence`. Before it replaces any row, it takes the
      ids of every thread the index held, and reads every included thread in
      the union of those ids and both new listings once with the full thread
      snapshot. A thread that existed before the outage and was deleted during
      it is therefore still read. Each inventory shows the
      requests raised during the outage, settled or not. A thread created and
      deleted inside that outage appears in neither snapshot, and its requests
      are the case #169 excepts. The inventories and the ledger stay as they
      are.
    - **Server restart.** The socket drops, the lifecycle `ready.at` changes,
      and the server comes back with its stored events and projections, so
      the same cursors resume and the reads see every request. Pending
      approvals end at shutdown or startup, as `cancelled` or `expired`, and a
      request first seen in that state is reported with it. A continued run
      that asks again raises a new request id, which is reported once.
      Questions that survive keep their id, so they are not reported again.
    - **Thread watch reopened.** A thread that stops waiting and running and
      later starts again gets a new thread watch and a full thread snapshot;
      the ledger drops the requests already accounted.

    The inventories and the ledger last for the run.
  command: |
    Task 6 builds the command. Task 7 adds `--ignore-defaults` and the defaults
    it controls.

    ```text
    t3c requests watch [--project <id>]... [--kind approval|user-input]
                       [--exclude-thread <id>]... [--exclude-tag <tag>]...
                       [--skip-existing] [--ignore-defaults]
                       [--exec <command> [--exec-concurrency <n>] [--exec-timeout <duration>]]
    ```

    `requests` is a command group like `thread` and `schedule`, named in the
    plural because `request` reads as a verb. Its one leaf is `watch`. The
    global options `--server`, `--credentials`, `--json`, `--log-level` and
    `--connect-timeout` apply as for every command.

    | Option | Value | Library option or behavior |
    | --- | --- | --- |
    | `--project <id>` | repeatable project id | `projectIds` |
    | `--kind <kind>` | `approval` or `user-input` | `kind` |
    | `--exclude-thread <id>` | repeatable thread id | `excludeThreadIds` |
    | `--exclude-tag <tag>` | repeatable tag | `excludeTags` |
    | `--skip-existing` | flag | `skipExisting` |
    | `--ignore-defaults` | flag | the profile's `requestWatch` defaults are not read |
    | `--exec <command>` | command line | runs the hook; see `exec-hook` |
    | `--exec-concurrency <n>` | positive integer, default 4; requires `--exec` | hooks that run at once |
    | `--exec-timeout <duration>` | duration, default `10m`; requires `--exec` | how long one hook runs |

    Repeated values are deduplicated. A malformed tag, a concurrency that is not
    a positive integer, a malformed duration, or `--exec-concurrency` or
    `--exec-timeout` without `--exec` is a usage error (exit 2).

    **Preflight.** Before it watches, the command reads the server's projects
    once with `client.projects.snapshot()`. That read settles reachability (exit
    8), the credential and `orchestration:read` (exit 9), and that every
    selected project exists (exit 10, naming the missing id), as policy requires
    for explicitly selected resources. Then the command iterates
    `client.requests.watch` with the resolved filters and the signal scope's
    abort signal.

    **Output.** stdout carries one line per reported request, the format in
    `output-line`, in text mode and in `--json` mode. stderr carries everything
    else:

    | Event | stderr line | Level |
    | --- | --- | --- |
    | `synchronized` | `t3c: watching for requests` | info |
    | `reconnected` | `t3c: reconnected` | info |
    | `degraded`, reason `start-cut` | `t3c: retaking the start cut` | warn |
    | `degraded`, reason `unread-threads` | `t3c: watching, but <n> threads are not read yet` | warn |
    | `thread-error` | `t3c: could not watch thread <id>: <error message>` | warn |
    | `decode-error` | `t3c: skipped a server item that could not be decoded` | warn |
    | hook outcomes | see `exec-hook` | error, or info for success |
    | end of the watch | the short final error line policy defines | always |

    `<id>` is the thread id and `<error message>` the error's message, each
    written as a JSON string. Lines at `info` level print with
    `--log-level info` or `debug`; the default level, `warn`, prints the rest.

    **Exit codes.** A watch has no successful end; every end is one of these,
    from the policy table:

    | Code | When |
    | --- | --- |
    | 1 | Unexpected error, or profile config or credential storage failure. |
    | 2 | Usage error, including malformed `requestWatch` defaults. |
    | 4 | SIGINT or SIGTERM. |
    | 8 | The preflight cannot reach the server, or a connection error ends the watch, including a credential the server rejects after the preflight. |
    | 9 | The preflight's credential is rejected or lacks `orchestration:read`, or the server refuses a subscription for missing scope. |
    | 10 | A selected project does not exist. |

    These follow the common mapping in `errors.ts`: the library reports a
    credential rejected on the socket as a connection error.

    A hook's result never changes the exit code. In `--json` mode the last
    stdout line is the result, in the streaming form policy defines for
    `--stream --json`; the handler finishes through an `Output` in streaming
    mode, so the result carries `type`:

    ```json
    {"type":"result","data":{"reported":3,"hooks":{"succeeded":2,"failed":1,"stopped":0,"notRun":0}},"exitCode":4,"error":{"code":"interrupted","message":"Operation interrupted."}}
    ```

    `data.hooks` is null without `--exec`. `error` has the shape of every other
    command's JSON error. Every end after the arguments parse writes this line
    last, including a failed preflight.

    **Stopping.** The command uses the CLI's one signal scope
    (`execution/signals.ts`). On the first SIGINT or SIGTERM, or on any other
    end of the watch, it aborts the watch, so no request is reported after it,
    and the hook runner drains as `exec-hook` describes. Then the client
    closes, `--json` writes the result line, stderr ends with the final line,
    and the process exits.

    A second signal makes `followSignals` call `process.exit(4)` at once, so
    nothing asynchronous runs after it. Task 6 gives `followSignals` an
    optional second argument, `{ onForcedStop?: () => void }`, a synchronous
    callback the scope runs just before that `process.exit(4)`; every other
    command passes nothing and keeps its behavior. `requests watch` passes a
    callback that, without awaiting anything:

    1. sends SIGKILL to every hook process group still present;
    2. writes each hook's `stopped` or `not run` line and the short final
       error line to stderr with `fs.writeSync(2, …)`;
    3. in `--json` mode, writes the result line to stdout with
       `fs.writeSync(1, …)`, with `exitCode` 4.

    `Output` gains a synchronous `finishForced(result)` for steps 2 and 3, so
    the result still goes through the output boundary and is written once.

    Modules: `src/requests/index.ts` exports `requestsHandlers` with the
    `requests watch` handler, which the composition root adds beside the other
    handler families. `src/requests/watch.ts` holds the handler,
    `src/requests/line.ts` the line format, and `src/requests/hookRunner.ts`
    the hook runner.
  output-line: |
    Task 6 builds this. Each reported request is one line: a JSON object
    followed by `\n`. `JSON.stringify` escapes newlines inside strings, so a
    line never contains one. Consumers ignore fields they do not know; fields
    are only ever added.

    | Field | Value |
    | --- | --- |
    | `type` | `"request"` |
    | `kind` | `"approval"` or `"user-input"` |
    | `requestId` | the runtime request id, as `thread respond --request` takes it |
    | `thread` | `{id, title, tags}` from the thread record of the view that holds the request, the same record the filters use (`discovery` Reconciliation) |
    | `project` | `{id, title}`; `id` from the same thread record, `title` the project's name from the index, or null when unknown |
    | `request` | the server's runtime request record (`kind` is the server's request kind, such as `command` or `file-change`) |
    | `item` | the request's timeline card as the server gives it, or null when the thread holds none |
    | `questions` | for `user-input` only: the card's questions |

    `kind`, `requestId`, `request`, `item` and `questions` are the library's
    `PendingRequest`, the object `t3c thread requests --json` returns, with an
    absent card written as null instead of left out. `request.status` is the
    request's status when the watcher reported it: a request raised and settled
    while the watcher was away is reported as `resolved`, `expired` or
    `cancelled`, and a hook answers only a `pending` one. For
    an approval, `item.prompt` holds the command or the provider's description
    of the action; for a question, `questions` holds the questions and their
    options. A hook that needs more, such as a file change's diff, reads the
    thread.

    An example line, wrapped here for reading:

    ```json
    {"type":"request","kind":"approval","requestId":"request-1",
     "thread":{"id":"thread-1","title":"Fix the build","tags":[]},
     "project":{"id":"project-1","title":"example"},
     "request":{"id":"request-1","nodeId":"node-1","providerTurnId":"provider-turn-1",
      "nativeRequestRef":{"driver":"claudeAgent","nativeId":"native-1","strength":"strong"},
      "kind":"command","status":"pending",
      "responseCapability":{"type":"live","providerSessionId":"session-1","supportsFeedback":true},
      "createdAt":"2026-01-01T00:00:00.000Z","resolvedAt":null},
     "item":{"id":"item-1","threadId":"thread-1","runId":"run-1","nodeId":"node-1",
      "providerThreadId":"provider-thread-1","providerTurnId":"provider-turn-1",
      "nativeItemRef":null,"parentItemId":null,"ordinal":4,"status":"waiting","title":null,
      "startedAt":"2026-01-01T00:00:00.000Z","completedAt":null,
      "updatedAt":"2026-01-01T00:00:00.000Z","type":"approval_request",
      "requestId":"request-1","requestKind":"command","prompt":"npm test"}}
    ```
  exec-hook: |
    Task 6 builds the hook runner in `src/requests/hookRunner.ts`.

    **Start.** For each reported request, after its stdout line is written, the
    runner queues one hook run. Runs start in report order whenever fewer than
    `--exec-concurrency` hooks are running. The queue holds one line per waiting
    run.

    **Command.** The runner starts `--exec`'s text with the platform shell, as
    Node's `spawn(command, { shell: true })` does (`/bin/sh -c` on POSIX), in
    t3c's working directory. The shell receives only the operator's text, fixed
    when the watcher starts. On POSIX the hook leads its own process group, so
    the runner can signal the hook and everything it started; on other
    platforms the runner signals the hook process alone.

    **stdin.** The hook's stdin receives the request's line, byte for byte the
    line written to stdout, and then end of file. A hook that exits without
    reading stdin is not a failure for that reason; a broken pipe on stdin is
    ignored. Nothing from the request goes into the hook's arguments or
    environment.

    **Environment.** The hook inherits t3c's environment, and the runner sets
    `T3_SERVER_URL` to the origin of the server the watcher is connected to,
    however that server was selected. A `t3c` command the hook runs therefore
    reaches the server the request came from, even after the current profile
    changes, and takes the credential of the first profile whose origin
    matches, or `T3_TOKEN` when the watcher's environment sets it. A credential
    given with `--credentials` is not passed on; such a hook passes the file to
    its own `t3c` commands.

    **Output.** The hook's stdout and stderr go to t3c's stderr, never to its
    stdout, line by line, each line prefixed with `t3c: hook <requestId>: `
    with the request id as a JSON string. A last line without a newline is
    written when the hook exits.

    **Concurrency and timeout.** `--exec-concurrency` defaults to 4, so a slow
    hook for one request does not hold back the others. A hook run lasts until
    its whole process group is gone, not until its shell exits: the runner
    tracks the group by its id, and checks it with signal 0 to the group
    (`process.kill(-pgid, 0)`, which fails with `ESRCH` once no member is
    left) when the shell exits, after each signal, and every 100 ms while a
    member remains. A hook's slot frees only then, so a shell that exits while
    a child that ignores SIGTERM keeps running still holds its slot. A run
    whose group is still present after `--exec-timeout` receives SIGTERM to the
    group, and SIGKILL to the group five seconds later if any member remains;
    the escalation follows the group, whether or not the shell has already
    exited. On other platforms the runner tracks and signals the hook process
    alone. The default of `10m` leaves room for a hook that asks a reviewer
    thread and waits for its answer.

    **Outcomes.** Each run ends with one outcome, printed when its process
    group is gone; exit status and signal are the shell's. A success prints a line at
    `info` level; every other outcome prints at `error` level, and
    `<requestId>` and `<threadId>` are JSON strings:

    | Outcome | stderr line |
    | --- | --- |
    | Exit 0 | `t3c: hook finished for request <requestId>` |
    | Nonzero exit | `t3c: hook failed for request <requestId> in thread <threadId>: exit <n>` |
    | Ended by a signal it did not get from t3c | `t3c: hook failed for request <requestId> in thread <threadId>: signal <name>` |
    | Timed out | `t3c: hook failed for request <requestId> in thread <threadId>: timed out after <duration>` |
    | The process did not start | `t3c: hook failed for request <requestId> in thread <threadId>: could not start` |
    | Stopped by a forced stop | `t3c: hook stopped for request <requestId> in thread <threadId>` |
    | Queued at a forced stop | `t3c: hook not run for request <requestId> in thread <threadId>` |

    A failed hook is not retried, and the watcher keeps running.

    **Stop.** A first SIGINT or SIGTERM, or an error that ends the watch, stops
    reporting and then drains: every request already written to stdout still
    gets its hook run. Queued runs start as slots free, running hooks finish,
    and each run keeps its `--exec-timeout` and its escalation, so the drain
    ends within the queue's length divided by `--exec-concurrency`, times the
    timeout plus five seconds. A second signal forces the stop, synchronously,
    through the signal scope's forced-stop callback (`command` Stopping): the
    runner sends SIGKILL to every hook process group still present, reports
    each running hook as stopped and each queued run as not run, and the
    process exits 4. The runner also registers a process `exit` handler that
    sends SIGKILL to every hook process group still present, so no hook
    outlives a t3c that exits by any path that runs `exit` handlers. A request
    whose hook did not run, and that is still pending when the next run
    starts, is reported by that run unless `--skip-existing` is given.
  spawn-exception: |
    Task 6 changes the rule's wording and adds its test.
    [The decision record](../decisions/exec-hook-spawn-exception.yml) holds the
    operator's approval and its reason.

    The hook runner is the one place where application code spawns a process.
    It exists because #169 requires a hook per request with stdin-only
    delivery, failure isolation, bounded concurrency and a timeout, which a
    consumer's own loop over the lines does not give. The library stays free of
    child processes; the runner lives in the CLI, which adapts library output
    to the operator's environment.

    The conventions paragraph of the root `AGENTS.md` changes from

    ```text
    Application code must not spawn CLIs. The CLI composes the library and does
    not implement wire protocol. Only build/test tools may spawn the test server.
    ```

    to

    ```text
    Application code must not spawn CLIs, with one exception: the hook runner of
    `t3c requests watch` (`packages/t3code-cli/src/requests/hookRunner.ts`)
    runs the operator's `--exec` command, with the request on stdin only. A test
    fails when any other application source imports `node:child_process`. The
    CLI composes the library and does not implement wire protocol. Only
    build/test tools may spawn the test server.
    ```

    The test lists the files under `packages/*/src` that are not tests (`*.test.ts`)
    and fails unless `hookRunner.ts` is the only one that imports
    `node:child_process` or `child_process`.
    `composition.yml` states the same exception.
  config-defaults: |
    Task 7 builds this.

    A server profile in the t3c config (`config.json`, `docs/profiles.md`) can
    hold default filters under `requestWatch`. Its keys are the library's
    `RequestWatchFilters`:

    ```json
    {
      "servers": {
        "sample": {
          "url": "https://server.example",
          "requestWatch": {
            "projectIds": ["project-1"],
            "kind": "approval",
            "excludeThreadIds": ["thread-reviewer"],
            "excludeTags": ["reviewer"]
          }
        }
      },
      "current": "sample"
    }
    ```

    - **Shape.** `requestWatch` is an object. `projectIds`, `excludeThreadIds`
      and `excludeTags` are arrays of nonempty strings, each tag a valid
      `ThreadTag`, and `kind` is `approval` or `user-input`. Every key is
      optional, and unknown keys inside `requestWatch` are ignored. Only
      filters are stored: `--skip-existing` and the `--exec` options come from
      the command line alone, so no file can supply a command to run.
    - **Reading.** `ProfileManager.requestWatchDefaults(name)` reads the named
      profile's `requestWatch` and returns `RequestWatchFilters`, empty when
      the key is absent. A malformed value raises `T3PreconditionError`, which
      `requests watch` reports as exit 2 naming the profile. `loadConfig`
      validates only each server's `url` and keeps its other keys, so a config
      with `requestWatch`, well formed or not, loads unchanged for every other
      command.
    - **Which profile.** The defaults come from the profile that
      `ProfileManager.resolve` selects for the server: the current profile, or
      the profile whose normalized origin matches `--server` or
      `T3_SERVER_URL`. A server without a matching profile has no defaults.
      Credential overrides do not change which profile supplies them.
    - **Precedence.** Each of the four filters is taken from its flag when the
      flag is given, with all its occurrences, and from the profile otherwise.
      A flag replaces the profile's value for that filter; it does not add to
      it. `--ignore-defaults` reads no profile defaults, so the flags alone
      apply.
    - **Writes.** t3c never writes `requestWatch`; the operator edits the
      config. Registering a profile again with `auth pair` or a session token
      replaces only the entry's `url` and keeps its other keys, so a renewed
      credential keeps its defaults. `auth switch` keeps every key, and
      `auth logout` removes the entry with its defaults. Config writes stay
      atomic as `profile-storage` defines. A config without `requestWatch`,
      such as one the previous t3c release wrote, loads unchanged and watches
      everything.
  verification: |
    Fake-server tests show each guarantee in the cases that break a weaker
    design. Task 5 owns the library cases and task 6 the command cases.

    - **Card order (task 5).** In a watched thread, a request's record arrives
      before its card, and in another test after it: both report one line with
      the card. The socket drops between the record and the card, and the
      server writes the card while the client is away: no line is written
      during the outage, and the line after the reconnect carries the card. A
      pending request whose card never arrives is reported without it, from a
      full thread snapshot taken after two seconds.
    - **Outage (task 5).** An idle thread raises a request while the socket is
      down, and the request is answered before the reconnect; the shell replay
      brings only the thread's current row, with a null summary. The request is
      reported once, as `resolved`. The same holds when the resume answers
      `snapshot-required`, when the thread was watched before the drop, and
      when the settled request lies outside the bounded window, so that only
      the full thread snapshot holds it.
    - **Read interrupted (task 5).** The socket drops while a full thread
      snapshot read is in flight; the read is retried after the reconnect, the
      run continues, and its ledger survives.
    - **Removal metadata (task 5).** While the watcher is disconnected, an
      included thread gains an excluded tag and is then archived, so the replay
      brings only a removal; no request of that thread is reported.
    - **Held-back row and latency (task 5).** An unwatched thread sends a row
      at 0 ms; it raises an approval at 50 ms and settles it at 65 ms, so the
      server holds back the equal row. The approval is reported, and the line
      is written less than five seconds after the approval was raised.
    - **Restart (task 5).** Across a server restart, a pending approval and a
      surviving question are each reported once.
    - **Archived threads (task 5).** An archived thread holds a pending
      question when the run starts; it is reported. A thread is archived while
      a question in it is pending and the watcher is disconnected; it is
      reported after the reconnect.
    - **Startup classes (task 5).** One test for each row of the startup table,
      and these combinations:
      - With `skipExisting`, request A is pending at `S0` and request B is
        raised just after it. Whether B comes before or after the thread's
        subscription and read, A is skipped and B is reported.
      - 129 events arrive in a thread after its startup subscription and
        before its full read; the class is still taken from the subscription's
        replay.
      - A thread is created after `S0`, raises an approval, and the server
        restarts before its startup read. The thread lands on row 1 ahead of
        row 4, and the cancelled approval is reported.
      - The Muse adapter re-sends a request that was the thread's summary at
        `S0`, which is existing (row 6), and one that was not, which is new
        (row 8).
      - A thread archived at `S0` with a pending question is unarchived and
        the question settled before its read; the question is existing
        (row 12).
      - A thread with no event since `S0` gets an idle-branch snapshot, and its
        pending requests are existing even across a restart in the window.
      - A thread unarchived between the HTTP shell snapshot and the archived
        read is in the startup set.
    - **Cut retake (task 5).** The startup catch-up is answered with
      `snapshot-required`, and in another test the connection drops before the
      archived read completes. The watch yields `degraded` with reason
      `start-cut`, takes a new cut, and yields `synchronized` after the new
      cut's catch-up replays.
    - **Resume past the window (task 5).** After a long outage the shell resume
      is answered with `snapshot-required`. The watch reads the HTTP shell
      snapshot, subscribes again from its sequence, reads the union of the
      threads it held and the new listings, and reports each request raised
      during the outage once, keeping its ledger, including a request in a
      thread it held that was deleted during the outage.
    - **Oversized frame (task 5).** A thread watch's frame exceeds the socket
      limit, so every stream on the socket fails with `message_too_large`.
      Every watch resubscribes and the run continues. When it repeats, the
      watch reopens thread watches one at a time, and the failing thread is
      covered by full snapshots, its first success counting toward readiness.
    - **Startup subscription (task 5).** An idle thread whose high-water is
      before `S0` gets a snapshot answer; a request raised between the server's
      two reads makes its sequence after `S0`, and the retry replays it. An
      empty replay ends with `synchronized`. A thread created after `S0` and
      deleted before its read replays its creation and lands on row 3. A
      thread deleted long before startup and deleted again later is classed
      against `S0`, and its old requests stay settled before start.
    - **Readiness (task 5).** `synchronized` comes only after every startup
      read succeeded. With one thread whose reads fail, `degraded` names it,
      and `synchronized` follows its first successful read. A waiting thread
      whose watch keeps failing with `message_too_large` is covered by full
      thread snapshots, and its first successful one lets `synchronized` come.
    - **Exact exclusion (task 5).** With `excludeThreadIds: [manager]`, a
      subagent worker thread whose parent is the manager reports its
      approvals.
    - **Drain (task 6).** With `--exec-concurrency 1`, hook A running and
      request B reported and queued, a first SIGTERM lets A finish and B run;
      a second signal during A reports B as not run.
    - **Hook server (task 6).** The watcher connects through the current
      profile A; the current profile then switches to B; the hook's
      `T3_SERVER_URL` still names A's origin.
    - **Hook process group (task 6).** With `--exec-concurrency 1`, a hook times
      out; its shell exits on SIGTERM while a child that ignores SIGTERM keeps
      the group alive. The slot stays held, SIGKILL reaches the group five
      seconds later, and the next hook starts only after the group is gone.
    - **Forced stop (task 6).** A second signal kills every hook group, writes
      the `stopped` and `not run` lines and, with `--json`, the result line
      with `exitCode` 4, and exits 4. `run` and `thread send` keep their
      second-signal behavior.
    - **Serialization (task 6).** A thread first seen in a removal, with a stale
      cached row, is reported with the title and tags of its full thread
      snapshot, the record the filters used.
  contract-changes: |
