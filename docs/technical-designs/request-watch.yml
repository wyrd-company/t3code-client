$schema: https://refinery.systems/ontology/technical-design
title: Request watcher
objective: >-
  Report each approval and question that a T3 Code server's threads hold
  pending, once per run, through a public library watch and the
  `t3c requests watch` command, and run an operator's hook command once for
  each reported request.
relationships:
  related-to:
    - library
    - library-facades
    - composition
    - cli-architecture
    - tool-scope
    - profile-storage
  references:
    - request-watch-discovery
    - exec-hook-spawn-exception
    - command-line
    - cli-surface
    - profiles
    - policy
    - docs/user/t3c/commands.md
    - threadWatch
    - threadDerived
design-challenges:
  one-summary-per-row: |
    The shell, the server's only cross-thread stream, gives each thread row one
    pending summary, `pendingRuntimeRequest`. It is null when the thread holds
    no pending runtime request and no waiting secret or link card, and
    otherwise names the one the server ranks first. A row therefore says that
    a thread waits, not which requests it holds. The watcher reads requests
    only from thread watches: it watches a thread while its row shows a
    summary or its thread watch holds a pending request, and reports every
    pending request that thread watch holds. [The decision
    record](../decisions/request-watch-discovery.yml) weighs this against the
    alternatives.
  rows-the-server-holds-back: |
    The server coalesces a thread's events in a 50 ms batch into one row of its
    current state, and holds back a row equal to the last row it sent for that
    thread, apart from `updatedAt`, when that row went out less than five
    seconds earlier. The watcher closes the thread watch of an active thread
    whose row is included only when that row shows a null summary (`watching`
    The watch rule). The first request the thread raises after that makes its
    summary non-null, so its row differs from the last one sent and is never
    held back. A row that makes an excluded thread included differs from the
    last one sent as well. A thread whose latest row shows a summary is already
    watched, and its later requests reach the watcher as thread events,
    whichever rows the server holds back.
  archived-threads: |
    The shell lists active threads. It publishes every event of an archived
    thread, the archive included, as `thread.removed`, never holds a removal
    back, and an archived thread can still raise requests. The watcher takes
    every removal as the sign to look, whether or not it already holds the
    thread as removed: it watches the thread until its view has reached the
    removal's sequence, and while the view holds a pending request or a run
    that has not ended. A listing after a gap the shell cannot replay shows
    no removals, so at such a resync the watcher looks again at every thread
    it holds as removed, and at every thread it listed as active that the
    new listing leaves out.
  requests-before-their-cards: |
    A request's detail (the command, the files, the questions) is on its
    timeline card, and the card can arrive after the runtime request: the
    Claude adapter emits the request's event and then the card's. A request is
    reported once its card is in the thread watch's view, or two seconds after
    the watcher first saw it pending, without a card. A bounded snapshot
    carries the card of every pending request, so the wait applies to a card
    the server has not written yet.
  recoverable-failures: |
    A dropped socket rejects in-flight calls, a restarting server refuses
    reads, and the transport reconnects. The shell watch and each thread watch
    resume from their own cursors across the gap. Only a closed client, an
    aborted signal or a rejected credential ends the run. Any other failure of
    a thread watch is reported as a `thread-error` and the thread watch opens
    again with backoff while the thread still needs watching. Any other
    failure of the shell watch or of the HTTP shell snapshot starts a resync
    with backoff.
  repeats: |
    Reconnects resubscribe the shell and every thread watch, a thread watch
    that closes and opens again presents the same pending requests, a server
    restart keeps a surviving question under its id, and some providers re-send
    a pending request with its id. One set for the run, keyed by thread id and
    request id, absorbs every repeat.
  untrusted-content-and-hooks: |
    Request content is written by agents. It reaches a hook only as the bytes
    of the request line on the hook's stdin. The hook's command line is the
    operator's `--exec` text, fixed when the watcher starts and never read from
    a file. Ids that t3c prints on stderr are JSON strings, so control
    characters in a caller-chosen thread id are escaped.
proposed-design:
  guarantees: |
    A run is one iteration of `client.requests.watch(options)`, or one
    `t3c requests watch` process. A request is identified by its thread id and
    its runtime request id. A thread watch is the run's `threads.watch`
    subscription to one thread, and its view is the thread projection it holds:
    seeded by its snapshot and advanced by its events.

    - The watcher **sees a request pending** when a thread watch's view holds
      the request with status `pending`. A shell row's summary only tells the
      watcher that its thread waits.
    - A request is **selected** when its kind matches `kind` and the filters
      include its thread (`watching` Inclusion), judged on the thread record
      of the view that holds it.
    - The run is **synchronized** from its `synchronized` item, and from each
      `reconnected` item, until the shell subscription drops, fails or
      answers `snapshot-required`.

    The run makes these guarantees:

    1. **At most once per run.** Each request is reported at most once, across
       reconnects, server restarts, thread watches that close and open again,
       and re-sent requests (`repeats`). The run keeps the set of reported
       keys in memory for its whole life.
    2. **Pending at start and at every resync.** The start takes the HTTP
       shell snapshot and its catch-up, and each resync takes the shell's
       replay or a new HTTP shell snapshot (`startup`,
       `reconnects-and-restarts`). Each included thread whose row there shows
       a summary, and each thread a removal there names, gets a thread watch
       unless it has one. At a resync from a new HTTP shell snapshot, each
       thread the run holds as removed gets a thread watch that subscribes
       after that listing, in place of any it has. Every other thread watch
       already open catches up after the reconnect before it can close. Every
       selected request that the view holds pending, once it has its first
       snapshot or has caught up, is reported. Whether a request was pending
       when the shell snapshot or the resync was taken is decided
       by that view: a request that settled before it was not seen pending
       (guarantee 4). At start the watcher reads only the threads whose row
       shows a summary and the threads a removal in the catch-up names.
    3. **Live.** While the run is synchronized, a selected request that
       becomes pending is reported within five seconds, for every thread whose
       subscription the server answers. Its path is the server's 50 ms batch
       and the row, the thread watch's subscription and bounded snapshot when
       the thread is not watched yet, and at most two seconds of card wait. A
       held-back row never hides a request (`rows-the-server-holds-back`), and
       a waiting thread stays watched while it holds a pending request. The
       bound assumes that the server delivers a row and answers a thread
       subscription within three seconds together; task 5's live test
       measures it. A thread whose subscription the server refuses is named by
       `thread-error` items until a thread watch succeeds.
    4. **Outage.** A request raised during an outage and still pending at the
       reconnect is reported after the reconnect, by the resync. A request
       that settles before the watcher sees it pending is not reported, and
       settled history is not reported: every report starts from a request
       the watcher saw pending. A request seen pending that settles while the
       watcher waits for its card is still reported, with the status its view
       holds then.
    5. **Archived threads.** An archived thread enters the run's view when a
       removal names it, or when a resync's listing leaves it out after an
       earlier listing showed it active (`archived-threads`). From then on it
       stays in the view: each later removal, and each resync from a new HTTP
       shell snapshot, looks at it again, and its pending requests are
       reported like any other thread's. Before that,
       the requests it holds are outside the view. Two kinds of request are
       outside it this way: a request already pending in an archived thread at
       start, and a request raised inside a gap the shell cannot replay (an
       outage past the replay window, or a start whose catch-up the server
       refuses) by an archived thread that no listing, row or removal has
       named. Such a request is reported when a later event of its thread
       publishes a removal, if it is still pending then. The run reads no
       listing of archived threads.
       [#176](https://github.com/wyrd-company/t3code-client/issues/176) covers
       these requests and those settled before the watcher saw them.
    6. **Readiness.** `synchronized` comes after the start's reports are out,
       and `reconnected` after each resync's (`startup`,
       `reconnects-and-restarts`). A script that sees either item knows that
       every selected request pending in that start's or resync's views has
       been reported.
    7. **Read only.** The watcher reads with `orchestration:read` and never
       answers a request. Answering stays with `threads.respondToApproval`,
       `threads.respondToUserInput` and `t3c thread respond`.
    8. **Hooks.** Each request line on stdout starts exactly one run of the
       `--exec` hook, unless the watcher is forced to stop: a second signal, or
       a process end t3c does not control. A hook run is never retried. A hook
       that fails, times out, is stopped or never starts is named on stderr.

    A secret or link card is not a runtime request and is never reported.
  upstream-request-model: |
    These are the server facts the design rests on, read from upstream
    `pingdotgg/t3code` at tags `v0.1.9` and `v0.1.10`. File paths are in that
    repository; line numbers are at `v0.1.10`.

    - **Runtime requests.** A thread projection's `runtimeRequests` hold the
      approvals and questions a provider raised, with `status` `pending`,
      `resolved`, `expired` or `cancelled`. Each has a timeline card: an
      `approval_request` item (`requestKind`, `prompt`, `reason`, `options`,
      `appName`) or a `user_input_request` item (`questions`). For a command
      approval the Claude adapter puts the command itself in `prompt`, and the
      Codex adapter puts the provider's reason when it gives one and the
      command otherwise
      (`apps/server/src/orchestration-v2/Adapters/ClaudeAdapterV2.ts`,
      `CodexAdapterV2.ts`). The library's `pendingRequests` joins each pending
      request with its card, oldest `createdAt` first. Its kind is
      `user-input` for a `user_input` request and `approval` for every other
      request kind; this is the classification `t3c thread requests` reports.
    - **The shell summary.** A thread row's `pendingRuntimeRequest` is non-null
      whenever the thread holds a pending runtime request: the row's query
      takes the thread's pending requests, approvals before questions and
      newest first (`ProjectionStore.ts:7957`, `threadShellFromProjection` at
      `:1711`). It is also non-null when a secret or link card waits: the card
      replaces a null or question summary when it is at least as new. A card
      summary has kind `user_input` and the card's turn item id as its id
      (`secretRequestAsPendingInput`, `:1677`).
    - **What 0.1.10 changes.** Runtime request records, the two card types and
      the response methods are the same in both tags. In 0.1.10 a card summary
      carries `userOnly: true`, and the shell publishes a subagent thread's
      secret card, link card and user message updates, which 0.1.9 drops. The
      watcher reads requests from thread watches and uses a summary, card or
      not, only as the sign that its thread waits, so it reports the same
      requests on both versions.
    - **Bounded thread snapshots.** `orchestration.subscribeThread` with
      `acceptBoundedSnapshot` sends a snapshot with a window of timeline rows.
      It keeps every pending request (`ProjectionStore.ts:4173-4178`) and the
      card of every pending request (`getThreadSnapshotWindow`,
      `:7712-7738`), so the first snapshot holds each pending request with its
      card when the server has written one. The read looks the thread row up
      by id alone (`readCanonicalProjection`, `:3641-3650`), so a deleted
      thread stays readable. A resumed subscription replays the thread's
      events after its cursor, or sends a new snapshot past the thread's
      replay limits (`subscribeOrchestrationV2Thread`, `apps/server/src/ws.ts:1025-1118`).
    - **Event sequences.** Shell items and thread streams number events from
      the same `sequence` column of `orchestration_events`: the shell reads
      the v2 thread events and the project events, and a thread subscription
      the thread's v2 events (`readApplicationRows`,
      `apps/server/src/persistence/OrchestrationEventStore.ts:403-434`). A
      shell row or removal carries the sequence of the latest event of its
      thread in the batch (`coalesceShellApplicationEvents`,
      `ShellStream.ts:575-589`). A thread subscription's snapshot carries its
      thread's latest sequence (`ProjectionStore.ts:7741`), and its live
      coalescer drops only updates that a later update of the same entity
      supersedes, so the last event of a batch keeps its sequence
      (`ThreadLiveEventCoalescer.ts:49-75`).
    - **Request updates.** A provider adapter emits a request's creation as a
      pending `runtime_request.updated` event, and the server applies each
      event as a whole record keyed by the request id. Some updates repeat a
      request the thread already holds, always with its id: the Muse adapter
      re-sends a pending request (`provider-muse/src/server/adapter.ts:1172,1328`),
      and restart recovery re-sends a pending question
      (`ProviderRuntimeRecoveryService.ts:669`).
    - **Shell publishing.** Every thread event makes the server read the
      thread's row again. It batches events for 50 ms and coalesces a thread's
      events into one row (`Stream.groupedWithin(512, Duration.millis(50))`,
      `ws.ts:1258`). It holds back a row equal to the last row it sent for the
      thread on that subscription, comparing with `updatedAt` masked, when
      that row went out less than five seconds earlier; a held-back row does
      not move the five seconds. A removal is never held back and clears the
      thread's last row (`skipUnchangedThreadShells`, `ShellStream.ts:753-788`).
      For subagent threads the server leaves out node, turn item, provider
      turn and message updates, except, in 0.1.10, secret and link cards and
      user messages; runtime request events always pass
      (`shouldPublishShellApplicationEvent`, `ShellStream.ts:535`).
    - **Shell listings and resume.** The HTTP shell snapshot
      (`GET /api/orchestration/shell`) lists active threads only
      (`location: "active"`, `apps/server/src/orchestration-v2/http.ts:93`),
      with `snapshotSequence`. A subscription with `afterSequence` replays:
      the current row of every thread changed after the cursor, a removal for
      every thread archived or deleted, then `synchronized`. With
      `httpSnapshotFallback` the server answers instead with one
      `snapshot-required` item when it cannot replay: a gap of more than
      1,000 events, a cursor ahead of the head or before the pruned sequence,
      or more than 8 MiB of stored payload in the gap (`canResumeShellFrom`,
      `ShellStream.ts:45-79`; `ws.ts:1346`). A replay can begin with an
      enrichment snapshot, which carries `resolvedRepositoryIdentityRoots`,
      lists only projects whose repository identity resolved, and no threads;
      the server also sends one whenever an identity resolves. `shell.watch`
      moves its cursor only on a snapshot without
      `resolvedRepositoryIdentityRoots`, by task 2's commit `8ecef8a`
      (`fix(lib): keep the shell watch cursor at a marked snapshot`) on the
      epic branch.
    - **Card order.** The Claude adapter emits a request's
      `runtime_request.updated` event and then its card's `turn_item.updated`
      event, one after the other (`ClaudeAdapterV2.ts:12280-12297`), so a view
      can hold the request before its card.
    - **Archived threads.** For an archived thread, `shellStreamItemFromThreadShell`
      turns its row into `thread.removed`, for the archive and for every later
      event of the thread (`ShellStream.ts:791-821`); unarchiving publishes its
      row again. An archived thread keeps its `runtimeRequests` and can raise
      more.
    - **Deletion.** Deleting a thread cancels each of its pending requests
      (`ThreadDeletion.ts:113-127`) and publishes `thread.removed`.
    - **Restarts.** When the server shuts down, and again when it starts, it
      ends every pending request (`cancelled` at shutdown, `expired` at
      startup) except live questions with complete cards outside
      provider-native subagent threads, and requests already answerable by
      message. Those keep their id and stay pending, answerable by message. A
      run the restart cut short can continue and raise new requests with new
      ids (`ProviderRuntimeRecoveryService.ts`). Event sequences and
      projections are stored, so cursors stay valid across a restart.
    - **Scopes.** `orchestration.subscribeShell`, `orchestration.subscribeThread`,
      `GET /api/orchestration/shell` and `GET /api/projects` require
      `orchestration:read` (`apps/server/src/auth/RpcAuthorization.ts`).
  library-api: |
    Task 5 builds this API. `T3Client.requests` is a `RequestsApi` facade over
    the client's `shell` and `threads` facades and the socket's state. Like
    every facade it holds no state beyond those references; each iteration of
    `watch` holds its own index, thread watches and set of reported keys. The
    socket's state tells a run when the socket drops: every subscription live
    at that moment resumes, so its items until its `reconnected` came before
    the drop, and its `synchronized` among them does not count as caught up.

    ```ts
    import { ProfileManager, T3Client } from "@wyrd-company/t3code-lib";

    const client = T3Client.create(await new ProfileManager().resolve());
    const controller = new AbortController();
    process.once("SIGINT", () => controller.abort());
    try {
      for await (const item of client.requests.watch({
        kind: "approval",
        excludeThreadIds: [reviewerThreadId],
        excludeTags: ["reviewer"],
        signal: controller.signal,
      })) {
        if (item.kind === "request") await forward(item.request);
        else if (item.kind === "thread-error") console.error(item.threadId, item.error.code);
      }
    } finally {
      await client.close();
    }
    ```

    ```ts
    export type PendingRequestKind = PendingRequest["kind"]; // "approval" | "user-input"

    /** Which requests a watch reports. Every filter is optional; none selects every request. */
    export interface RequestWatchFilters {
      /** Only threads in these projects. */
      readonly projectIds?: readonly ProjectId[];
      /** Only requests of this kind. */
      readonly kind?: PendingRequestKind;
      /** Never the threads with exactly these ids. */
      readonly excludeThreadIds?: readonly ThreadId[];
      /** Never the threads that carry one of these tags. */
      readonly excludeTags?: readonly string[];
    }

    export interface RequestWatchOptions extends RequestWatchFilters {
      readonly signal?: AbortSignal;
    }

    /** A pending request with the thread and project it belongs to. */
    export type ReportedRequest = PendingRequest & {
      readonly thread: { readonly id: ThreadId; readonly title: string; readonly tags: readonly string[] };
      /** `title` is the project's name; null while the watch has not seen the project. */
      readonly project: { readonly id: ProjectId; readonly title: string | null };
    };

    export type RequestWatchItem =
      | { readonly kind: "request"; readonly request: ReportedRequest }
      | { readonly kind: "synchronized" }
      | { readonly kind: "reconnected" }
      | { readonly kind: "thread-error"; readonly threadId: ThreadId; readonly error: T3Error }
      | { readonly kind: "decode-error"; readonly error: T3DecodeError };

    export class RequestsApi {
      /** Every selected request the watch sees pending, once per run; read-only. */
      watch(options?: RequestWatchOptions): AsyncIterable<RequestWatchItem>;
    }
    ```

    `PendingRequest` is the library's existing type from `threadDerived.ts`, so
    a reported request has the shape `threads.pendingRequests` and
    `t3c thread requests --json` already return, plus `thread` and `project`.
    Its `request` is the record as the view holds it when the watch reports
    it: `pending`, or the settled status of a request that settled during its
    card wait (guarantee 4).

    - `request` reports one request when its report is ready (`watching`
      Reporting). Requests of one thread that become ready together are
      reported oldest `createdAt` first. Requests of different threads have
      no order between them.
    - `synchronized` comes once per run, when the start's reports are out
      (`startup`).
    - `reconnected` comes after each resync, when its reports are out
      (`reconnects-and-restarts`).
    - `thread-error` reports a thread watch that failed for one thread. The
      thread watch opens again as `watching` Failures describes.
    - `decode-error` passes on a shell or thread item that failed to decode.

    The watch validates its options before it subscribes: ids are nonempty
    strings, `kind` is one of the two kinds, and each tag is a valid
    `ThreadTag` (trimmed, one line, at most 64 characters). A malformed option
    raises `T3PreconditionError`.

    The run ends in three ways. Aborting the signal ends the iteration
    quietly. `client.close()` ends it with the closed connection error. A
    rejected credential ends it with that error: a `T3AuthError`, a
    `T3RpcError` whose tag is `EnvironmentAuthorizationError` (whether or not
    its record decoded), or the transport's fatal refusal of the socket: a 4xx
    answer to the upgrade, close code 1008, or a credential error while
    preparing the socket, which the library reports as a `T3ConnectionError`
    once the transport stops reconnecting (`transport/socket.ts`,
    `transport/socketClose.ts`). Every other failure is recoverable, as
    `recoverable-failures` says, and each retry waits with the transport's
    reconnect backoff. Thread watches take bounded snapshots and the shell
    watch takes its listings over HTTP, so no socket frame carries a whole
    thread or a whole listing. A thread watch that ends with
    `message_too_large` is a failed thread watch like any other.

    Modules: `src/api/requests.ts` holds `RequestsApi`; `src/api/requestWatch.ts`
    the run, which drives the HTTP shell snapshot, the shell watch, resyncs,
    readiness and the end of the run; `src/api/requestThreadWatches.ts` the
    run's thread watches, with their views, removals, rechecks and retries;
    `src/api/requestIndex.ts` the index, the inclusion rule and the watch rule
    as pure functions; and `src/api/requestReports.ts` reporting: the set of
    reported keys, the card wait and the `ReportedRequest` builder.
    `src/index.ts` exports `RequestsApi` and the types above.
  watching: |
    Task 5 builds this. [The decision record](../decisions/request-watch-discovery.yml)
    explains the shape.

    **The index.** For each thread the watch has met, the index keeps its id,
    whether it is active or removed, and, from its latest row, its project id,
    tags and whether its summary is non-null. For each project it keeps the
    title.

    | Source | Index change |
    | --- | --- |
    | `shell.snapshot()`, at the start and at a resync | Every listed thread becomes active with its row. A thread the index holds as active and the listing leaves out becomes removed. At a resync, every thread then held as removed gets a recheck (The watch rule). The listed projects are added or updated. |
    | `thread.updated` | The thread becomes active with this row. |
    | `thread.removed` | The thread is removed, archived or deleted, and the removal is a trigger (The watch rule), whether or not the index already held the thread as removed. |
    | enrichment `snapshot` | The listed projects' titles are added or updated. Threads are unchanged. |
    | `project.updated`, `project.removed` | The project's title is added, updated or removed. |
    | `synchronized`, `snapshot-required`, `reconnected`, `decode-error` | See `startup` and `reconnects-and-restarts`. |
    | authoritative `snapshot` frame | Not received: the shell watch always subscribes with a cursor and `httpSnapshotFallback`. |

    **Inclusion.** A thread is excluded when its id is exactly one of
    `excludeThreadIds`, or when one of its own tags, trimmed, equals one of
    `excludeTags`. No other thread is excluded with it: a subagent thread has
    its own id, and is excluded only by its own id or tags. A thread is
    included when it is not excluded and `projectIds` is absent, empty or
    lists its project. Excluded ids are not checked for existence, so a
    reviewer thread can be excluded before it exists. The index's row decides
    which active threads are watched. Before reporting, the watch applies the
    filters again to the thread record of the view that holds the request.

    **The watch rule.** The watch opens a thread watch,
    `threads.watch(threadId, { acceptBoundedSnapshot: true, acceptCompactTurnItems: true })`,
    on a thread that has none when:

    - its row, included by the filters, shows a summary;
    - it has an outstanding removal or recheck.

    Every `thread.removed` item, live or in a catch-up, is a removal of its
    thread, unless the thread's id is in `excludeThreadIds`; a thread
    excluded by id gets neither removals nor rechecks. A removal is
    outstanding until a view of the thread reaches the removal's `sequence`:
    the view's snapshot `snapshotSequence`, or the sequence of an event the
    view applied, is at least the removal's (`upstream-request-model`, Event
    sequences). A removal that arrives while the thread has a thread watch is
    answered by that thread watch once its view reaches the sequence. A
    recheck comes from a resync's HTTP shell snapshot, for each thread the
    index then holds as removed, and is outstanding until a thread watch that
    subscribed after that listing delivers its first snapshot. When the
    thread already has a thread watch, that thread watch subscribes again
    without a cursor, so its first snapshot is taken after the listing; a
    resumed replay never answers a recheck. A thread has a thread watch from
    its opening until it closes, retries included.

    Thread watches open as their triggers arrive, without a limit on how many
    are open. A thread watch stays open while any of these holds, and closes
    when none does:

    - the thread is active, and its row is included and shows a summary;
    - its view holds a selected pending request;
    - the thread is removed, its view's thread record is included, and its
      view holds a run that has not reached a terminal status;
    - a removal or recheck of the thread is outstanding;
    - its subscription has not delivered `synchronized` since it last opened
      or resumed, so it closes only on a view that has caught up;
    - a request it saw pending waits for its card.

    The watch applies each `snapshot` and `event` item to the thread watch's
    view with `applyThreadEvent`, the reducer the thread tracker uses. A
    snapshot item replaces the view; a resumed thread watch's replay advances
    it.

    **Reporting.** The watch reads a view for requests only once its
    subscription has caught up: at the `synchronized` it delivers after it
    subscribed or resumed, and after every later snapshot and event. A
    replay's intermediate views are applied but not read, because they can
    hold a request that settled later in the same gap. At each read the watch
    takes the view's `pendingRequests`. Each selected one whose key is not in the run's
    set is seen; its report is ready once the view holds its card, the
    `approval_request` or `user_input_request` turn item whose `requestId` is
    the request's id, or two seconds after it was first seen, whichever comes
    first. When the report is ready, the watch applies the filters again to
    the latest view's thread record. A request still selected is reported
    with the record and card that view holds, joined as `pendingRequests`
    joins them, or with the last ones a view held when that view no longer
    holds the request. A request no longer selected is dropped without a
    report, and is seen again when a later view selects it while it is
    pending. A card wait that runs out while the thread watch replays ends at
    the replay's `synchronized`, with the caught-up view. Reporting adds the
    key to the set and builds the
    `ReportedRequest` from the request, its card and the view's thread
    record: the thread's title and tags, and the project id with the index's
    project title.

    **Failures.** A thread watch that ends with a recoverable error yields a
    `thread-error`, and opens again with backoff while one of the conditions
    that keep a thread watch open, other than the wait for `synchronized`,
    still holds for its latest view, the outstanding removals and rechecks
    included. A failed subscription
    answers no removal or recheck. When a thread watch for a removed thread
    fails with an error that is not a `T3ConnectionError`, the watch reads
    `threads.detail(threadId)`. A `T3NotFoundError` there means the server
    holds no such thread: it answers its removals and rechecks, and the
    thread watch closes with its view, so a run the view still holds does not
    keep it open. Card waits already started still report, from the last
    record they held. A card wait keeps an open thread watch open, but does
    not open one. Any other answer leaves the removals and rechecks
    outstanding, and the thread watch opens again with backoff. Two seconds after a request was first seen, its report uses the
    latest view, even when its thread watch is between attempts.
  startup: |
    Task 5 builds this.

    1. The watch reads the HTTP shell snapshot (`shell.snapshot()`). Its
       `snapshotSequence` is `S0`, and the index takes its rows and projects.
       A failed read is retried with backoff.
    2. The watch opens a thread watch on each included thread whose row shows
       a summary, as the watch rule says. These threads, and the threads a
       removal in the catch-up names, are the only ones the start reads.
    3. The watch subscribes to the shell with `afterSequence: S0` and
       `httpSnapshotFallback: true`, as upstream's own client resumes after an
       HTTP snapshot. The catch-up brings the current row of every thread that
       changed after `S0`, a removal for every thread archived or deleted
       after it, and then `synchronized`. Each item updates the index and opens
       thread watches as the watch rule says. A dropped connection resumes the
       catch-up from its cursor.
    4. When the server answers the catch-up with `snapshot-required`, the gap
       since `S0` passed the shell's replay window, and the watch resyncs
       (`reconnects-and-restarts`) before it is ready.

    **Readiness.** The watch yields `synchronized` when the shell subscription
    has delivered its `synchronized`, every thread watch opened before it has
    delivered its first snapshot, every removal the catch-up brought is
    answered, and every request seen pending in those views has been
    reported, including those whose report waited for a card. A thread watch
    that fails holds readiness back and yields `thread-error` items until it
    succeeds, or until its thread no longer needs watching.

    The CLI prints `t3c: watching for requests` on stderr at `info` level for
    `synchronized`, so a script run with `--log-level info` can wait for it.
  reconnects-and-restarts: |
    Task 5 builds this, on the resume behavior of `shell.watch` and
    `threads.watch` that `library-facades` defines, with `shell.watch` moving
    its cursor only on an authoritative snapshot
    (`upstream-request-model`, Shell listings and resume).

    A resync starts when the shell watch resumes after a dropped connection,
    when it answers `snapshot-required`, or when it fails with a recoverable
    error.

    - **Dropped connection.** The transport reconnects with backoff. Each open
      thread watch resumes from its own cursor: it replays the thread's events
      or takes a new bounded snapshot, so its view holds every request pending
      at the reconnect. The shell watch resumes from its cursor with
      `httpSnapshotFallback`.
    - **Shell replay.** The resumed subscription brings the current row of
      every thread changed after the cursor and a removal for every thread
      archived or deleted, then `synchronized`. A thread that raised a request
      during the outage and still holds it shows a summary or a removal, and
      gets a thread watch.
    - **Past the replay window.** When the server answers
      `snapshot-required`, or the shell watch fails, the watch reads the HTTP
      shell snapshot again and subscribes once more with `afterSequence` set
      to its `snapshotSequence`. The index takes the listing: a thread it held
      as active that the listing leaves out was archived or deleted during the
      outage and becomes removed. Every thread the index then holds as
      removed, whether it left the listing now or was removed earlier in the
      run, and whether or not it has a thread watch, gets a recheck. The
      listing shows active threads only, the new cursor starts after any
      removal the gap held, and a thread watch's own replay can apply an
      older run's terminal event before it reaches a newer request. Every
      other thread watch already open resumes on its own and stays open until
      it has delivered `synchronized`. An included thread whose row in the new
      listing shows a summary gets a thread watch, as at the start. Another
      `snapshot-required` repeats the resync with backoff.
    - **Server restart.** The socket drops, and the server comes back with its
      stored events and projections, so the same cursors resume. Pending
      approvals end at shutdown or startup, as `cancelled` or `expired`. A
      continued run that asks again raises a new request id, which is reported
      once. Questions that survive keep their id, so the set holds them.
    - **Thread watch reopened.** A thread that stops waiting and later waits
      again gets a new thread watch, and the set drops the requests already
      reported.

    **Readiness after a resync.** The watch yields `reconnected` when the
    resumed or new shell subscription has delivered `synchronized`, every
    removal its replay brought and every recheck its listing made is
    answered, every thread watch the resync opened or subscribed again has
    delivered its first snapshot, every other thread watch that resumed after
    the drop has delivered its `synchronized`, and every request seen pending
    in them has been reported.

    The index and the set last for the run.
  command: |
    Task 6 builds the command. Task 7 adds `--ignore-defaults` and the defaults
    it controls.

    ```text
    t3c requests watch [--project <id>]... [--kind approval|user-input]
                       [--exclude-thread <id>]... [--exclude-tag <tag>]...
                       [--ignore-defaults]
                       [--exec <command> [--exec-concurrency <n>] [--exec-timeout <duration>]]
    ```

    `requests` is a command group like `thread` and `schedule`, named in the
    plural because `request` reads as a verb. Its one leaf is `watch`. The
    global options `--server`, `--credentials`, `--json`, `--log-level` and
    `--connect-timeout` apply as for every command.

    | Option | Value | Library option or behavior |
    | --- | --- | --- |
    | `--project <id>` | repeatable project id | `projectIds` |
    | `--kind <kind>` | `approval` or `user-input` | `kind` |
    | `--exclude-thread <id>` | repeatable thread id | `excludeThreadIds` |
    | `--exclude-tag <tag>` | repeatable tag | `excludeTags` |
    | `--ignore-defaults` | flag | the profile's `requestWatch` defaults are not read |
    | `--exec <command>` | command line | runs the hook; see `exec-hook` |
    | `--exec-concurrency <n>` | positive integer, default 4; requires `--exec` | hooks that run at once |
    | `--exec-timeout <duration>` | duration, default `10m`; requires `--exec` | how long one hook runs |

    Repeated values are deduplicated. A malformed tag, a concurrency that is not
    a positive integer, a malformed duration, or `--exec-concurrency` or
    `--exec-timeout` without `--exec` is a usage error (exit 2).

    **Preflight.** Before it watches, the command reads the server's projects
    once with `client.projects.snapshot()`. That read settles reachability (exit
    8), the credential and `orchestration:read` (exit 9), and that every
    selected project exists (exit 10, naming the missing id), as policy requires
    for explicitly selected resources. Then the command iterates
    `client.requests.watch` with the resolved filters and the signal scope's
    abort signal.

    **Output.** stdout carries one line per reported request, the format in
    `output-line`, in text mode and in `--json` mode. stderr carries everything
    else:

    | Event | stderr line | Level |
    | --- | --- | --- |
    | `synchronized` | `t3c: watching for requests` | info |
    | `reconnected` | `t3c: reconnected` | info |
    | `thread-error` | `t3c: could not watch thread <id>: <error message>` | warn |
    | `decode-error` | `t3c: skipped a server item that could not be decoded` | warn |
    | hook outcomes | see `exec-hook` | error, or info for success |
    | end of the watch | the short final error line policy defines | always |

    `<id>` is the thread id and `<error message>` the error's message, each
    written as a JSON string. Lines at `info` level print with
    `--log-level info` or `debug`; the default level, `warn`, prints the rest.

    **Exit codes.** A watch has no successful end; every end is one of these,
    from the policy table:

    | Code | When |
    | --- | --- |
    | 1 | Unexpected error, or profile config or credential storage failure. |
    | 2 | Usage error, including malformed `requestWatch` defaults. |
    | 4 | SIGINT or SIGTERM. |
    | 8 | The preflight cannot reach the server, or a connection error ends the watch, including a credential the server rejects after the preflight. |
    | 9 | The preflight's credential is rejected or lacks `orchestration:read`, or the server refuses a subscription for missing scope. |
    | 10 | A selected project does not exist. |

    These follow the common mapping in `errors.ts`: the library reports a
    credential rejected on the socket as a connection error.

    A hook's result never changes the exit code. In `--json` mode the last
    stdout line is the result, in the streaming form policy defines for
    `--stream --json`; the handler finishes through an `Output` in streaming
    mode, so the result carries `type`:

    ```json
    {"type":"result","data":{"reported":3,"hooks":{"succeeded":2,"failed":1,"stopped":0,"notRun":0}},"exitCode":4,"error":{"code":"interrupted","message":"Operation interrupted."}}
    ```

    `data.hooks` is null without `--exec`. `error` has the shape of every other
    command's JSON error. Every end after the arguments parse writes this line
    last, including a failed preflight.

    **Stopping.** The command uses the CLI's one signal scope
    (`execution/signals.ts`). On the first SIGINT or SIGTERM, or on any other
    end of the watch, it aborts the watch, so no request is reported after it,
    and the hook runner drains as `exec-hook` describes. Then the client
    closes, `--json` writes the result line, stderr ends with the final line,
    and the process exits.

    A second signal makes `followSignals` call `process.exit(4)` at once, so
    nothing asynchronous runs after it. Task 6 gives `followSignals` an
    optional second argument, `{ onForcedStop?: () => void }`, a synchronous
    callback the scope runs just before that `process.exit(4)`; every other
    command passes nothing and keeps its behavior. `requests watch` passes a
    callback that, without awaiting anything:

    1. sends SIGKILL to every hook process group still present;
    2. writes each hook's `stopped` or `not run` line and the short final
       error line to stderr with `fs.writeSync(2, …)`;
    3. in `--json` mode, writes the result line to stdout with
       `fs.writeSync(1, …)`, with `exitCode` 4.

    `Output` gains a synchronous `finishForced(result)` for steps 2 and 3, so
    the result still goes through the output boundary and is written once.

    Modules: `src/requests/index.ts` exports `requestsHandlers` with the
    `requests watch` handler, which the composition root adds beside the other
    handler families. `src/requests/watch.ts` holds the handler,
    `src/requests/line.ts` the line format, and `src/requests/hookRunner.ts`
    the hook runner.
  output-line: |
    Task 6 builds this. Each reported request is one line: a JSON object
    followed by `\n`. `JSON.stringify` escapes newlines inside strings, so a
    line never contains one. Consumers ignore fields they do not know; fields
    are only ever added.

    | Field | Value |
    | --- | --- |
    | `type` | `"request"` |
    | `kind` | `"approval"` or `"user-input"` |
    | `requestId` | the runtime request id, as `thread respond --request` takes it |
    | `thread` | `{id, title, tags}` from the thread record of the view that holds the request, the same record the filters use (`watching` Reporting) |
    | `project` | `{id, title}`; `id` from the same thread record, `title` the project's name from the index, or null when unknown |
    | `request` | the server's runtime request record (`kind` is the server's request kind, such as `command` or `file-change`) |
    | `item` | the request's timeline card as the server gives it, or null when the thread holds none |
    | `questions` | for `user-input` only: the card's questions |

    `kind`, `requestId`, `request`, `item` and `questions` are the library's
    `PendingRequest`, the object `t3c thread requests --json` returns, with an
    absent card written as null instead of left out. `request.status` is the
    request's status in the view when the watcher reported it: `pending`, or
    `resolved`, `expired` or `cancelled` for a request that settled while the
    watcher waited for its card (`guarantees` 4). A hook answers only a
    `pending` one. For an approval, `item.prompt` holds the command or the provider's description
    of the action; for a question, `questions` holds the questions and their
    options. A hook that needs more, such as a file change's diff, reads the
    thread.

    An example line, wrapped here for reading:

    ```json
    {"type":"request","kind":"approval","requestId":"request-1",
     "thread":{"id":"thread-1","title":"Fix the build","tags":[]},
     "project":{"id":"project-1","title":"example"},
     "request":{"id":"request-1","nodeId":"node-1","providerTurnId":"provider-turn-1",
      "nativeRequestRef":{"driver":"claudeAgent","nativeId":"native-1","strength":"strong"},
      "kind":"command","status":"pending",
      "responseCapability":{"type":"live","providerSessionId":"session-1","supportsFeedback":true},
      "createdAt":"2026-01-01T00:00:00.000Z","resolvedAt":null},
     "item":{"id":"item-1","threadId":"thread-1","runId":"run-1","nodeId":"node-1",
      "providerThreadId":"provider-thread-1","providerTurnId":"provider-turn-1",
      "nativeItemRef":null,"parentItemId":null,"ordinal":4,"status":"waiting","title":null,
      "startedAt":"2026-01-01T00:00:00.000Z","completedAt":null,
      "updatedAt":"2026-01-01T00:00:00.000Z","type":"approval_request",
      "requestId":"request-1","requestKind":"command","prompt":"npm test"}}
    ```
  exec-hook: |
    Task 6 builds the hook runner in `src/requests/hookRunner.ts`.

    **Start.** For each reported request, after its stdout line is written, the
    runner queues one hook run. Runs start in report order whenever fewer than
    `--exec-concurrency` hooks are running. The queue holds one line per waiting
    run.

    **Command.** The runner starts `--exec`'s text with the platform shell, as
    Node's `spawn(command, { shell: true })` does (`/bin/sh -c` on POSIX), in
    t3c's working directory. The shell receives only the operator's text, fixed
    when the watcher starts. On POSIX the hook leads its own process group, so
    the runner can signal the hook and everything it started; on other
    platforms the runner signals the hook process alone.

    **stdin.** The hook's stdin receives the request's line, byte for byte the
    line written to stdout, and then end of file. A hook that exits without
    reading stdin is not a failure for that reason; a broken pipe on stdin is
    ignored. Nothing from the request goes into the hook's arguments or
    environment.

    **Environment.** The hook inherits t3c's environment, and the runner sets
    `T3_SERVER_URL` to the origin of the server the watcher is connected to,
    however that server was selected. A `t3c` command the hook runs therefore
    reaches the server the request came from, even after the current profile
    changes, and takes the credential of the first profile whose origin
    matches, or `T3_TOKEN` when the watcher's environment sets it. A credential
    given with `--credentials` is not passed on; such a hook passes the file to
    its own `t3c` commands.

    **Output.** The hook's stdout and stderr go to t3c's stderr, never to its
    stdout, line by line, each line prefixed with `t3c: hook <requestId>: `
    with the request id as a JSON string. A last line without a newline is
    written when the hook exits.

    **Concurrency and timeout.** `--exec-concurrency` defaults to 4, so a slow
    hook for one request does not hold back the others. A hook run lasts until
    its whole process group is gone, not until its shell exits: the runner
    tracks the group by its id, and checks it with signal 0 to the group
    (`process.kill(-pgid, 0)`, which fails with `ESRCH` once no member is
    left) when the shell exits, after each signal, and every 100 ms while a
    member remains. A hook's slot frees only when the run ends, so a shell
    that exits while a child that ignores SIGTERM keeps running still holds
    its slot. A run whose group is still present after `--exec-timeout`
    receives SIGTERM to the group, and SIGKILL to the group five seconds later
    if any member remains; the escalation follows the group, whether or not
    the shell has already exited. A run whose group is still present five
    seconds after that SIGKILL ends then: no member runs after SIGKILL, and
    what signal 0 still finds are exited members that no process has reaped.
    The runner stops tracking the group and frees the slot, so a slot is held
    for at most `--exec-timeout` plus ten seconds. On other platforms the
    runner tracks and signals the hook process alone. The default of `10m` leaves room for a hook that asks a reviewer
    thread and waits for its answer.

    **Outcomes.** Each run ends with one outcome, printed when the run ends;
    exit status and signal are the shell's. A success prints a line at
    `info` level; every other outcome prints at `error` level, and
    `<requestId>` and `<threadId>` are JSON strings:

    | Outcome | stderr line |
    | --- | --- |
    | Exit 0 | `t3c: hook finished for request <requestId>` |
    | Nonzero exit | `t3c: hook failed for request <requestId> in thread <threadId>: exit <n>` |
    | Ended by a signal it did not get from t3c | `t3c: hook failed for request <requestId> in thread <threadId>: signal <name>` |
    | Timed out | `t3c: hook failed for request <requestId> in thread <threadId>: timed out after <duration>` |
    | The process did not start | `t3c: hook failed for request <requestId> in thread <threadId>: could not start` |
    | Stopped by a forced stop | `t3c: hook stopped for request <requestId> in thread <threadId>` |
    | Queued at a forced stop | `t3c: hook not run for request <requestId> in thread <threadId>` |

    A failed hook is not retried, and the watcher keeps running.

    **Stop.** A first SIGINT or SIGTERM, or an error that ends the watch, stops
    reporting and then drains: every request already written to stdout still
    gets its hook run. Queued runs start as slots free, running hooks finish,
    and each run keeps its `--exec-timeout` and its escalation, so the drain
    ends within the queue's length divided by `--exec-concurrency`, times the
    timeout plus ten seconds. A second signal forces the stop, synchronously,
    through the signal scope's forced-stop callback (`command` Stopping): the
    runner sends SIGKILL to every hook process group still present, reports
    each running hook as stopped and each queued run as not run, and the
    process exits 4. The runner also registers a process `exit` handler that
    sends SIGKILL to every hook process group still present, so no hook
    outlives a t3c that exits by any path that runs `exit` handlers. A request
    whose hook did not run, and that is still pending when the next run
    starts, is reported by that run.
  spawn-exception: |
    Task 6 changes the rule's wording and adds its test.
    [The decision record](../decisions/exec-hook-spawn-exception.yml) holds the
    operator's approval and its reason.

    The hook runner is the one place where application code spawns a process.
    It exists because #169 requires a hook per request with stdin-only
    delivery, failure isolation, bounded concurrency and a timeout, which a
    consumer's own loop over the lines does not give. The library stays free of
    child processes; the runner lives in the CLI, which adapts library output
    to the operator's environment.

    The conventions paragraph of the root `AGENTS.md` changes from

    ```text
    Application code must not spawn CLIs. The CLI composes the library and does
    not implement wire protocol. Only build/test tools may spawn the test server.
    ```

    to

    ```text
    Application code must not spawn CLIs, with one exception: the hook runner of
    `t3c requests watch` (`packages/t3code-cli/src/requests/hookRunner.ts`)
    runs the operator's `--exec` command, with the request on stdin only. A test
    fails when any other application source imports `node:child_process`. The
    CLI composes the library and does not implement wire protocol. Only
    build/test tools may spawn the test server.
    ```

    The test lists the files under `packages/*/src` that are not tests (`*.test.ts`)
    and fails unless `hookRunner.ts` is the only one that imports
    `node:child_process` or `child_process`.
    `composition.yml` states the same exception.
  config-defaults: |
    Task 7 builds this.

    A server profile in the t3c config (`config.json`, `docs/profiles.md`) can
    hold default filters under `requestWatch`. Its keys are the library's
    `RequestWatchFilters`:

    ```json
    {
      "servers": {
        "sample": {
          "url": "https://server.example",
          "requestWatch": {
            "projectIds": ["project-1"],
            "kind": "approval",
            "excludeThreadIds": ["thread-reviewer"],
            "excludeTags": ["reviewer"]
          }
        }
      },
      "current": "sample"
    }
    ```

    - **Shape.** `requestWatch` is an object. `projectIds`, `excludeThreadIds`
      and `excludeTags` are arrays of nonempty strings, each tag a valid
      `ThreadTag`, and `kind` is `approval` or `user-input`. Every key is
      optional, and unknown keys inside `requestWatch` are ignored. Only
      filters are stored: the `--exec` options come from the command line
      alone, so no file can supply a command to run.
    - **Reading.** `ProfileManager.requestWatchDefaults(name)` reads the named
      profile's `requestWatch` and returns `RequestWatchFilters`, empty when
      the key is absent. A malformed value raises `T3PreconditionError`, which
      `requests watch` reports as exit 2 naming the profile. `loadConfig`
      validates only each server's `url` and keeps its other keys, so a config
      with `requestWatch`, well formed or not, loads unchanged for every other
      command.
    - **Which profile.** The defaults come from the profile that
      `ProfileManager.resolve` selects for the server: the current profile, or
      the profile whose normalized origin matches `--server` or
      `T3_SERVER_URL`. A server without a matching profile has no defaults.
      Credential overrides do not change which profile supplies them.
    - **Precedence.** Each of the four filters is taken from its flag when the
      flag is given, with all its occurrences, and from the profile otherwise.
      A flag replaces the profile's value for that filter; it does not add to
      it. `--ignore-defaults` reads no profile defaults, so the flags alone
      apply.
    - **Writes.** t3c never writes `requestWatch`; the operator edits the
      config. Registering a profile again with `auth pair` or a session token
      replaces only the entry's `url` and keeps its other keys, so a renewed
      credential keeps its defaults. `auth switch` keeps every key, and
      `auth logout` removes the entry with its defaults. Config writes stay
      atomic as `profile-storage` defines. A config without `requestWatch`,
      such as one the previous t3c release wrote, loads unchanged and watches
      everything.
  verification: |
    Fake-server tests show each guarantee in the cases that break a weaker
    design. The fake server applies upstream's 50 ms batch, its five-second
    hold-back of equal rows and its replay window. Task 5 owns the library
    cases and task 6 the command cases.

    - **Pending at start (task 5).** A waiting thread holds two pending
      approvals, one of them not named by its summary, and an idle thread
      holds only settled requests. Both approvals are reported once, the idle
      thread gets no thread watch, and `synchronized` follows both lines.
    - **Settled before seen (task 5).** The HTTP shell snapshot shows a
      thread's summary, and its request settles before the thread watch's
      first snapshot. Nothing is reported, and `synchronized` comes.
    - **Card wait and readiness (task 5).** At start, one request's card
      arrives 300 ms after its record and another's never arrives. The first
      is reported with its card, the second two seconds after it was seen with
      `item: null`, and `synchronized` follows both lines. A request answered
      during its card wait is reported once, with its settled status.
    - **Held-back rows and latency (task 5).** An unwatched thread sends a row
      at 0 ms and raises an approval at 1 s that stays pending; its line is
      written less than five seconds after the approval was raised. A watched
      thread whose summary names an approval raises a question, so the server
      holds back the equal row; the question is reported from the thread
      watch. A thread whose request settles closes its watch, then raises a
      new request less than five seconds after its last row; it is reported.
    - **Outage (task 5).** While the socket is down, one thread raises a
      request that is still pending at the reconnect, and another raises and
      settles one. After a resume the server replays, and in another test
      after `snapshot-required`, the pending request is reported once, the
      settled one is not, and `reconnected` follows the line.
    - **Archived threads (task 5).** A thread archived while the watcher runs
      raises an approval; it is reported. A thread the start listed as active
      is archived during an outage past the replay window and raises an
      approval that is still pending at the reconnect; it is reported after
      the resync. An archived thread holds a pending question at start;
      nothing is reported, and the fake server fails the test when
      `orchestration.getArchivedShellSnapshot` is called.
    - **Removed before the gap (task 5).** The watcher sees thread T's
      archive removal, and T's thread watch closes after an idle snapshot, so
      the index holds T as removed with no thread watch. During an outage
      past the replay window, T is unarchived, runs, is archived again and
      raises a selected approval that stays pending. The resume answers
      `snapshot-required`; the resync rechecks T, the approval is reported,
      and `reconnected` follows its line. With T in `excludeThreadIds`, T gets
      no thread watch.
    - **Every removal counts (task 5).** The index holds T as removed with no
      thread watch, and a later removal of T arrives, live and in another test
      in a replay; T gets a thread watch, and a pending approval it holds is
      reported.
    - **Open watch across the gap (task 5).** Archived thread T has a thread
      watch, held open by its running run, when the socket drops. During the
      outage the shell's gap passes its replay window while T's own events
      stay within T's replay limits: T's run ends, T is unarchived, a new run
      starts, T is archived again, and the new run raises a selected approval
      that stays pending. After `snapshot-required`, the recheck makes T's
      thread watch subscribe again; the approval is reported once, and
      `reconnected` follows its line. In another test the socket stays open
      and the shell watch fails with a server error, while T's thread watch,
      live throughout, has not yet applied the gap's events; the recheck's new
      subscription reports the approval once, before `reconnected`.
    - **Held through the marker (task 5).** A resumed thread watch replays an
      event after which no other condition keeps it open, and a later event
      in the same replay raises a selected approval. The thread watch stays
      open until its `synchronized`, reports the approval once, and the
      readiness item follows that line.
    - **Removal ahead of the view (task 5).** Archived thread T is watched
      while its run runs. The run ends, a new run raises a selected approval,
      and the removal for that event reaches the watcher before T's thread
      watch applies the end of the first run. The thread watch stays open
      until its view reaches the removal's sequence, and the approval is
      reported.
    - **Restart (task 5).** A run reports a pending approval and a pending
      question, and the server restarts: the approval expires, the question
      survives, and the continued run raises a new approval. The new approval
      is reported once, and neither earlier request is reported again.
    - **Repeats (task 5).** A thread watch closes and opens again while its
      request is pending, and a provider re-sends a pending request with its
      id. Each request is reported once.
    - **Watcher restart (task 5).** A run reports a pending approval and is
      stopped; a second run starts while the approval is still pending and
      reports it again, once.
    - **Failures (task 5).** A waiting thread's subscription fails twice with
      a server error. Two `thread-error` items come, `synchronized` waits, and
      the request is reported and `synchronized` follows when the third
      attempt succeeds.
    - **Failed subscription on a removal (task 5).** During an outage the
      server can replay, a thread is archived and its run raises a selected
      approval that stays pending. The replay brings the removal, and the
      first subscription for it fails with a server error that is not a
      `T3ConnectionError`. `threads.detail` answers the thread, so the thread
      watch opens again with backoff; the approval is reported, and
      `reconnected` follows its line. In another test `threads.detail`
      answers `T3NotFoundError`, the removal is answered, and the thread
      watch does not open again.
    - **Exact exclusion (task 5).** With `excludeThreadIds: [manager]`, a
      subagent worker thread whose parent is the manager reports its
      approvals.
    - **Filters on the view (task 5).** A thread's row is included, and its
      view's thread record carries an excluded tag; its request is not
      reported.
    - **Drain (task 6).** With `--exec-concurrency 1`, hook A running and
      request B reported and queued, a first SIGTERM lets A finish and B run;
      a second signal during A reports B as not run.
    - **Hook server (task 6).** The watcher connects through the current
      profile A; the current profile then switches to B; the hook's
      `T3_SERVER_URL` still names A's origin.
    - **Hook process group (task 6).** With `--exec-concurrency 1`, a hook times
      out; its shell exits on SIGTERM while a child that ignores SIGTERM keeps
      the group alive. The slot stays held, SIGKILL reaches the group five
      seconds later, and the next hook starts only after the group is gone. In
      another test a group member stays unreaped after SIGKILL; the slot
      frees five seconds after the SIGKILL, and the hook is reported as timed
      out.
    - **Forced stop (task 6).** A second signal kills every hook group, writes
      the `stopped` and `not run` lines and, with `--json`, the result line
      with `exitCode` 4, and exits 4. `run` and `thread send` keep their
      second-signal behavior.
    - **Serialization (task 6).** A reported request's line carries the title
      and tags of its view's thread record, the record the filters used.
