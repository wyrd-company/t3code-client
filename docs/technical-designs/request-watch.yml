  traceability: |
    How the design meets wyrd-company/t3code-client#169:

    | #169 | Met by | Task |
    | --- | --- | --- |
    | Invariant: t3c never answers | `guarantees` 6; the watch reads only | 5, 6 |
    | Invariant: content never on a command line or evaluated | `exec-hook` stdin and environment; `untrusted-content-and-hooks` | 6 |
    | Invariant: read access only | `upstream-request-model` scopes; `command` preflight | 5, 6 |
    | Invariant: no version pin, protocol 2 | `upstream-request-model` (same behavior on 0.1.9 and 0.1.10) | 5 |
    | Invariant: public library API, CLI composes | `library-api`; `command` | 5, 6 |
    | 1. Every thread, including new ones | `discovery` index from the shell stream and `shell.archivedSnapshot()`; `archived-threads` | 5 |
    | 2. Projects and request kind | `projectIds`, `kind`; `--project`, `--kind` | 5, 6 |
    | 3. Exclude by id and tag | `discovery` inclusion: exact ids and the thread's own tags | 5, 6 |
    | 4. Once per run, one JSON line with its fields | `guarantees` 1, 2 and 4; `requests-before-their-cards`; `output-line` | 5, 6 |
    | 5. Existing requests reported; an option skips them | `guarantees` 3; `one-start-boundary`; `synchronization-and-existing-requests` | 5, 6 |
    | 6. Survives restart and lost connection, missing nothing raised during the outage | `requests-between-observations`; `reconnects-and-restarts`; `guarantees` 1 and 2 | 5 |
    | 7. `--exec`: once per request on stdin only, failures on stderr, bounded | `exec-hook`, including the drain; `spawn-exception` | 6 |
    | 8. Defaults per profile; flags override | `config-defaults` | 7 |
    | 9. Exit codes, stderr, clean interrupt | `command` exit codes, output and stopping | 6 |
    | Success: approval on stdout within 5 seconds | `discovery`: a watched thread's event, or one row and one thread subscription; a missing card waits at most two seconds | 5 (live test), 8 |
    | Success: exactly once across a server restart | `reconnects-and-restarts`; `verification` | 5, 8 |
    | Success: filters select exactly what is specified | `discovery` inclusion; `config-defaults` precedence; `verification` | 6, 7 |
    | Success: passes both gates for t3c | `tool-scope` verdict record | 4 |
