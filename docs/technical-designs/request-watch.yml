    | 5. Existing requests reported; an option skips them | `guarantees` 3; `one-start-cut`; `startup`, including the two startup cases the decision defines and the two further cases decided [here](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7041498801), and the rows that apply the standing rule proposed [here](https://github.com/wyrd-company/t3code-client/issues/169#issuecomment-7042028104) | 5, 6 |
