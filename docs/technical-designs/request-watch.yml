      `shell.watch` moves its cursor only on an authoritative snapshot.
    - **Task 5:** `shell.watch` takes `httpSnapshotFallback` and yields the
      `snapshot-required` item, and a lifecycle watch resubscribes after a
      drop. `library-facades.yml` lists `RequestsApi` in its facade
      block, links this design, and states the snapshot rule and these two in
      its watch paragraph; the module map in `library.yml` adds `api/requests.ts`,
      `api/requestWatch.ts`, `api/requestStartup.ts`, `api/requestIndex.ts`
      and `api/requestLedger.ts`; the generated API reference (`task docs`)
      documents the new exports.
    - **Task 6:** `docs/specifications/cli-surface.json` adds the `requests`
      group and its `watch` leaf with the options above (except
      `--ignore-defaults`), `requires` on `exec-concurrency` and `exec-timeout`,
      the text and JSON output modes and the exit codes; its notes state the
