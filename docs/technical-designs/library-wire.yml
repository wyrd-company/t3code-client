$schema: https://refinery.systems/ontology/technical-design
title: T3 Code HTTP and WebSocket protocol
objective: >-
  Implement library authentication, requests, responses and event handling against the verified protocol 2 interfaces of stock T3 Code 0.1.8.
relationships:
  related-to:
    - library
  references:
    - profiles
    - testing
    - releasing
proposed-design:
  high-level-overview: >-
    The library implements stock T3 Code 0.1.8 and orchestration protocol 2.
    Related library designs carry the wire, transport, auth, usage and facade
    contracts. The library architecture links the canonical design family.
  wire-facts-verified-against-t-code: |
    Provider-turn token usage exposes optional positive integer
    `autoCompactThreshold` through thread detail, projection and stream reads.
    It reports provider auto-compaction metadata in tokens. Omission stays absent;
    malformed values fail decoding and extra metadata survives. Reading this value
    does not enforce compaction or change timing. This is separate from the
    thread-level token usage snapshot.

    Provider-turn token usage also exposes optional string `promptCacheExpiresAt`
    through thread detail, projection and stream reads. It reports the provider's
    prompt cache expiry metadata. Empty and other strings pass through; omission
    stays absent, malformed values fail decoding and unknown metadata survives.
    Reading the field does not expire a cache or schedule compaction.

    Server configuration reads and stream snapshots expose optional
    `directEndpoints`: a forward-compatible array of address hints with `kind`
    (`lan` or `tailnet`) and nonempty `httpBaseUrl`. Unknown kind strings and
    extra metadata survive; malformed entries are dropped. Omission and an empty
    array are distinct; non-array values fail decoding. Consumers verify that an
    address answers as this environment before use. The library does not choose
    or connect to an endpoint from this metadata.

    The server speaks orchestration protocol 2 and refuses other clients. The
    `/ws` upgrade must carry `?orchestrationProtocol=2` (a 426 answers an upgrade
    without it), and the orchestration HTTP routes must carry the header
    `x-t3-orchestration-protocol: 2`. `ExecutionEnvironmentDescriptor.orchestrationProtocolVersion`
    says which protocol a server speaks.

    HTTP, all under one base URL:

    | Method and path                                       | Auth                 | Notes                                                                                      |
    | ----------------------------------------------------- | -------------------- | ------------------------------------------------------------------------------------------ |
    | `GET /.well-known/t3/environment`                     | none                 | `ExecutionEnvironmentDescriptor`                                                           |
    | `GET /api/auth/session`                               | optional bearer      | `AuthSessionState`; `authenticated:false` without a credential                             |
    | `POST /oauth/token`                                   | none                 | form-encoded token exchange; pairing token is single use                                   |
    | `POST /api/auth/browser-session`                      | none                 | `{credential}` → session state; the session token is only in an HttpOnly cookie            |
    | `POST /api/auth/websocket-ticket`                     | bearer               | `{ticket, expiresAt}`; ticket lives about five minutes; valid for either use               |
    | `POST /api/auth/websocket-ticket/:use`                | bearer               | `use` is `rpc` or `media`; the other route refuses the ticket                              |
    | `POST /api/auth/pairing-token`                        | bearer, access:write | body `{label?, scopes?}`; the credential is returned once                                  |
    | `POST /api/auth/pairing-links/revoke`                 | bearer, access:write | `{id}` → `{revoked}`                                                                       |
    | `POST /api/auth/clients/revoke`                       | bearer, access:write | `{sessionId}` → `{revoked}`                                                                |
    | `POST /api/auth/clients/revoke-others`                | bearer, access:write | `{revokedCount}`                                                                           |
    | `GET /api/projects`                                   | bearer, orch:read    | `ProjectSnapshot`: every project record                                                    |
    | `POST /api/projects/mutate`                           | bearer, orch:operate | `ProjectMutation` → `Project`                                                              |
    | `GET /api/orchestration/shell`                        | bearer, orch:read    | `OrchestrationV2ShellSnapshot` (protocol header)                                           |
    | `GET /api/orchestration/threads/:threadId`            | bearer, orch:read    | `OrchestrationV2ThreadDetailSnapshot`, the full projection; 404 `thread_not_found`         |
    | `GET /api/orchestration/threads/:threadId/bounded`    | bearer, orch:read    | `OrchestrationV2ThreadBoundedSnapshot`: a recent window plus `historyCursor`; query flags  |
    | `GET /api/orchestration/threads/:threadId/history`    | bearer, orch:read    | query `cursor`; `OrchestrationV2ThreadHistoryPage`; 400 `invalid_history_cursor`           |
    | `GET /api/orchestration/threads/:threadId/transcript` | bearer, orch:read    | `OrchestrationV2ThreadTranscript`: the visible timeline; 400 `thread_transcript_too_large` |
    | `GET /api/assets/:token/:path`                         | signed URL           | bytes and `content-type`; 404 for a bad or expired token                                   |
    | `POST /api/attachments/upload/:token`                 | signed URL           | raw bytes of the signed size; 204; 400 for another size; 404 for a bad or expired token    |
    | `POST /api/pull-requests/diff`                        | bearer               | `PullRequestDiffInput` → `PullRequestDiffResult`                                                              |
    | `GET /api/preview-stream/download`                    | bearer, orch:read    | query `threadId`, `tabId`, `id`; bytes and `content-type`; 404 for an unknown file         |
    | `POST /api/preview-stream/upload`                     | bearer, preview:op   | query `threadId`, `tabId`, `chooser`; multipart files; 204; 409 when the picker is not open |
    | `POST /api/guest/redeem`                              | none                 | `{credential, name}`; 204 and a session cookie for the share; 403 `invalid`                |
    | `GET /api/guest/session`                              | guest cookie         | query `share`; 204                                                                         |
    | `POST /api/guest/messages`                            | guest cookie         | query `share`; multipart `shareId`, `text`, `file`; 204; 400 `empty`, `too_large`          |
    | `GET /api/guest/stream`                               | guest cookie         | query `share`; server-sent `GuestStreamEvent`: `view`, `thread`, `ended`                   |
    | `GET /api/guest/item`                                 | guest cookie         | query `share`, `item`; `OrchestrationV2GetTurnItemResult`                                  |
    | `GET /api/guest/history`                              | guest cookie         | query `share`, `cursor`; `OrchestrationV2ThreadHistoryPage`                                |
    | `GET /api/guest/command-output`                       | guest cookie         | query `share`, `item`; server-sent `OrchestrationV2CommandOutputFrame`; ends when settled  |
    | `GET /api/guest/render`                               | guest cookie         | query `share`, `item`; the bytes of one HTML render                                        |
    | `GET /api/guest/attachment`                           | guest cookie         | query `share`, `id`; bytes and `content-type`                                              |
    | `GET /api/guest/media`                                | guest cookie         | query `share`, `path`; an image that a reply the guest received shows                      |
    | `POST`, `PUT`, `PATCH`, `GET /api/hooks/:hookId/:token` | path token         | raw body; 202 `{deliveryId}`; 401, 404, 409, 410, 413, 429 with `{error}`                  |
    | `GET /.well-known/oauth-protected-resource`           | none                 | `AuthMcpProtectedResourceMetadata`; the same at `/mcp` under this path                     |
    | `GET /.well-known/oauth-authorization-server`         | none                 | `AuthMcpAuthorizationServerMetadata`                                                       |
    | `POST /oauth/mcp/register`                            | none                 | `AuthMcpClientRegistration`; 201 `AuthMcpRegisteredClient`; 400 with `{error}`             |
    | `GET /oauth/mcp/authorize`                            | none                 | query `AuthMcpAuthorizationRequest`; 302; 400 and an HTML page for an unverified client    |
    | `POST /oauth/mcp/approval`                            | browser cookie or none | `AuthMcpAuthorizationRequest` → `AuthMcpApprovalDetails` or `{redirectTo}`; 400 `AuthMcpApprovalError` |
    | `POST /oauth/mcp/decision`                            | browser cookie or none | `{authorization, decision}` → `{redirectTo}`; 400 `AuthMcpApprovalError`                 |
    | `POST /oauth/mcp/token`                               | none                 | form-encoded, code is single use; `AuthMcpTokenResult`; 400 with `{error}`                 |

    A guest route refuses with `{reason, message}`: 403 for `invalid`, `inactive` and
    `unavailable`, 400 for a bad message, 409 otherwise. The session cookie is
    HttpOnly and names one share, so a guest's client needs a `fetch` that keeps it,
    as for a browser session. A webhook's path holds its token, so no error names
    the path. The signature, when the task requires one, is over the raw bytes, and
    `input.headers` carries it. `webhookUrlParams` splits an endpoint's `path` into
    route params.

    An MCP client gets a token for `/mcp` with these OAuth routes and PKCE, with no client
    secret. `authorize` answers with a redirect: to `/connect-agent` with the same query, or to the
    client's verified `redirect_uri` with `error`. The route does not follow it, and answers with
    `{location}`. `approval` and `decision` serve that page. A `decision` is `deny`, `pairing-code`
    or `browser-session`. A `browser-session` needs the session's cookie and the `csrfToken` from
    `approval`, and its scopes must cover the `access`. The server takes that session only from
    the cookie, so a bearer token adds nothing. After an approval, `redirectTo` holds a one-use
    `code` that lasts one minute, and `token` exchanges it with the PKCE verifier. A token request
    spends the code that it presents, also when a later check fails.

    A signed URL comes from `assets.createUrl` or `attachments.createUploadUrl` as
    `relativeUrl`. The token in its path is the credential, so these routes do not
    send the session's token, and no error names the path. `assetUrlParams` and
    `attachmentUploadUrlParams` split a `relativeUrl` into route params. `assets.read`
    holds the whole file in memory and sends no `range` header. A caller that needs
    part of a large file fetches `relativeUrl` itself, which takes no credential.
    An asset token for a browser document also reads the files next to it, by path.

    `GET /api/preview-stream/ws` is the viewer socket of a tab in the server's browser.
    `T3Client.openPreviewViewer` opens it with a ticket for the `media` use and
    `orchestration:read`. Query `threadId`, `tabId`, `maxWidth`, `maxHeight`, `quality` and
    `interactive`. A binary message is one JPEG frame, and the server sends the next
    after a `{"type":"ack"}`. A text message is JSON: `viewport`, `control`, `probe`,
    `clipboard`, `pointer`, `fileChooser`, `fileChooserClosed`, `popup` or `download`. The
    viewer sends `takeControl`, `releaseControl`, `dialog`, `mouse`, `wheel`, `key`, `text`,
    `resize`, `viewport`, `navigate`, `history`, `reload` and `probe`, and the server drops them
    without `preview:operate`. Close 4404 means that the tab is gone, 4503 has a JSON
    reason with the host setup that the browser needs, and 1012 asks for a new attach.
    The `upgrade` is 503 when the browser fails in another way. Upstream has no contract for these
    messages, so `schemas/previewViewer.ts` mirrors `ServerBrowser.ts`.

    `GET /ws/voice` is one live transcription. `T3Client.openSpeechStream` opens it with a
    ticket for the `media` use and `orchestration:operate`; the upgrade is 401 without a
    valid ticket and 403 without that scope. The first text message is
    `{"type":"start","options"}` with the recognition options of `voice.transcribe`, at most
    `SPEECH_MAX_OPTIONS_BYTES`. Each binary message is 16 kHz mono Float32 PCM, at most
    `SPEECH_STREAM_MAX_CHUNK_BYTES`. `{"type":"finish"}` asks for the final text. The server
    answers in arrival order: `ready` for `start`, `update` with `revision` and
    `{committed, tentative}` (or `null`) for each audio message, and `finished` with `text`,
    then close 1000. Any failure sends `error` with a generic `message` and closes with 1008.
    The server ends a stream after ten minutes. `schemas/speechStream.ts` mirrors
    `SpeechStreamCommand` and `SpeechStreamEvent`.

    In this table "bearer" is any access token. A proof-bound session sends
    `authorization: DPoP <token>` and a `dpop` header in place of
    `authorization: Bearer <token>`. `POST /oauth/token` with a `dpop` header binds
    the session it issues to that key and answers with `token_type: "DPoP"`.

    A DPoP proof (RFC 9449) is a compact ES256 JWT with the header
    `{typ: "dpop+jwt", alg: "ES256", jwk}`, where `jwk` is the public P-256 key,
    and the claims `htm`, `htu` (the URL without query and fragment), `jti`, `iat`
    (within 300 seconds of the server clock) and, with a token, `ath` (the base64url
    SHA-256 of that token). The server refuses a `jti` it has seen. A socket upgrade
    names `http` or `https` in `htu`. A ticket minted for the `rpc` use is bound to
    the key, and the proof rides in the `dpop` query parameter with `ath` over the
    ticket. A bare or `media` ticket is not bound, so a proof-bound client mints for
    `rpc`. A refused proof
    is a 401 `EnvironmentAuthInvalidError` with `dpopFailureReason` and a
    `www-authenticate: DPoP` header.

    The server refuses a bound token sent as a bearer token.

    The orchestration query options take effect only with the value `1`: `deferWork`
    and `compactTurnItems` on the bounded route, `deferWork` on the history route,
    `omitIdleSubagents` and `omitOlderSettled` on the shell route. The route table
    does not offer the wire forms `compactIds` and `dedupeBodies`: they save bytes,
    and the snapshot schemas decode whole ids and bodies.

    HTTP errors are JSON tagged records: `EnvironmentRequestInvalidError` (400),
    `EnvironmentAuthInvalidError` (401), `EnvironmentScopeRequiredError` and
    `EnvironmentOperationForbiddenError` (403), `EnvironmentResourceNotFoundError`
    (404), `EnvironmentInternalError` (500). Each carries `code`, `reason` and
    `traceId`. A scope error names the scope the request needs in
    `requiredPermission` and its legacy parent in `requiredScope`.

    Scopes are granular: `orchestration:read`, `orchestration:operate`,
    `settings:write`, `providers:manage`, `environment:maintain`,
    `preview:operate`, `diagnostics:read`, `terminal:read`, `terminal:operate`,
    `filesystem:read`, `filesystem:write`, `source-control:write`, `access:read`,
    `access:write`, `relay:read`, `relay:write`. `review:write` still decodes but
    grants nothing. Session state, pairing links, and client sessions report the
    whole grant in `permissions` and only the legacy vocabulary in `scopes`;
    `grantedScopes()` reads whichever is present. A pairing credential may ask for
    any grantable scope.

    `server.updateSettings` needs `settings:write`. A patch whose only keys are
    `providerInstances`, `usageLimitSources`, `secretProviders` or
    `textGenerators`, or an empty patch with a `providerInstanceMutation`, needs
    `providers:manage` in its place. A patch with both kinds needs both. A patch
    that removes a secret provider (a null entry) needs both, since the server
    also clears the settings that read from it. A key the target build does not
    know counts for neither.

    `server.retryResourceTelemetry` restarts the server's resource monitor, so it
    needs `diagnostics:read` and `environment:maintain`.

    The provider sign-in methods need `providers:manage`, as does
    `provider.consumeResetCredit`. `provider.uploadFeedback` needs
    `orchestration:operate`. An instance has sign-in methods only when its driver
    has a sign-in controller, and any other instance refuses with
    `ProviderSetupError`. A flow belongs to the session that started it: another
    session sees its phase without its `flowId`, URL or interaction.

    `provider.chatgpt.handoff.subscribe` runs a sign-in in memory for another
    environment, and closing the stream ends it. Its `finished` item holds a
    `ChatGptTransferredProfile` with live tokens, and
    `provider.chatgpt.import-profile` takes that profile. The library does not store
    it.

    An Effect `Option` field arrives as a `{ _tag: "None" }` or
    `{ _tag: "Some", value }` record, and a schema keeps that form. The
    diagnostics results report a failed read in an `Option` field and keep what
    they read.

    WebSocket at `GET /ws`. Authentication on the upgrade is either
    `?wsTicket=<ticket>` (with `dpop=<proof>` for a bound ticket) or an
    `authorization` header. Optional query
    parameters `clientSurface=cli` and `clientAppVersion` label the connection in
    the server's client list. `clientCapabilities=settingsSecretReferences` tells
    the server that secret settings fields may hold a secret provider reference;
    without it the server shows a reference as a saved, redacted secret. Messages are JSON text, one envelope per frame (the
    server may also send a JSON array of envelopes). Envelopes:

    ```text
    client → server
      {"_tag":"Request","id":"<string>","tag":"<method>","payload":{...},"headers":[]}
      {"_tag":"Ack","requestId":"<id>"}          after every Chunk, or the stream stalls
      {"_tag":"Interrupt","requestId":"<id>"}    cancels a stream or call
      {"_tag":"Ping"}                            every ~5 s; the server answers Pong
      {"_tag":"Eof"}

    server → client
      {"_tag":"Chunk","requestId":"<id>","values":[...]}          one or more stream items
      {"_tag":"Exit","requestId":"<id>","exit":{"_tag":"Success","value":...}}
      {"_tag":"Exit","requestId":"<id>","exit":{"_tag":"Failure","cause":[
            {"_tag":"Fail","error":{"_tag":"OrchestrationV2DispatchCommandError","message":"…"}}
          | {"_tag":"Die","defect":"Missing key\n  at [\"runId\"]"}
          | {"_tag":"Interrupt","fiberId":797} ]}}
      {"_tag":"Defect","defect":...}             connection-level failure
      {"_tag":"Pong"}
    ```

    `headers` is required on `Request`; omitting it makes the server close the
    socket without a reason. A stream ends with an `Exit` (an `Interrupt` cause
    after the client cancels). A payload the server cannot decode surfaces as a
    `Die` with a string defect, so the client validates payloads before sending
    to give a better error.

    Orchestration RPC methods (`ORCHESTRATION_V2_WS_METHODS` in the contracts;
    scope in `apps/server/src/auth/RpcAuthorization.ts`):

    | Method                                   | Scope        | Payload → result                                                                                                                                      |
    | ---------------------------------------- | ------------ | ----------------------------------------------------------------------------------------------------------------------------------------------------- |
    | `orchestration.dispatchCommand`          | orch:operate | `OrchestrationV2Command` → `{sequence}`; fails `OrchestrationV2DispatchCommandError`                                                                  |
    | `orchestration.launchThread`             | orch:operate | `OrchestrationV2ThreadLaunchInput` → `{threadId, projection, resumed}`                                                                                |
    | `orchestration.getThreadProjection`      | orch:read    | `{threadId}` → `OrchestrationV2ThreadProjection` with a bounded timeline window                                                                       |
    | `orchestration.getTurnItem`              | orch:read    | `{threadId, itemId}` → `{item}` with the full, size-bounded input and output                                                                          |
    | `orchestration.getWorkflowScript`        | orch:read    | unchanged                                                                                                                                             |
    | `orchestration.getNativeChildWork`       | orch:read    | `{threadId}` → `{children}`; empty unless the thread is an Antigravity-native subagent's child; fails `OrchestrationV2GetNativeChildWorkError`        |
    | `orchestration.stopWorkflow`             | orch:operate | `{threadId, subagentId}` → nothing; fails `OrchestrationV2StopWorkflowError` with a `reason`                                                          |
    | `orchestration.forceStopThread`          | orch:operate | `{threadId, runId?}` → `{outcome, sharedWithThreadIds}`; fails `OrchestrationV2ForceStopThreadError`, `reason: "superseded"`                          |
    | `orchestration.getTurnDiff`              | orch:read    | unchanged                                                                                                                                             |
    | `orchestration.getFullThreadDiff`        | orch:read    | unchanged                                                                                                                                             |
    | `orchestration.searchThreads`            | orch:read    | `{query, limit?, olderSettledBefore?, projectIds?, environmentLabel?, titlesOnly?}` → `{matches, snapshotSequence?, threads?}`                        |
    | `orchestration.searchThread`             | orch:read    | `OrchestrationV2SearchThreadInput` → `OrchestrationV2SearchThreadResult`: one match and the navigation around it                                      |
    | `orchestration.searchThreadStream`       | orch:read    | the same input → stream of results that converge; the last has `complete: true`                                                                       |
    | `orchestration.getArchivedShellSnapshot` | orch:read    | `{}` → `OrchestrationV2ArchivedShellSnapshot`                                                                                                         |
    | `orchestration.getThreadFamily`          | orch:read    | `{threadId}` → `{snapshotSequence, threads}`: active threads with the same root                                                                       |
    | `orchestration.getWorktreeThreadIds`     | orch:read    | `{worktreePath}` → `{threadIds}`                                                                                                                      |
    | `orchestration.getOlderSettledThreads`   | orch:read    | `{before: {settledAt, threadId?}, projectIds?, limit}` → `{snapshotSequence, threads, counts}`; `limit: 0` fills only `counts`                        |
    | `orchestration.subscribeShell`           | orch:read    | `{afterSequence?, requestCompletionMarker?, omitIdleSubagents?, omitOlderSettled?}` → stream of `OrchestrationV2ShellStreamItem`                      |
    | `orchestration.subscribeThread`          | orch:read    | `{threadId, afterSequence?, requestCompletionMarker?, acceptBoundedSnapshot?, acceptCompactTurnItems?}` → stream of `OrchestrationV2ThreadStreamItem` |
    | `orchestration.subscribeCommandOutput`   | orch:read    | `{threadId, itemId}` → stream of `{kind, text, truncated, running}` frames, ending after `running: false`; fails `OrchestrationV2CommandOutputError`    |

    Projects are not orchestration commands: `projects.mutate` (orch:operate)
    takes a `ProjectMutation` (`project.create`, `project.update`,
    `project.delete`) and answers with the `Project`; it fails with
    `ProjectMutationError`, whose `cause` names a missing project. A create or
    update that carries `scripts` also needs `settings:write`, because project
    scripts run on the host. The shell stream reports projects as
    `project.updated` and `project.removed`.

    Context transfers in thread projections, HTTP detail snapshots and
    `context-transfer.created` / `context-transfer.updated` events expose optional
    `sourceTokenUsage` metadata with the provider-turn usage shape. Native forks
    can retain the source turn's usage; older transfers and portable handoffs can
    omit it. Nested usage values are validated and unknown metadata survives.
    Reading this metadata does not enforce a context budget or perform a fork.

    Subagent turn items expose optional `progress` through thread projections,
    HTTP detail snapshots, visible rows and turn-item events. Strings, including
    empty strings, and null are preserved. Omission stays absent; other values
    fail decoding. Null represents unavailable progress in stock server projections.
    Reading this metadata does not stop work or change completion policy.

    Approval-request turn items expose optional string `reason` through thread
    projections, detail snapshots and turn-item events. Empty and arbitrary strings
    are valid. Omission stays absent, malformed values fail decoding, and unknown
    metadata survives. Reading the reason does not answer the approval or change
    permissions.

    User-input question options expose optional string `preview` through thread
    projections, HTTP detail snapshots and `turn-item.updated` events. Empty and
    arbitrary strings are valid; older servers and provider reports can omit it.
    Unknown option metadata survives decoding. Reading preview metadata does not
    answer a question or change its response policy.

    Pending background tasks in provider-thread projections, HTTP detail snapshots,
    provider-thread events and thread shells expose optional `parentTaskId` metadata.
    It identifies the subagent task that started the work and waits on it. Values
    are trimmed nonempty strings for every task kind, including fallback kinds.
    Omission stays absent, malformed values fail decoding, and unknown metadata
    survives. Reading the field does not start work or change completion policy.

    Pending subagent tasks expose optional `providerInstanceId` through these
    same reads and events. Derived shell work identifies the owning provider
    thread's instance. Values use the open provider-instance slug contract:
    trimmed, at most 64 characters, starting with a letter and containing only
    letters, digits, hyphens and underscores. Omission stays absent and malformed
    subagent values fail decoding. Other task kinds keep this key as unknown
    metadata. Reading it does not select a provider or start work.

    A workflow run is a subagent whose `workflow` field carries the provider's
    replace-in-full view of the run: an append-only phase list and one entry
    per agent. Workflow agents expose optional nonnegative integer `completedAt`
    metadata in epoch milliseconds through projection/detail reads and subagent
    updates. Zero and omission are preserved; malformed values fail decoding,
    and unknown metadata survives. Reading it does not change workflow completion.
    `orchestration.stopWorkflow` stops the run by that subagent; the
    `subagent.stop` command stops one provider-native child while its run keeps
    working. The server advertises thread find with `threadFind` and
    `threadFindProgressive` in `ServerConfig`.

    With `acceptCompactTurnItems`, a bounded snapshot may omit from
    `projection.turnItems` the items its local visible rows already carry and
    sets `turnItemsOmitLocalVisible: true`. `boundedSnapshotProjection` puts
    them back; the thread watch does this before it yields the snapshot, so a
    watch consumer always sees the whole list.

    A thread stream starts with `{kind:"snapshot", snapshotSequence, projection}`
    unless `afterSequence` is given, in which case persisted events after it are
    replayed instead (the snapshot is still sent when the replay would be too
    large or when nothing is newer). `requestCompletionMarker` puts a
    `{kind:"synchronized"}` between catch-up and live delivery. Each event is
    `{kind:"event", sequence, event}` where the event is an
    `OrchestrationV2DomainEvent`: `id`, `threadId`, `occurredAt`, `type`, and a
    `payload` that is the whole record the event changed (`thread.*` carry the
    thread, `run.created`/`run.updated` a run, `turn-item.updated` a turn item,
    `runtime-request.updated` a runtime request, `message.updated` a message,
    and so on). Applying an event is an upsert by id; the T3 web client folds
    events the same way. `thread.pull-request-link-updated` is the exception: its
    payload is one `ThreadPullRequestLink`, which replaces the thread's link with
    the same host, repository, and number. A thread without `pullRequests` reads
    its `linkedPullRequest` as a one-link list first. Keys compare as upstream's
    shared `threadPullRequests` keys them: host and repository case-insensitively,
    with a Forgejo link's port and the Azure DevOps host forms folded in.

    Thread pull request links in app and shell threads, projections and
    `thread.pull-request-link-updated` events expose optional nonempty string
    `repositoryWebUrl` metadata. It carries the supplied browser or clone URL;
    older links can omit it. Malformed values fail decoding and unknown metadata
    survives. Reading the field does not fetch a repository.

    The same links expose optional `endedWatch` using `ThreadPullRequestWatch`:
    start and remark timestamps, nullable head SHA, check and remark arrays,
    pass/conflict flags and wake count. Omission stays absent; missing
    `passedChecks` decodes to an empty array. Malformed watch records fail
    decoding and unknown metadata survives. Reading the field does not restart a watch.

    Linked pull request snapshot authors expose optional boolean `isBot` through
    app and shell threads, detail and projection reads, thread snapshots and
    `thread.pull-request-link-updated` events, and shell snapshots and updates.
    True and false survive; omission stays absent and unknown actor metadata
    survives. Malformed values fail decoding; later valid stream items remain
    available. Reading this metadata does not change author permissions.

    The existing `thread.pull-request.link` command accepts optional nonempty
    string `repositoryWebUrl` metadata through `threads.dispatch`. Browser URLs,
    clone URLs and other nonempty strings retain the tagged wire type; omission
    leaves the metadata unsupplied. Malformed values fail before dispatch and
    unknown command metadata survives. Sending the field does not fetch a repository.

    The optional `link` on the existing `thread.pull-request.watch` command also
    accepts optional nonempty string `repositoryWebUrl` through `threads.dispatch`.
    Browser URLs, clone URLs and other nonempty strings pass through; omission
    leaves it unsupplied, malformed values fail before sending, and unknown nested
    metadata survives. This metadata does not change watch policy.

    `thread.metadata.update` and `threads.update` accept optional nullable
    nonempty string `expectedBranch` metadata. The server compares a supplied
    value with the current branch and rejects a mismatch. Null expects no branch;
    omission leaves this precondition unsupplied. Strings are trimmed, malformed
    values fail before sending, and unknown metadata survives.

    Conversation messages in projections and `message.updated` events expose
    optional boolean `workflowScript` metadata. True identifies a provider-native
    workflow script, false identifies ordinary text, and omission preserves older
    servers and producers that do not supply the classification. Malformed values
    fail decoding; unknown metadata survives. Reading the field does not execute a
    workflow, change message text or choose a display policy.

    User-message turn items in projections, transcript/history rows and
    `turn-item.updated` events expose optional boolean `workflowScript` metadata.
    True identifies a provider-native workflow script, false identifies ordinary
    text, and omission preserves producers that do not supply the classification.
    Malformed values fail decoding; unknown metadata survives. Reading the field
    does not execute a workflow, change message text or choose a display policy.

    The transcript route answers with the thread's `visibleTurnItems`, its
    `title`, and `updatedAt` in one read. It refuses a thread whose transcript is
    larger than the server's file attachment limit.

    `message.dispatch` carries `dispatchMode` and, optionally, `deliveryIntent`.
    With `deliveryIntent: "auto"` the server resolves the mode against its
    serialized thread state: a new run when nothing is active, otherwise steer
    or queue by the provider's capabilities. The server links the message to its
    run: the run's `userMessageId`, and the message record's `runId`. Run
    statuses are `preparing`, `queued`, `starting`, `running`, `waiting`, and
    the terminal `completed`, `interrupted`, `failed`, `cancelled`,
    `rolled_back`. `run.interrupt` needs a `runId`; `holdQueue` holds successors
    when interrupting that run. The active run an interrupt targets is the highest-ordinal run
    that is `preparing`, `starting`, `running`, or `waiting`; a queued run has
    not started and is not interruptible. Commands carry `createdBy` and `creationSource` where they
    create something; the server stamps `createdBy: "user"` on everything a
    client dispatches.

    `thread.stop` carries `commandId`, `threadId` and an optional `reason`
    string. `threads.stopThread`, `threads.dispatch` and typed `rpc.call` validate
    and send it: any
    string reason passes unchanged, omission stays absent, unknown metadata
    survives, and malformed fields fail before sending. A server that accepts
    it advertises `threadStop`; the library does not check that flag. A missing
    thread fails with `OrchestrationV2DispatchCommandError`. `threads.stop`
    still sends `run.interrupt` with `holdQueue` and remains an idle no-op.
    `stopThread` dispatches directly, including when no active run exists; the
    server stops background work and holds queued successors.

    `thread.tag.set` carries `commandId`, `threadId`, a `tag` and a boolean
    `tagged`; true adds the tag and false removes it. `threads.dispatch` and
    typed `rpc.call` validate and send it: a tag is trimmed, nonempty, at most
    64 characters and one line, and tags match by exact spelling and case.
    Malformed fields fail before sending. The server records
    `thread.tags-updated`, a thread state event with the whole thread as its
    payload. App and shell threads, projections and their events expose
    optional `tags`; omission stays absent and a malformed stored list reads
    as empty instead of failing the thread.

    User-message turn items expose optional `modelSwitch` `{from, to}`, two
    model selections, when the run that message starts changes the model or
    its options on the same harness. Omission means no change. Provider turn
    capabilities expose optional boolean `activeSteeringAcceptsAttachments`;
    false means a steer with attachments restarts the turn instead.

    `queued-run.start` carries `commandId`, `threadId` and `runId`, all
    required. `threads.startQueuedRun`, `threads.dispatch` and typed `rpc.call`
    validate and send it:
    ids use the same trimmed normalization as the other queued-run commands,
    unknown metadata survives, and malformed or missing ids fail before
    sending. The server starts the selected run only while the thread is
    stopped, the run is a queued plain user message and no other run blocks
    it. A missing thread or an unknown run fails with
    `OrchestrationV2DispatchCommandError`. No capability flag advertises it,
    and no capability gate blocks dispatch. `threads.resumeQueue` sends
    `queue.resume`. Both commands release the hold for all queued runs; selected
    start chooses the requested run first, so other queued messages can follow.
    Facade methods generate fresh command ids and preserve cancellation and
    dispatch failures. Successful calls acknowledge dispatch, not terminal state.

    The thread shell carries `status` (`idle` or the latest run's status),
    `activeRunId`, `pendingRuntimeRequest`, and `latestVisibleMessage`, so a
    list view needs no projection. Its optional boolean `latestRunStopRequested`
    reports whether the latest run has an interruption request; older servers can
    omit it. Reading this metadata does not request a stop. The optional boolean
    `blockedOnThreadWait` reports whether the active run is blocked on thread-wait
    work; older servers can omit it. Reading it does not change wait behavior.
    The optional nullable string `lastErrorCode` reports the current provider
    failure code, or null when none applies; older servers can omit it.
    A non-null `pendingRuntimeRequest` summary has optional boolean `blocking`: false
    for an async question the run keeps working past. Older servers can omit it.
    Null and nonboolean values fail decoding; unknown summary metadata survives.
    Reading this metadata does not answer the request or change run behavior.
    The shell snapshot has `threads` and
    `archivedThreads`, but the server fills `archivedThreads` only on the socket
    snapshot; archived threads are read with
    `orchestration.getArchivedShellSnapshot`. The server has no live archived
    stream.

    A shell reader can ask for fewer rows, on the socket with the booleans
    `omitIdleSubagents` and `omitOlderSettled` and over HTTP with the query value
    `1` for the same names. `ServerConfig.shellThreadFamilies` and
    `ServerConfig.shellOlderSettled` advertise them; the client sends them only when
    its caller asks. `omitIdleSubagents` rows are read with
    `orchestration.getThreadFamily` and `orchestration.getWorktreeThreadIds`.
    `omitOlderSettled` adds `olderSettled` (`before`, `asOfSequence`, `counts`) to
    the snapshot, and those rows are read with
    `orchestration.getOlderSettledThreads` or with `olderSettledBefore` on
    `orchestration.searchThreads`. Search matches carry optional `quality`, `hits`
    and `messageId`.

    `ServerConfig.lastEventLoopStall` is optional recent server event-loop stall
    metadata in configuration reads and configuration stream snapshots. Its
    `detectedAt` is a string, `durationMs` is a nonnegative integer, `cpuCount` is
    a positive integer and `loadAverage` is an optional number (absent on Windows).
    Omission means no recent stall was supplied. Null and malformed objects fail
    decoding; unknown metadata is preserved. Detection and expiry belong to the
    server; reads do not cache the value or change timing.

    `projects.ensureScratch` finds or creates the environment's Scratch project,
    rooted at `ServerConfig.scratchWorkspaceRoot`; the server sends that field
    only when its data directory is outside a Git checkout, and fails the call
    otherwise. `projects.createNew` makes a folder under
    `ServerConfig.newProjectsRoot` with a README, an icon and a first commit,
    then creates the project; a failed commit is reported in `commitError` and
    keeps the project. `projects.createFromThread` turns the own Scratch folder of
    a No project thread into a project, in place, and moves every thread that works
    in that folder; a repeated call finishes a partial move. A thread with no own
    Scratch folder or a moved thread with unfinished work fails the call with
    `OrchestrationDispatchCommandError`. The capability
    `threadProjectFromScratch` advertises it. The command this method dispatches,
    `thread.project.adopt-folder`, is internal to the server: it is not in
    `OrchestrationV2Command` and the server refuses it from a client.

    `project.update` accepts booleans `pinned` and `archived`. The server stores them
    as `pinnedAt` and `archivedAt` on `Project` and `OrchestrationProjectShell`, both
    optional and nullable. The capability `projectOrganization` advertises this, and
    older servers drop the fields. An archived project stays in the shell, with its
    threads and files.

  approval-full-access-override: >-
    Approval-request turn items expose optional fullAccessOverride metadata through
    thread projections, detail snapshots and turn-item events. The known values
    ask_rule and provider_check describe why the provider requested approval in
    full-access mode. Future string values survive; omission stays absent and
    nonstring values fail decoding. Reading this metadata does not answer an
    approval or change permissions.

  native-fork-head-metadata: >-
    Provider-thread native metadata exposes optional forkHeadMessageId through
    thread projections, detail snapshots and provider-thread.updated events.
    It identifies the native message at a fork head. Strings are trimmed and
    must be nonempty; omission stays absent, malformed values fail decoding
    and unknown metadata survives. Reading this field does not create or
    resume a fork.

  thread-context-usage-cost: >-
    Provider-thread contextUsage exposes optional cost through thread projections,
    HTTP detail snapshots and provider-thread.updated events. The loose cost object
    requires a finite numeric amount and a trimmed nonempty currency string of at
    most 32 characters. Negative, zero and fractional amounts are valid; currency
    has no format restriction. Omission stays absent, malformed values fail decoding
    and unknown cost and usage metadata survives. Reading this metadata does not
    price usage, convert currencies or start provider work.
