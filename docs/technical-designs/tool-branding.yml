$schema: https://refinery.systems/ontology/technical-design
title: CLI and MCP tool marks
objective: Identify t3c and t3mcp with matching SVG icons in their product documentation.
relationships:
  references: [documentation, command-line, mcp]
proposed-design:
  marks: |
    Both square marks use a dark blue-green rounded tile, white outlined lettering
    and a mint symbol. The t3c mark combines t3c with a command prompt. The t3mcp
    mark combines t3mcp with the MCP symbol. Lettering is SVG path geometry, so no
    font download or platform font substitution affects the mark.
  assets: |
    Each product owns assets/logo.svg in its docs folder. docs/user/docs.yml
    registers both files and selects them as logo and favicon. The MCP product
    also uses its mark as catalog media. The same assets work on light and dark
    backgrounds and have accessible SVG titles and descriptions.
  attribution: |
    The MCP symbol geometry is from modelcontextprotocol/docs favicon.svg at
    573dc60c2e7aab2605b29d0bf27194aa7b02e4fb. Its MIT notice is retained in the
    derived SVG. The t3mcp lettering identifies this tool; the symbol identifies
    its Model Context Protocol integration.
