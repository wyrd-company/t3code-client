$schema: https://refinery.systems/ontology/technical-design
title: t3code-mcp cross-server MCP design
objective: >-
  Let an agent on one machine dispatch, message, wait on and read threads on
  other T3 Code servers through Model Context Protocol tools.
relationships:
  related-to:
    - library
    - profiles
  references:
    - testing
    - releasing
    - composition
proposed-design:
  high-level-overview: >-
    @wyrd-company/t3code-mcp is a stdio MCP server built on the official
    TypeScript MCP SDK and @wyrd-company/t3code-lib. It connects to one or more
    named T3 Code servers and exposes their thread and project capabilities as
    tools. Every tool that touches a server names it. Operators select servers
    and filter tools; agents cannot add servers or credentials.
  scope: |
    T3 Code already gives each agent an internal `t3-code` MCP server that acts
    on its own environment. This package adds the other environments. Its first
    use case is cross-server communication and thread dispatch: start a thread
    on another server, send it messages, wait for it, answer it and read the
    result.

    The package does not proxy the internal `t3-code` server and does not depend
    on the calling thread's identity. It cannot see which thread called it, so it
    applies no caller ownership rules. Each server's paired credential and the
    operator's tool policy bound what an agent can do.

    Out of scope for 0.1.0: Streamable HTTP transport, attachments, thread
    deletion, forks and merge-backs, worktree handoff, queue editing,
    scheduled tasks, previews and devices. They can be added as tools later.
  vocabulary: |
    A **server** is one T3 Code environment the package connects to, addressed
    by a configured **server name**. A server name is the same name a t3c
    profile uses. **Thread**, **run**, **turn**, **project** and **pending
    request** have their library meanings. A **tool policy** is the set of
    tools exposed globally plus a per-server set of tools that may act on that
    server.
  module-map: |
    ```text
    packages/t3code-mcp/
      .claude-plugin/plugin.json  Claude Code plugin manifest (npm source)
      .mcp.json                   plugin MCP server entry
      docs/                       wyrd.foo pages and docs.yml
      src/
        cli.ts                    executable: argument parsing, subcommands
        index.ts                  public exports: createServer, loadConfig, types
        config/                   config file, flags and environment → McpConfig
        servers/                  ServerRegistry: name → lazy T3Client, close()
        policy/                   tool filter and per-server policy
        server.ts                 McpServer composition: registers allowed tools
        tools/                    one module per tool family, ToolSpec records
        views/                    compact thread, run and request views for results
        errors.ts                 ToolError and its codes
      test/
        protocol/                 declarative MCP protocol cases and runner
        vendor/mcp-server-tester/ vendored response validator (MIT, attributed)
        live/                     two pinned temporary servers, opt-in agent turns
    ```
  servers-and-credentials: |
    Server credentials come from t3c profiles through `ProfileManager`, so a
    server paired once with `t3c auth pair` or `t3code-mcp pair` works for both
    tools. The package never stores a credential of its own.

    A config file may also define a server by URL with a token taken from a
    named environment variable. This serves plugin and CI installs that have no
    profile directory. The file never contains a token.

    ```json
    {
      "servers": {
        "build": {},
        "lab": { "profile": "lab-box" },
        "ci": { "url": "https://t3.example", "tokenEnv": "CI_T3_TOKEN" }
      },
      "defaultServer": "build",
      "allowTools": ["*"],
      "denyTools": [],
      "serverPolicies": {
        "ci": { "denyTools": ["thread_interrupt"], "maxRuntimeMode": "auto-accept-edits" }
      }
    }
    ```

    An empty server entry uses the profile with the same name. Without a
    `servers` key, every t3c profile is a server. `--server <name>` (repeatable)
    and `T3CODE_MCP_SERVERS` (comma-separated) restrict the set. A tool call
    without `server` uses `defaultServer`, else the only configured server,
    else fails with `server_required`.

    Clients open lazily on a server's first call and close when the MCP session
    ends. The library reconnects a dropped socket. A failed open does not stop
    other servers.
  configuration-precedence: |
    Flags override environment variables, which override the config file.

    | Setting        | Flag                  | Environment                 | Default                                  |
    | -------------- | --------------------- | --------------------------- | ---------------------------------------- |
    | config file    | `--config <path>`     | `T3CODE_MCP_CONFIG`         | `$XDG_CONFIG_HOME/t3code-mcp/config.json` |
    | servers        | `--server <name>`     | `T3CODE_MCP_SERVERS`        | config `servers`, else all t3c profiles  |
    | default server | `--default-server`    | `T3CODE_MCP_DEFAULT_SERVER` | config `defaultServer`                   |
    | allowed tools  | `--allow-tools <list>`| `T3CODE_MCP_ALLOW_TOOLS`    | config `allowTools`, else `*`            |
    | denied tools   | `--deny-tools <list>` | `T3CODE_MCP_DENY_TOOLS`     | config `denyTools`, else none            |
    | read-only      | `--read-only`         | `T3CODE_MCP_READ_ONLY=1`    | off                                      |

    A missing default config file means no file. A missing explicit file, invalid
    JSON or an invalid shape stops startup with a message on stderr and a
    nonzero exit. Profile config location follows t3c (`T3C_CONFIG_HOME`).
  tool-policy: |
    Tool lists are comma-separated names; `*` matches any run of characters.
    The exposed set is computed once at startup:

    1. Start with tools matching `allowTools`.
    2. Remove tools matching `denyTools`.
    3. With read-only, remove every tool that is not read-only.
    4. A tool marked opt-in (`approval_respond`) is exposed only when an allow
       list names it exactly; a wildcard does not enable it.

    Removed tools are not registered, so agents do not see them. Per-server
    `allowTools` and `denyTools` apply the same matching at call time and fail
    with `tool_denied`. Per-server `maxRuntimeMode` refuses launches and sends
    that request a broader runtime mode (`runtime_mode_denied`); a launch
    without a runtime mode on such a server uses the cap. Mode breadth order:
    `approval-required` < `auto-accept-edits` < `auto` < `full-access`.

    `t3code-mcp tools` prints the exposed set for the resolved configuration.
  tools: |
    Names follow T3 Code's own tool vocabulary without the `t3_` prefix. Every
    tool except `server_list` takes optional `server`.

    | Tool                      | Read-only | Does                                                                         |
    | ------------------------- | --------- | ---------------------------------------------------------------------------- |
    | `server_list`             | yes       | configured servers; with `probe`, reachability, version and environment      |
    | `server_capabilities`     | yes       | provider instances, models, model options and runtime modes of one server    |
    | `project_list`            | yes       | projects on a server, paginated                                              |
    | `project_ensure`          | no        | find or create the project for a workspace root on a server                  |
    | `thread_list`             | yes       | threads on a server, newest first, filtered by project, status, title, settled |
    | `thread_read`             | yes       | thread state and a paginated timeline (`messages` or `activity` view)        |
    | `thread_launch`           | no        | create a thread with an optional first message and workspace strategy        |
    | `thread_send`             | no        | send a message: `auto`, `queue`, `steer` or `restart`                        |
    | `thread_wait`             | yes       | wait for one or more threads, on any servers, until `any` or `all` settle     |
    | `thread_interrupt`        | no        | interrupt the active or named run                                            |
    | `thread_update`           | no        | `rename`, `settle`, `unsettle`, `archive` or `unarchive`                     |
    | `pending_request_list`    | yes       | open questions and approvals of a thread                                     |
    | `pending_request_respond` | no        | answer a question                                                            |
    | `approval_respond`        | no, opt-in| accept or decline an approval request                                        |

    `thread_launch` takes `projectId`, `workspaceRoot` (ensured into a project)
    or `scratch: true`; `modelSelection` (`instanceId`, `model`, `options`) is
    required because there is no calling thread to inherit from. The workspace
    strategy is `root`, `existing_worktree` or `worktree`, as in T3 Code.
    `clientRequestId` makes a launch idempotent: the thread id is a UUID v5 of
    the server name and the request id, and the launch reuses an existing
    thread with that id.

    `thread_send` maps modes onto library turn delivery. A send cannot be made
    idempotent with the current library surface; after a lost response, read the
    thread before sending again.

    `thread_wait` returns when the condition holds or `timeoutMs` elapses
    (default 45 s so it returns inside Codex's default 60 s tool timeout,
    maximum 10 min). A thread counts as settled when its latest run is terminal
    or it has a pending request. A timeout does not interrupt work. When the
    request carries a progress token, the tool sends a progress notification
    every 15 s. Cancellation of the MCP request ends the wait.

    `thread_read` reads the transcript through the library and falls back to the
    detail route as t3c does. Item text over `maxCharsPerItem` (default 4000) is
    cut, and the result says so with the item id.

    Results are compact JSON in both `structuredContent` and one text block.
    Each result names its `server`. Thread references are `{server, threadId}`.
  errors: |
    A tool failure returns an `isError` result with `{error:{code,message}}`.

    | Code                  | Meaning                                                 |
    | --------------------- | ------------------------------------------------------- |
    | `invalid_input`       | arguments fail validation beyond the schema             |
    | `server_required`     | no `server` and no default                              |
    | `server_unknown`      | name not configured                                     |
    | `server_unreachable`  | connection or open failure                              |
    | `auth_invalid`        | the server rejects the credential                       |
    | `not_found`           | project, thread or request does not exist               |
    | `invalid_state`       | the thread state does not allow the operation           |
    | `tool_denied`         | per-server policy refuses the tool                      |
    | `runtime_mode_denied` | requested runtime mode exceeds the server's cap         |
    | `upstream_error`      | any other library or server failure                     |

    Messages never contain credentials; library errors pass through the
    library's redaction.
  command-line: |
    ```text
    t3code-mcp [serve] [options]          run the stdio MCP server (default)
    t3code-mcp pair <name> <url>          pair a server; pairing token on stdin or --token
    t3code-mcp servers [--probe]          print configured servers
    t3code-mcp tools                      print the exposed tool set
    t3code-mcp --version | --help
    ```

    Arguments are parsed with `node:util` `parseArgs`. stdout carries only MCP
    traffic while serving; diagnostics go to stderr and never include tokens.
  plugins: |
    The npm package is also a Claude Code plugin: it ships `.claude-plugin/plugin.json`
    and `.mcp.json`, which runs `node ${CLAUDE_PLUGIN_ROOT}/dist/cli.js`. The
    Wyrd agent marketplace lists it with an npm source. The Codex plugin lives in
    the marketplace repository and runs the published package through `npx` at
    a pinned version. Both use the server key `t3code-mcp` and read servers from
    t3c profiles or `T3CODE_MCP_CONFIG`.
  testing: |
    - Unit tests (`vp test`) cover config resolution, tool policy, view shaping
      and each tool handler against a fake `ServerRegistry`.
    - Protocol tests run declarative cases with the official MCP client over
      stdio against the built `dist/cli.js`: initialize, `tools/list` under each
      filter configuration, input schema validity and error results. The case
      runner uses a validator vendored from `r-huijts/mcp-server-tester` at
      commit `1a6d95d` (MIT). Only the deterministic validator is vendored;
      its LLM test generation targets a removed Anthropic API and is not.
    - Live tests start two pinned temporary T3 servers with separate homes and
      connect one MCP process to both. Without `T3_LIVE_AGENT=1` they cover
      discovery, projects, idle launch, update and errors. With it they launch
      `gpt-6-luna` threads, send, wait across both servers and read answers, and
      run a thread on the first server whose own agent dispatches to the second
      through this package. The same protocol cases run against the live pair.
  releasing: |
    The package is the Intentional release unit `t3code-mcp` at
    `packages/t3code-mcp/package.json`, npm `@wyrd-company/t3code-mcp`, records
    `t3code-mcp@X.Y.Z`. It depends on the library through `workspace:*`, which
    packing rewrites to the library's version. It ships `dist`, the plugin
    manifests, LICENSE and README. Publish packs, verifies and publishes it like
    the library, and publishes `packages/t3code-mcp/docs` to wyrd.foo on its
    records. Its first publication follows the same finalization gates as the
    other units: a `t3code-mcp@0.0.0` baseline on main, then Release.
