$schema: https://refinery.systems/ontology/technical-design
title: Generated public documentation projections
objective: Generate complete user reference pages from public library exports and canonical command
  semantics with freshness checks.
relationships:
  references:
    - command-line
    - library
    - profiles
    - releasing
proposed-design:
  high-level-overview: Root docs contains six ordered published guide pages, a generated library
    API reference, public profile guidance and structured internal artifacts. Published pages project
    canonical semantic assets; internal artifacts are outside public navigation.
  library-reference: |
    Generate the [public API reference](../api.md) with `task lib:docs` and verify it
    with `task lib:docs:check`. The generator uses `jsdoc-to-markdown` on compiled
    JavaScript and adds signatures from the public TypeScript source. The
    `typescript-api` development alias supplies the 5.9 compiler API for documentation;
    the build and typecheck toolchain remains TypeScript 7.
  guide-projections: task docs invokes cli:docs, which invokes lib:docs before projecting command,
    output, harness and library pages. task check runs lib:docs:check and cli:docs:check. docs.yml
    registers the existing demo GIF. The documentation Publish job consumes docs/ on CLI release
    tags.
  source-mapping: |
    `packages/t3code-lib/scripts/reference.mjs` reads public exports from
    `packages/t3code-lib/src/index.ts`, compiled JavaScript and TypeScript source
    signatures/profile types, then writes `docs/api.md`. Missing public JSDoc
    fails generation. `packages/t3code-cli/scripts/docs.mjs` projects these sources:

    | Canonical input | Public output | Navigation order |
    | --- | --- | --- |
    | `docs/specifications/assets/command-contract.json` | `docs/commands.md` | 3 |
    | `docs/specifications/assets/output-contract.json` | `docs/policy.md` | 4 |
    | `docs/specifications/assets/harness.json` | `docs/dagu.md` | 5 |
    | `docs/api.md` | `docs/library.md` | 6 |

    Authored `docs/index.md` and `docs/auth.md` occupy orders 1 and 2.
    Semantic assets contain ordered named sections; generation preserves complete
    section bodies and resolves links to public projections or canonical repository
    artifacts. `--check` compares complete generated bytes with the committed page.
