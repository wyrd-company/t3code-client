$schema: https://refinery.systems/ontology/technical-design
title: Public documentation and generated library reference
objective: Publish authored usage guides and a reproducible full library API projection with canonical contract references.
relationships:
  references: [command-line, cli-surface, library, api, library-reference, releasing]
proposed-design:
  high-level-overview: >-
    `docs/user/t3c` contains seven ordered published pages and the registered demo
    GIF, and `docs/user/docs.yml` describes the t3c product.
    Authored guides explain the CLI specification and library behavior. Structured
    technical designs describe implementation ownership and operating mechanisms.
    Only the library API page is generated; JSDoc template data stays in memory.
  library-reference: |
    Generate [the public API reference](../api.md) with `task lib:docs` and verify
    it with `task lib:docs:check`. The generator uses `jsdoc-to-markdown` on
    compiled public JavaScript and adds TypeScript source signatures and profile
    types. The `typescript-api` development alias supplies the 5.9 compiler API;
    build and typecheck remain TypeScript 7. Missing public JSDoc fails generation.
  publication-and-generation: |
    `docs/user/t3c/getting-started.md`, `auth.md`, `commands.md`, `policy.md` and `dagu.md`
    are authored usage guides, in navigation orders 1 through 5. `task docs` invokes
    `cli:docs`, which runs `lib:docs` before projecting the complete `docs/api.md`
    into `docs/user/t3c/library-reference.md` at order 6. Its generator rewrites links and
    adds publishing metadata; `cli:docs:check` compares the complete result.
    `mcp.md` is the authored complementary MCP guide at order 7.
    `task check` runs both freshness checks. `docs/user/docs.yml` registers the existing GIF.
    Publish consumes `docs/user` on CLI and docs release records and on manual runs;
    the docs release changelog at `docs/user/t3c/CHANGELOG.md` is ingested as a
    changelog, not as a page. Published pages and registered assets remain separate
    inputs. The `assets` list is relative to
    `docs/user`; the product fields (`media`, `logo`, `favicon`, `social-image`)
    are relative to the product folder `docs/user/t3c`. Internal structured
    artifacts stay outside `docs/user`.
  canonical-inputs: >-
    The CLI specification and native cli-surface.json asset are colocated in
    docs/specifications. Build copies that native input to the packaged command
    surface. Public guides reference the specification; they are explanatory
    usage documentation rather than independently generated contract projections.
