$schema: https://refinery.systems/ontology/technical-design
title: Sender identity proxy for a shared T3 Code server
objective: >-
  Show who sent each message when people share one stock T3 Code server, with no
  change to the server and no change to messages that agents send.
relationships:
  references:
    - testing
    - releasing
    - documentation
    - mcp
design-challenges:
  no-server-change: |
    Stock T3 Code has one owner identity. It stamps `createdBy: user` on all
    WebSocket commands, so the server cannot name the person. A fork is not an
    option. The sender name must be part of the message text.
  agents-stay-clean: |
    An agent's message has no human sender. Agents in a thread use the server's
    loopback MCP endpoint, and outside agents use `/mcp` or the direct route. None
    of these use a person's WebSocket commands.
  commands-need-exact-text: |
    The server matches some commands on the exact message text, for example
    `/compact` and `/logout`. Added text stops the command.
  attachment-only-placeholder: |
    A turn needs text. A client that sends only images sends the upstream placeholder
    `ATTACHMENT_ONLY_BOOTSTRAP_PROMPT` as that text. Clients hide this text and search
    skips it, but only on an exact match. Added text makes the placeholder visible to
    people. A client that sends only files sends a reference to each file as the text.
proposed-design:
  high-level-overview: |
    `t3c-proxy` is a service in front of one T3 Code server. It has one listener
    for each person, and an HTTPS reverse proxy maps one hostname to each listener.
    Client frames on `/ws` that carry message text receive the person's byline.
    All other traffic passes through unchanged.

    Terms in this design:
    - byline: the last paragraph of a message, `— Sent by <name>`.
    - person's endpoint: the hostname and listener of one person.
    - direct route: a connection to the server that does not use the proxy.
  package: |
    `packages/t3code-proxy` is the independent `@wyrd-company/t3code-proxy` npm
    package and `t3c-proxy` executable. It holds the service and its wire handling.
    It has no public library API.

    The proxy is a service, not a client, so it reads the wire protocol itself. It
    uses no T3 client session, and at runtime it does not depend on
    @wyrd-company/t3code-lib. The executable only reads its options and starts the
    service. Application code does not spawn commands.
  configuration: |
    The people, ports and server come from a YAML file, from flags or from both:

    ```yaml
    upstream: http://127.0.0.1:3773
    host: 127.0.0.1
    users:
      - name: Alice
        port: 4101
      - name: Sam
        port: 4102
    ```

    ```sh
    t3c-proxy --config /etc/t3code-proxy/config.yml
    t3c-proxy --upstream http://127.0.0.1:3773 --user Alice=4101 --user Sam=4102
    ```

    `upstream` is the server URL. `host` is the listener address, which is
    `127.0.0.1` if not given. A flag overrides the same value in the file, and any
    `--user` flag replaces the full `users` list. A name is not empty and is on one
    line, and a name and a port occur only once. An unknown key or an invalid value
    stops the service before it listens. The service reads the file when it starts,
    so a change needs a restart. `upstream` is an `http` or `https` URL with no path,
    query or credentials.

    `--version` prints the package version and `--help` prints the usage.
  message-rewrite: |
    The proxy changes these commands in client text frames on `/ws`:

    | RPC tag                         | Command            | Field                 |
    | ------------------------------- | ------------------ | --------------------- |
    | `orchestration.dispatchCommand` | `message.dispatch` | `text`                |
    | `orchestration.dispatchCommand` | `queued-run.edit`  | `text`                |
    | `orchestration.launchThread`    | any                | `initialMessage.text` |

    A frame holds one request or an array of requests. A frame with no changed
    request is sent byte for byte. A frame that is not JSON, a binary frame and a
    server frame pass unchanged.

    Rules for the byline:
    - Text with a leading `/`, after leading whitespace, has no byline, so that
      slash commands keep working.
    - Empty text becomes the byline alone.
    - The exact placeholder becomes the byline alone, so that people see the attachment
      and the sender and not the placeholder. In its `Ultrathink:` form, the prefix stays
      and the byline replaces only the placeholder.
    - All other text receives two line breaks and the byline.
    - A guest message that the owner sends has the server's own attribution, so it
      has no byline.

    A queue edit starts from the stored text, with the cursor after the byline. The
    proxy finds the last byline at the start of a line that has a configured name,
    using the longest name that matches. It removes only that byline and its leading
    line breaks, keeps all other text, removes white space at the end of the result and, when no text
    comes before the byline, the rest of its line and the line breaks after it, and
    then applies the rules above. The editor's
    name replaces the earlier name. A queue edit that sends the placeholder follows
    the placeholder rule. A new message keeps a byline that the sender
    quotes.
  unchanged-traffic: |
    HTTP requests and upgrades other than `/ws` pass through unchanged, and streamed
    responses are not buffered. This includes `/mcp`, OAuth and web assets, so an
    outside agent on a person's endpoint stays clean. `httpxy` does this forwarding.
    `ws` bridges `/ws`, because the proxy must read frames.

    The bridge has no compression of its own and passes the subprotocol that the server
    selects. Pings and pongs pass end to end.

    The proxy keeps the `Host` and `X-Forwarded-*` headers, so that the server's
    origin checks and its issuer URLs use the person's hostname.
  access: |
    T3 pairing and sessions are the only access control. The proxy has no token,
    no login and no session of its own. A client upgrade completes only after the
    server accepts the upgrade, so the server decides each connection. When the server
    refuses an upgrade, the client receives the server's status and body.

    The byline names an endpoint, and it does not prove a person. Anyone with a
    valid session can use any endpoint. The people who share a server trust each
    other.

    Each person has their own hostname, because cookies ignore ports. The proxy
    listens on loopback or a private network behind the reverse proxy, which supplies
    HTTPS. Only the proxy and the users of the direct route can reach the server.
  connection-behavior: |
    If the server cannot be reached, HTTP answers 502 and an upgrade closes. Closing
    either side of a bridged socket closes the other, and close codes pass through
    when they are valid to send. The bridge sets no frame size limit, so that the
    server's limit applies. The bridge respects backpressure. SIGTERM and SIGINT
    close the listeners and all connections. A WebSocket peer receives close code 1001
    and has one second to complete the close before its connection ends.

    The proxy sets no limit on the time to receive a request, so that a slow upload
    behaves as it does on the direct route. Each forwarded HTTP request has its own
    upstream connection, so that a pooled connection that the server closed cannot
    cause a 502.
  diagnostics: |
    Logs go to stderr. They name the person, the RPC tag and the command type. A
    failure names the person and the error code. Logs never hold message text, tokens,
    cookies, WebSocket tickets or URLs, because a path can hold a token.
  accepted-limits: |
    - Generated thread titles can name the sender, because the byline is in the text.
    - The sender's browser shows the message with no byline until the server's copy
      replaces it.
    - A message with a leading `/` has no sender name. This includes a normal message
      that starts with a file path.
    - `runtime-request.respond` has no byline, so answers and approvals show no sender.
    - The direct route and T3 Connect have no byline.
    - A byline with a name that is not configured stays as text in a queue edit. If
      such a name starts with a configured name, the remainder of the name stays too.
    - For a message with only images, the agent receives the byline and not the
      placeholder sentence.
    - In the web client, a message with only files shows each file as a link above the
      byline, and not as a card. The web client shows a card only for a message with no
      words.
    - If an upstream release changes the placeholder, the match fails until the proxy
      changes too. People then see the placeholder with a byline, and the message is
      not lost.
    - An upgrade to a protocol other than WebSocket closes. Stock T3 Code has none.
    - A new upstream command that carries text passes with no byline and no warning.
      Each upstream release is evaluated before adoption.
  devcontainer-feature: |
    `features/src/t3code-proxy` is a devcontainer Feature published as
    `ghcr.io/wyrd-company/t3code-client/t3code-proxy`. It follows the conventions of
    the wyrd-company/devcontainers repository. It needs that repository's base image
    with s6-overlay, and the installer checks this before it changes anything.

    | Option        | Default                         | Purpose                    |
    | ------------- | ------------------------------- | -------------------------- |
    | `version`     | `latest`                        | npm version of the package |
    | `configPath`  | `/etc/t3code-proxy/config.yml`  | File passed to `--config`  |
    | `serviceUser` | `automatic`                     | User that runs the service |

    `version` is `latest` or an exact semver version. A leading `v` is removed, and the
    installer verifies the installed version. `automatic` selects the remote user,
    container user, `vscode`, then `root`.

    The Feature depends on the Node Feature and installs the npm package. A
    `t3code-proxy` longrun under s6-overlay runs
    `/usr/local/bin/t3code-proxy-service`, which passes `--config` with `configPath`.
    The service runs as `serviceUser` with its full environment. The Feature does not
    write the config file, and it declares no mount. A missing or invalid file fails the
    service loudly.

    The Feature README shows how to supply the file with a bind mount:

    ```json
    "mounts": [
      "source=${localWorkspaceFolder}/.devcontainer/t3code-proxy.yml,target=/etc/t3code-proxy/config.yml,type=bind,readonly"
    ]
    ```

    It explains what each part does, and that `target` must match `configPath`.
  devcontainer-caddy: |
    The Feature owns the Caddy files for each person. The service writes them when it
    starts, because the config file can arrive after the Feature installs. It writes
    them only when the t3code-server service definition exists and
    `/etc/caddy/required-hosts.d/t3code-server.host` names the server's `dnsName`. In
    all other cases it writes no Caddy file, and the listeners stay on `host`.

    The installer adds `serviceUser` to the `caddy-config` group when the group exists,
    so that the service needs no root step. `t3c-proxy --list-users` validates the
    config and prints one line for each person: the port, a tab and the name. The
    launcher then parses no YAML, and a name can hold spaces.

    Each person's hostname comes from the server's hostname. The first label receives
    a suffix with the person's name in lowercase. With the server at
    `t3.dev.example.test`, `Alice` on port 4101 is `t3-alice.dev.example.test`. A name
    that does not make a valid DNS label, or two names that make the same label, fails
    the service loudly.

    The launcher writes one site block per person to
    `/etc/caddy/conf.d/t3code-proxy.caddy`, with `reverse_proxy 127.0.0.1:<port>`, and each
    hostname to `/etc/caddy/required-hosts.d/t3code-proxy.host`. It replaces both files at
    each start, so that a removed person loses their site. The Caddy Feature's watcher
    applies the change, and Caddy supplies HTTPS.

    Every derived hostname must resolve. The Caddy Feature waits for all required hosts
    before it starts or reloads, so one unresolved name holds back all sites. A
    wildcard DNS record for the server's parent domain supplies the names.

    The server's own hostname stays as the direct route.
  devcontainer-ordering: |
    The Feature declares `installsAfter` the Ansible, Caddy and t3code-server
    Features. When `ansible-setup` exists, the `t3code-proxy` service has an s6-rc
    dependency on it, and if that oneshot fails, the service does not start. When the
    t3code-server service exists, `t3code-proxy` also depends on it. A restart reads
    the config file and writes the Caddy files again.
  source-and-distribution: |
    The package has its own release unit `t3code-proxy`, initial minor intent, package
    verification and CI check. It starts at version 0.0.0.

    The Feature is a separate release unit, `t3code-proxy-feature`, with its version in
    its `devcontainer-feature.json`, its own record `t3code-proxy-feature@X.Y.Z`, intent
    and changelog. A package release needs no Feature release, because the `version`
    option installs `latest` by default. The Feature has its own logo, a README with an
    Options table, and a NOTES with the short operational note.

    Intentional owns all version and changelog changes. Publication of each unit
    requires the user's release approval.
  verification: |
    Unit tests cover each row of the rewrite table, each byline rule, batched frames,
    byte-identical frames, and queue edits with text after the byline, a quoted byline,
    names that share a prefix and the placeholder. They cover the placeholder in its
    `Ultrathink:` form.

    An isolated stock server with real turns proves these through an HTTPS reverse
    proxy with one hostname per person:
    - The first message, a follow-up, steer, queue and queue edit each store the
      correct byline, and the agent receives it.
    - The web client completes pairing and shows each person's byline.
    - `/compact` through a person's endpoint compacts the thread.
    - The direct route, an agent's `t3_thread_send`, and an outside agent's `/mcp` on a
      person's endpoint store no byline. The agent messages have `createdBy: agent`.
    - A message with only attachments, on a first message and a follow-up: the
      placeholder does not show, the attachment shows with the byline, and the agent
      replies about the attachment.
    - The mobile and desktop clients pair and send through a person's endpoint.
    - A large streamed turn with a slow client keeps all frames in order.

    `/logout` is covered by the unit tests for the slash rule. The live proof does not
    run it, so that the shared provider login stays valid.

    Feature scenarios on the base image prove: the options and validation; a service
    that runs as `serviceUser` and passes `configPath`; and the s6-rc dependencies with
    and without Ansible. Scenarios also prove that the generated Caddy files pass
    `caddy validate`, and that no Caddy file appears without the t3code-server hostname.
    A runtime scenario bind-mounts the config file, Caddy applies the derived hostnames,
    and a message through the proxy stores the byline.

    Unit tests also cover the config file, flag overrides, and invalid values.

    A consumer installs the local tarball and runs the executable, which forwards a request
    and stops on SIGTERM. The pinned `t3`
    update reruns the live proof, and its review checks for new commands that carry
    text and for a change to `ATTACHMENT_ONLY_BOOTSTRAP_PROMPT`.
  documentation: |
    The wyrd.foo product is t3c-proxy, with code release unit t3code-proxy and
    tag-only docs unit t3c-proxy-docs. Its pages live in docs/user/t3c-proxy: setup,
    a reverse proxy example, and the accepted limits. The catalog entry has its own
    navigation and SVG mark. The t3c and t3mcp guides state that they use the direct
    route.
