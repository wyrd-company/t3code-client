          threadFind.ts         find within one thread
          threadForceStop.ts    force stop input and result
          threadLink.ts         link origin, delegating thread and remote task child
          shell.ts              project and thread shells, shell snapshot and stream items
          shellOmittedRows.ts   thread rows a shell can leave out
