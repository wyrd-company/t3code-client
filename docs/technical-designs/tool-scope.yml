    | Stock agent message `send_to_user` and `tool_search`/direct exposure/strict arguments | Pass: no stock CLI for in-thread agent messaging or MCP tool discovery. | Fail: these are agent session behaviors, not unattended CLI outcomes. | Fail: `send_to_user` and `tool_search` are built in, as are exposure and argument rules. | Pass: agents need to show a draft or find an available tool, using stock. |
    | Stock thread list/read pagination and metadata (`starting`, `pullRequestCount`, `openPullRequestCount`, `watching`, `pinned`, `blockedOnThreadWait`, `pendingBackgroundTasks`, `delegatedFrom`, `earlierPosition`); stock preview load/snapshot/resize changes (`loadError`, `viewport`, `pixelsRequired`, `pendingStages`, `unclaimedTab`, removed `returnByValue`) | Pass: no stock CLI for all MCP pagination and preview details. | Fail: neither a mirror of an MCP page view nor a browser takeover is needed by CLI jobs. | Fail: stock thread reads/list and preview tools already deliver these outcomes. | Pass: agents use pagination and useful preview errors in stock tools. |

    Not candidates: the server-only command fields and PR watch commands, local
    desktop IPC/bootstrap and client-local settings, the internal ACP probe
    record and pure helpers listed in #172. The version/migration number and
    unchanged protocol 2 are compatibility facts. OAuth registration limits and
    errors, Origin refusal, HTTPS cookie policy and the removed serve bootstrap
    flag are stock server behavior, not operations an additive tool can expose.

