$schema: https://refinery.systems/ontology/technical-design
title: Tool scope for t3c and t3code-mcp
objective: >-
  Decide which T3 Code capabilities t3c and t3code-mcp expose, so that each
  tool adds what stock T3 Code lacks and what our own work uses.
relationships:
  related-to:
    - cli-architecture
    - mcp
  references:
    - command-line
    - library
    - automation-capabilities
    - releasing
proposed-design:
  gates: |
    A capability enters a tool only when it passes both gates for that tool.
    Each tool is judged separately, so a capability can pass for one tool and
    fail for the other.

    | Tool | Gate 1: absent from stock | Gate 2: valuable to our work |
    | --- | --- | --- |
    | t3c | The stock `t3` command line cannot do it. | It helps automate our workflow, for example Dagu steps. |
    | t3code-mcp | T3 Code's built-in MCP tools cannot do it. | Our agents need it to do their work. |

    Gate 1 compares behavior, not names. A stock command or tool that reaches
    the same outcome fails gate 1, even with different inputs. Gate 2 is a
    judgment and always carries a written reason.
  principles: |
    1. Two gates per tool, as above.
    2. Complement stock. A tool never duplicates a stock command or tool. When
       stock gains an equivalent, the update that adopts that stock build
       proposes removing the tool. Removal is a maintainer decision.
    3. Library first. Every capability exists in @wyrd-company/t3code-lib before
       a tool exposes it. Tools adapt inputs and outputs and hold no protocol or
       domain logic.
    4. The audience selects the tool. t3c serves people and unattended scripts:
       it waits for outcomes, prints JSON and returns exit codes. t3code-mcp
       serves agents in T3 Code: it lets them inspect and recover the threads
       they manage and check provider budget before they delegate.
    5. Value means recurring work. A one-time action or a display preference
       fails gate 2.
    6. The server stays the authority. The selected credential and its scopes
       decide every operation. No tool raises permissions, and no agent tool
       answers an approval.
    7. Read first, write narrowly. A gap starts as a read. A write changes only
       what stock cannot change, and stock keeps the rest of that object.
    8. Re-run the gates at every upstream update and keep each verdict.
  verdicts: |
    A verdict names the capability, the tool, the result of each gate and the
    reason. A pass becomes work: a GitHub issue labelled `cli` or `mcp`, or a
    change in the same update. A fail is kept in the update's record with its
    reason so that later updates do not judge it again without new facts. Each
    open `cli` or `mcp` issue states its current verdict against the target
    build.
  upstream-updates: |
    Tracking a new T3 Code build (see releasing) covers the tools as well as
    the library:

    1. For each capability the build adds or changes, run both gates for both
       tools and record the verdicts.
    2. Run both gates again for every open `cli` and `mcp` issue and for every
       existing tool, against the new stock command and tool set and our current
       work, and record each verdict. Close issues that fail, and propose
       removing tools that fail.
    3. Build the passing tool changes before the update merges to main, with the
       same tests, review and documentation as library changes.
    4. The update's pull request lists the tool changes made and each fail with
       its reason.
  verdicts-0-1-10: |
    Basis: the v0.1.9..v0.1.10 inventory in wyrd-company/t3code-client#172,
    checked against the v0.1.10 CLI command tree in apps/server/src/cli and the
    built-in MCP toolkits in apps/server/src/mcp/toolkits (tag 7d32075). Gate 1
    considers stock t3 or built-in MCP, not the stock GUI or another vendor's CLI.
    Rows group fields only where they serve the same outcome. “Existing” means
    the named tool already exposes the behavior through the library; there is
    no second command or tool. Passes that need new behavior link an issue.

    | Capability or change | t3c gate 1 | t3c gate 2 | MCP gate 1 | MCP gate 2 |
    | --- | --- | --- | --- | --- |
    | Read effective settings (`server.getSettings`) | Pass: no equivalent whole-settings command. | Fail: CLI preflight already reads effective settings from the library; scripts need targeted outcomes, not a general config dump. | Pass: environment read is not the complete settings record. | Fail: agents need scoped diagnostics, not the server's whole settings record. |
    | Check a secret source (`server.checkSecretSource`, `secretSourceCheck`, Resolved/Failed detail) | Pass: stock auth and doctor do not resolve a particular server secret source. | Fail: checking a configured source is part of operator setup/repair, not a recurring t3c step in our workflow. | Pass: `request_secret` asks for input, not a check of a configured reference. | Fail: checking a reference uses settings:write and can interact with secret delivery; agents do not own this setup. |
    | Connect device list, approve and revoke (`connectDeviceRequest`, `connectDevices`, verification code, client, device key and approval result) | Fail: `t3 auth connect-device list/approve/revoke` already does these. | Fail: pairing/revoking a particular device is an operator trust decision, not unattended work. | Pass: environment link/unlink are not connect-device administration. | Fail: approval and device access stay with the operator; an agent has no recurring need for the inventory. |
    | Require Connect device approval (`requireConnectDeviceApproval`, access:write) | Pass: stock connect-device commands decide individual requests, not that policy. | Fail: enrollment policy is an operator setting, not a scripted per-run action. | Pass: environment preferences MCP does not set this access policy. | Fail: agents must not change an approval requirement. |
    | Report pending device approval (`connect_approval_pending`, including token exchange and approve/revoke failure reasons) | Pass: no separate stock remote profile failure query. | Fail: it is a credential failure to propagate, not a separate command or way to bypass approval. | Pass: stock environment-link cards are not this HTTP failure. | Fail: an agent must stop at pending approval; no action is added. |
    | Keep host awake and choose offered source-control providers (`keepAwakeWhileAgentsWork`, `offeredSourceControlProviders`) | Pass: stock service verbs do not set these preferences. | Fail: host and forge policy are operator setup, not recurring automation. | Pass: environment preferences MCP does not expose these server settings. | Fail: neither is needed for an agent's thread work. |
    | Theme CSS/background, theme asset and default appearance (`css`, `background`, `environment-theme-background`, `themeId`, `defaultAppearance`, `defaultAppearanceSetAt`) | Pass: stock `t3 theme set/show` cover theme selection and inspection, but not all payload and appearance operations. | Fail: these are display preferences, not automation. | Fail: `t3_theme_read` and `t3_theme_set` inspect/publish themes and switch appearance. | Fail: display preferences are not recurring agent work. |
    | Stage a server update without restarting (`stageOnly`, `serverUpdateStaging`; `t3-launcher` installation with launcher/baseDir) | Pass: stock `t3 update` and `t3 service update` do not offer stage-only preparation on a selected remote server. | Pass: rollout jobs can move preparation out of a maintenance window (#173). | Pass: stock environment tools cannot stage an update. | Fail: agent work does not require preparing releases or selecting host installers. |
    | Selective provider refresh (`omitProviders`, `machineCatalog`), workspace catalogs (`models`, `modelsPending`, `workspaceRescannedAt`, `catalogDigest`), config subscription (`providerCatalogDigests`, `providerStatusDeltas`) | Pass: no stock command to negotiate refresh or subscription payloads. | Fail: these are efficient transport/cache choices; automation can already resolve and inspect providers. | Pass: `orchestrator_capabilities` finds models, but does not expose refresh and delta controls. | Fail: these knobs do not improve the agent's provider-selection outcome. |
    | Provider `supportsTextGeneration` and model selection with null `options` | Fail: stock thread commands already select supported models and apply defaults. | Fail: validated model selection belongs in the existing library preflight, not a new command. | Fail: `orchestrator_capabilities` and stock thread tools discover and select models. | Fail: null handling and model filtering belong in the library/server. |
    | Provider auth endpoint and limit attribution (`auth.endpoint`, `modelIds`, `providerIds`, `zeroSpendCap`) | Pass: stock doctor is not a provider-instance limit/status query. | Pass: budget jobs need to identify the affected endpoint and quota; existing `provider status --json` preserves the fields. | Pass: the stock catalog is not the instance's detailed limit/status report. | Pass: agents check the right budget before delegating; existing `provider_status` preserves the fields. |
    | Separate usage-limit source snapshots (`origin`, `endpoint`) | Pass: stock has no CLI listing configured hub source snapshots. | Fail: the current budget jobs read provider-instance quotas; they do not reconcile accounts across configured hubs. | Pass: stock capability discovery is not a configured hub account list. | Fail: provider-instance limits suffice to pick a delegation target; agents do not administer the hubs. |
    | Usage accounting (`unpricedTokens`, `physicalSourceId`) | Pass: stock has no historical usage summary command. | Pass: cost jobs must identify missing prices and avoid counting the same physical source twice; existing `usage summary --json` preserves both. | Pass: stock has no diagnostic usage-bucket tool. | Pass: agents interpreting usage need the same distinctions; existing `usage_summary` preserves both. |
    | Provisional historical usage (`provisional`) | Pass: stock has no provisional query. | Pass: recurring budget polls should not force scans; #174 covers the CLI opt-in. | Pass: stock has no provisional usage tool. | Pass: agents can check cached usage cheaply; existing `usage_summary` accepts the library input. |
    | Server `hostname` and `serverTime` | Pass: no stock command returns both fields from a selected server's config. | Fail: our scripts need environment identity and run timestamps, not a clock/hostname probe. | Pass: `t3_environment_read` is not a server-clock sample. | Fail: agents use server-reported run timestamps and do not calculate clock skew. |
    | Resume shell snapshot/stream (`resumeFrom`, `resumable`, `knownProjectIdentities`, `projectIdentities`, marked `resolvedRepositoryIdentityRoots`) and shell capability flags (`shellThreadFamilies`, `shellOlderSettled`) | Pass: no stock command exposes shell cursors or coverage flags. | Fail: resume and capability negotiation stay inside the library; new flags do not add a tool-level outcome. | Pass: stock thread list is not a shell stream. | Fail: agents need the resulting records, not resume cursors; `thread_family` and `worktree_threads` already use the library. |
    | Custom project title (`hasCustomTitle`) and `followsThreadSelection` | Pass: stock project/thread commands do not expose these client presentation states. | Fail: scripts select stable project/thread IDs; app titles and selection are not automation policy. | Pass: stock project/thread queries do not expose those states as controls. | Fail: agent project and thread selection is explicit, not the app's selection. |
    | Mark visits (`thread.visit-recorded`, lastVisitedAt, opens) and restore unsettle timestamp (`restoreUnsettledAt`) | Pass: stock thread commands do not manage visit or restore timestamps. | Fail: they track human navigation and UI undo, not job completion. | Pass: stock thread organization settles/unsettles but does not expose both timestamp controls. | Fail: agents need explicit thread state, not synthetic visits or backdated changes. |
    | Linked sender, deferred steer follow-ups and continuation (`linkedSender`, `steerFollowUpOfRunId`, `steerFollowUpAfterRunOrdinal`, `steerWhenReadyRunId`, `manualContinuationOfRunId`, `continuation`, `activeSteeringDuringCompaction`) | Pass: stock send does not expose orchestration provenance and scheduling controls as a group. | Fail: t3c waits/selects runs; scripts should not synthesize linked senders or compaction/continuation state. | Fail: stock linked-environment sends, steer and thread launch already manage these outcomes. | Fail: agents specify the desired send/steer, not server-managed causality. |
    | Title regeneration `outcome` and `lastTitleRegeneration` | Pass: no stock command for recording or querying regeneration outcomes. | Fail: background naming is presentation, not run success. | Pass: `t3_thread_update` can request regeneration, not set its outcome. | Fail: the server owns the outcome, and agents have no recurring use for a separate title diagnostic. |
    | Subagent `executedModel` and `cancelledRunId`, background task `nativeItemId`, provider thread `cursorStoreCwd` | Pass: stock CLI does not expose these delegation and cursor diagnostics. | Fail: they do not add a recurring CLI outcome beyond reading run status. | Pass: stock task/thread tools expose task state, not every internal identifier. | Fail: the agent uses T3 task/run state, not provider-native bookkeeping to supervise work. |
    | Assistant `phase`, command `completionWake: always`, notice `level`, composer `response` context (`citation`, `itemId`, `subagents`, `AssistantCitation`) | Pass: stock thread show is not a control surface for those turn metadata items. | Fail: existing run outcome/transcript is what scripts consume; clients should not manage rendering and wake metadata. | Pass: stock thread reads do not let the caller set those metadata fields. | Fail: agents read the final run/result via stock, and the server owns wake, citation and notice metadata. |
    | `userOnly` on pending summaries; cancel a completed delegate's queued question wakes | Pass: no stock CLI for these orchestration lifecycle details. | Fail: no new user-facing answer operation; secret/link cards remain user-only and cancellation is automatic. | Pass: stock pending-request tools handle real questions, not acting on user-only cards or manually cancelling these wakes. | Fail: agents neither answer user-only cards nor override automatic cleanup. |
    | PR linked-thread refresh revisions (`pullRequests.subscribeLinkedThreadRefreshes`, `linkedThreadRefreshes`) | Pass: no stock PR refresh stream on the CLI. | Fail: UI refresh notifications are invalidation signals, not CI or review results. | Pass: stock PR watch reports checks/reviews, not UI refresh revisions. | Fail: PR watchers need outcomes, not client invalidation revisions. |
    | PR fast-forward merge method/capability | Pass: no stock t3 PR merge command. | Fail: our forge and operator merge workflow owns branch mutations; no second merge path. | Pass: stock PR MCP links and watches but does not merge. | Fail: an agent must use the authorized forge workflow, not a new merge action. |
    | PR overview discussions and withheld files (`overviewThreads`, nullable path/line, `withheldFileDiff`, `withheldFilesReadable`, viewed-file `revision`) | Pass: stock CLI does not read these T3 PR review details. | Fail: review automation works from the forge and checkout, not a second review UI. | Pass: stock PR guides/lists do not expose each raw review field or withheld-file operation. | Fail: reviewers use the forge and checkout; agents do not need a separate reviewed-file state tool. |
    | PR rebase/merge-queue and baseline state (`rebaseRequired`, `mergeQueueRemoval`, `mergeQueueRemovalId`, `awaitingBaseline`, `checksPending`), PR watch wakes (`pullRequest`, `otherPullRequests`, `watchStartedAt`, `headSha`, `watchEnded`, `section`) | Pass: no stock CLI for T3 PR watch state. | Fail: automation consumes the forge's PR and checks, not T3 watch internals. | Fail: stock `watch_pull_request` and its wakes deliver the workflow outcomes; raw state is not the same as a missing workflow. | Fail: agents use the stock wake and verify the forge head/checks, not a duplicate watcher. |
    | PR mapping and list errors (host `projectIds` including null; `repository-without-project`, `repository`, `host`, `listResult`) | Pass: stock CLI does not return T3 PR-to-project mapping errors. | Fail: library decoding and current error handling are sufficient; scripts use repository identity from the forge. | Pass: stock thread PR lists are not the project mapping endpoint. | Fail: agents can name repository/host in existing link tools, without a new mapping query. |
    | Terminal bounded attach/history and binary/reply/error fields (`maxHistoryBytes`, `binary`, `reply`, `error`), binary provider terminal answer | Pass: no stock CLI equivalent for changing a T3 terminal attachment's byte protocol. | Fail: t3c consumes runs, not interactive shell transport. | Pass: stock MCP browser key presses do not drive T3 terminals. | Fail: MCP terminal tools intentionally read only; writing or attaching would take control of a person's shell. |
    | Exact project/checkpoint paths (`relativePath`, `resolvedPath`, `operationPath`) and diff `changeType` | Pass: stock project/thread commands do not provide exact-path file RPCs or checkpoint diff classifications. | Fail: preserving valid paths is a library fix; tool consumers already use checkouts and checkpoint diffs. | Pass: project tools are not file or checkpoint path control. | Fail: the existing diff tool and normal file access suffice; preserve paths in the library without a parallel file tool. |
    | Search ignored files (`ignoredFileSearch`, `listIgnoredFiles.query`) | Pass: stock t3 CLI does not query ignored files. | Fail: Git and filesystem commands already meet this need in scripts. | Pass: stock thread search does not search workspace files. | Fail: agents can inspect ignored files with their existing workspace tools. |
    | Launch editor at `position`/`projectRoot`; preview `colorScheme`/`zoomFactor`, `preview.find`, literal space key | Pass: stock `t3 app` is not editor-at-line or preview configuration. | Fail: these are interactive navigation and display controls. | Pass: stock preview act/appearance cover input and appearance, but not every editor launch, zoom and find option. | Fail: agents use stock browser tools for page work and workspace file references for source. |
    | Sign-in URL must be HTTP(S); media `hostOnly`; ACP `nativeHistoryPending` | Pass: there is no stock command for these wire validation/availability flags. | Fail: URL validation and availability restrictions apply transparently; they are not controls for a job. | Pass: stock secret and thread tools are not raw URL/media/native-history interfaces. | Fail: agents should not bypass host-only access or navigate invalid sign-in URLs; pending history is provider state. |
    | Schedule list `timeZone` | Pass: stock t3 has no schedule list command. | Fail: the server's fixed-time zone is configuration context; our recurring consumers use the already resolved `nextRunAt` instant. | Pass: stock `list_scheduled_tasks` gives the schedule and resolved `nextRunAt`, not the containing server zone. | Fail: the resolved instant answers when a task will next run; agents do not configure the server zone. |
    | VCS `isRepo`, `VcsCheckpointStorageError`, `ref_name_conflict`, `package_manager_missing`; early invalid worktree base refusal | Fail: stock thread start's worktree uses the same server checks; checkout Git also identifies a repository. | Fail: continue surfacing actual failures through existing commands; new commands cannot fix invalid bases or missing dependencies. | Fail: stock worktree/thread launch tools already reach these server checks. | Fail: use existing diagnostics and launch errors, not duplicate RPC error tools. |
    | ACP probe session cleanup, provider invalidation/reprobe and restart behavior | Fail: stock provider discovery and server restart already own these transitions. | Fail: probe cleanup is automatic; do not automate restarts to hide an upstream probe regression. | Fail: stock `orchestrator_capabilities` uses provider discovery. | Fail: agents should report unavailable providers, not restart the server. |
    | Stock agent message `send_to_user` and `tool_search`/direct exposure/strict arguments | Pass: no stock CLI for in-thread agent messaging or MCP tool discovery. | Fail: these are agent session behaviors, not unattended CLI outcomes. | Fail: `send_to_user` and `tool_search` are built in, as are exposure and argument rules. | Pass: agents need to show a draft or find an available tool, using stock. |
    | Stock thread list/read pagination and metadata (`starting`, `pullRequestCount`, `openPullRequestCount`, `watching`, `pinned`, `blockedOnThreadWait`, `pendingBackgroundTasks`, `delegatedFrom`, `earlierPosition`); stock preview load/snapshot/resize changes (`loadError`, `viewport`, `pixelsRequired`, `pendingStages`, `unclaimedTab`, removed `returnByValue`) | Pass: no stock CLI for all MCP pagination and preview details. | Fail: neither a mirror of an MCP page view nor a browser takeover is needed by CLI jobs. | Fail: stock thread reads/list and preview tools already deliver these outcomes. | Pass: agents use pagination and useful preview errors in stock tools. |

    Not candidates: the server-only command fields and PR watch commands, local
    desktop IPC/bootstrap and client-local settings, the internal ACP probe
    record and pure helpers listed in #172. The version/migration number and
    unchanged protocol 2 are compatibility facts. OAuth registration limits and
    errors, Origin refusal, HTTPS cookie policy and the removed serve bootstrap
    flag are stock server behavior, not operations an additive tool can expose.

    Existing inventory: no open cli or mcp issue predated this review. Rechecked
    the existing CLI workflow outcomes against the 0.1.10 command tree. In
    particular, stock thread list/start/send/show are not the t3c remote-profile
    JSON, correlation and wait workflows; stock auth device administration does
    not overlap t3c credential/profile storage. These remain useful to scripts.
    The other existing CLI outcomes have no newly equivalent stock command;
    schedule, requests, queue recovery, usage and diagnostics keep their
    scripting use. The MCP name inventory contains all 75 stock tool names;
    stock list/read/search, organize, interrupt, schedule, queue and PR tools
    still do not substitute for the complementary scheduler webhooks/config,
    thread status/family/tags/recovery/usage/diff/within-thread search, terminal
    reads, process/resources/trace diagnostics, local-server tools or provider
    budget/usage tools. Those support recurring agent inspection and recovery.
    No removal is proposed in this update.
  verification: |
    The t3code-mcp inventory tests reject names that collide with the pinned
    stock tool set. Behavioral overlap is checked by the gate 1 review in each
    upstream update.
