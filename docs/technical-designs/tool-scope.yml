    Internal command fields (`thread.create.workflowRun/initialMessage`, internal
    output and feedback submission), peer transport HTTP endpoints, desktop IPC
    and bootstrap proofs, client-local settings, persistence and schema helpers,
    the relay's own webhook, protocol heartbeat, migration number and body limit
    are implementation details. There is no separate public operation at
    either gate 1 surface. Gate 2 fails for both tools because operators and
    agents consume their public effects through the server, not these
    internal inputs.

    **Existing commands and tools.** Compared the 0.1.12 stock tree with
    all 41 registered t3c leaves and all 30 complementary MCP tools. The
    per-tool verdicts in `existing-tools-0-1-10` still apply, with these checks
    against stock additions and corrections:

    | Existing surface | Gate 1 at 0.1.12 | Gate 2 at 0.1.12 |
    | --- | --- | --- |
    | t3c `run`, `thread start/send/wait` | Pass. Stock start/send gained typed results, generated titles and local waiting. They do not select a paired target and expose t3c's job outcome contract. There is still no stock CLI wait on an already selected run. | Pass. The launch, continuation and wait paths give Dagu recovery and result boundaries. |
    | t3c `thread read/list/status` | Pass. Stock list includes delegated threads, and show adds failure and PR detail. The paired server-wide list, full transcript and combined queue/run/request/background status are still distinct. | Pass. Jobs collect transcripts, find work across projects and decide when to recover. |
    | t3c `project ensure/list` | Pass. Stock `project add --track` handles local registration. It does not resolve-or-create by path on a paired server or list that server's projects. | Pass. Repeated job steps discover and reuse target projects. |
    | t3c `requests watch` and `--exec` | Pass. Neither stock `thread show` nor `workflow questions` follows pending runtime requests across every project or runs a hook on each. | Pass. The shared watcher forwards every pending runtime request to the operator's workflow. Feedback and durable-workflow questions have separate server representations. |
    | MCP `thread_stop` | **Fail.** Stock `t3_thread_interrupt` already accepts `stop: true` and sends native `thread.stop`, including on an idle thread. This option is also present in v0.1.11. The older verdict compared plain interrupt only. Propose removal. | Pass. Agents need native recovery and can use the stock action. |
    | MCP `thread_force_stop`, `thread_queue_resume`, `thread_queue_start` | Pass. Native stock Stop does not kill or release the provider process and report who shares it. Stock `t3_queue` has no hold release or selected held start. | Pass. Each is a distinct recovery operation. |
    | MCP `thread_status`, `thread_approvals`, `thread_family` | Pass. Stock `t3_thread_read/list` expose more state but do not return the combined queue and hold, full approval prompts or a root/fork/subagent family. `t3_pending_request` serves user questions. | Pass. Agents inspect blockers and related threads before recovery. |

    The other existing CLI leaves (auth, schedules, provider and usage, version,
    server info, and thread find, requests, usage, diff, search, interrupt,
    respond, stop, tagging and queue recovery) retain both passing verdicts.
    The other existing MCP tools (schedule webhooks and execution configuration,
    thread usage/diff/content search/tagging, worktree use, terminals, diagnostics,
    local servers, provider status and usage) also retain both passing verdicts.
    In particular, the new stock workflow hook and run tools operate on durable
    workflows, alongside the complementary scheduled-task operations.

    **Open proposals carried forward.**

    | Proposal | t3c gate 1 | t3c gate 2 | MCP gate 1 | MCP gate 2 |
    | --- | --- | --- | --- | --- |
    | [Stage a remote server update](https://github.com/wyrd-company/t3code-client/issues/173) | Pass. Stock `t3 update` updates the local install; `t3 service update` reconciles the local service. Neither stages an exact remote release without restart. | Pass. Deployment jobs can prepare before downtime while checking staging support and maintain scope. | Pass. Stock has no equivalent stage action. | Fail. Release preparation belongs to operator deployment jobs. |
    | [Read provisional historical usage](https://github.com/wyrd-company/t3code-client/issues/174) | Pass. Stock has no historical transcript usage query. | Pass. A frequent budget poll can use the last scan without a fresh scan each time. | Pass. Stock MCP has no equivalent historical query. | Pass. Agents can check a budget before dispatch through the existing `usage_summary` option. |

