$schema: https://refinery.systems/ontology/technical-design
title: Tool scope for t3c and t3code-mcp
objective: >-
  Decide which T3 Code capabilities t3c and t3code-mcp expose, so that each
  tool adds what stock T3 Code lacks and what our own work uses.
relationships:
  related-to:
    - cli-architecture
    - mcp
  references:
    - command-line
    - library
    - automation-capabilities
    - releasing
    - request-watch
proposed-design:
  gates: |
    A capability enters a tool only when it passes both gates for that tool.
    Each tool is judged separately, so a capability can pass for one tool and
    fail for the other.

    | Tool | Gate 1: absent from stock | Gate 2: valuable to our work |
    | --- | --- | --- |
    | t3c | The stock `t3` command line cannot do it. | It helps automate our workflow, for example Dagu steps. |
    | t3code-mcp | T3 Code's built-in MCP tools cannot do it. | Our agents need it to do their work. |

    Gate 1 compares behavior, not names. A stock command or tool that reaches
    the same outcome fails gate 1, even with different inputs. Gate 2 is a
    judgment and always carries a written reason.
  principles: |
    1. Two gates per tool, as above.
    2. Complement stock. A tool never duplicates a stock command or tool. When
       stock gains an equivalent, the update that adopts that stock build
       proposes removing the tool. Removal is a maintainer decision.
    3. Library first. Every capability exists in @wyrd-company/t3code-lib before
       a tool exposes it. Tools adapt inputs and outputs and hold no protocol or
       domain logic.
    4. The audience selects the tool. t3c serves people and unattended scripts:
       it waits for outcomes, prints JSON and returns exit codes. t3code-mcp
       serves agents in T3 Code: it lets them inspect and recover the threads
       they manage and check provider budget before they delegate.
    5. Value means recurring work. A one-time action or a display preference
       fails gate 2.
    6. The server stays the authority. The selected credential and its scopes
       decide every operation. No tool raises permissions, and no agent tool
       answers an approval.
    7. Read first, write narrowly. A gap starts as a read. A write changes only
       what stock cannot change, and stock keeps the rest of that object.
    8. Re-run the gates at every upstream update and keep each verdict.
  verdicts: |
    A verdict names the capability, the tool, the result of each gate and the
    reason. A pass becomes work: a GitHub issue labelled `cli` or `mcp`, or a
    change in the same update. A fail is kept in the update's record with its
    reason so that later updates do not judge it again without new facts. Each
    open `cli` or `mcp` issue states its current verdict against the target
    build.
  upstream-updates: |
    Tracking a new T3 Code build (see releasing) covers the tools as well as
    the library:

    1. For each capability the build adds or changes, run both gates for both
       tools and record the verdicts.
    2. Run both gates again for every open `cli` and `mcp` issue and for every
       existing tool, against the new stock command and tool set and our current
       work, and record each verdict. Close issues that fail, and propose
       removing tools that fail.
    3. Build the passing tool changes before the update merges to main, with the
       same tests, review and documentation as library changes.
    4. The update's pull request lists the tool changes made and each fail with
       its reason.
  verdicts-0-1-13: |
    Basis: stock T3 Code v0.1.12 (ca81b7b97a1c4b91e5ac25768d0f6629f37732fd)
    through v0.1.13 (bc0f04da94f64b5e487c598761a43b4cf06b2ac9).
    Compared [the stock CLI registration](https://github.com/pingdotgg/t3code/blob/v0.1.13/apps/server/src/binCli.ts),
    [command tree](https://github.com/pingdotgg/t3code/tree/v0.1.13/apps/server/src/cli)
    and all 95 [stock MCP toolkit registrations](https://github.com/pingdotgg/t3code/tree/v0.1.13/apps/server/src/mcp/toolkits),
    checking handlers where outcomes could overlap.
    All 95 names match v0.1.12 and the pinned fixture. The library
    [upstream inventory and tool follow-up](https://github.com/wyrd-company/t3code-client/pull/210#upstream-inventory)
    identifies the changed client behavior.

    **Upstream additions and changes**

    | Capability | t3c gate 1 | t3c gate 2 | MCP gate 1 | MCP gate 2 |
    | --- | --- | --- | --- | --- |
    | Preflight provider runtime mode limits by instance and working directory (`server.getProviderRuntimeModeLimits`, `orchestration:read`) | Pass. Stock `thread start` and `doctor` have no paired workspace policy query. | Pass. Jobs can check a required mode before dispatching. [Follow-up](https://github.com/wyrd-company/t3code-client/issues/211). | Pass. `orchestrator_capabilities` discovers options. Stock configure, launch and delegation enforce policy when attempting an action, without exposing this query for a selected directory. | Pass. Agents can select a compatible delegation mode before launching work. [Follow-up](https://github.com/wyrd-company/t3code-client/issues/211). |
    | Select an agent-native mode, inherit an existing selection and enforce execution limits | Fail for model option selection itself. Stock `thread start --option` can make local selections. The existing paired dispatch path passes. | Pass in existing model selection. Jobs pass explicit selections and rely on server policy. No separate mode setter. | Fail. Stock `t3_thread_configure`, `t3_thread_launch` and delegation enforce the caller's policy for a new native mode selection and handle inheritance. | Pass in stock. Agents can configure and delegate within their allowed modes. |
    | Workflow subject lookup, run subject and references, open questions, and queue steps with position (`workflows.about`, `orchestration:read`, `subject`, `ahead`) | Pass for paired reads and the combined run-and-question result. Stock `workflow list --subject` filters local runs and stock `workflow show/questions` read local snapshots. | Fail for a separate subject or queue inspector. The recurring Dagu handoff starts with an exact run ID from the webhook receipt. | Fail for listing subject-matched runs from an outside client via stock `t3_workflow`. Pass for the combined lookup with questions and for in-thread access because the stock tool is hidden in threads. | Fail. Agent recovery follows managed threads and schedules. There is no recurring workflow subject or queue inspection step. |
    | Bypass a reused issue-detail read (`issues.detail.refresh`) | Pass. Stock has no issue-detail command. | Fail. Current issue operations use the forge or stock MCP. There is no CLI issue polling job. | Pass for an explicit fresh read. Stock `read_issue` resolves the target and reads detail without a refresh input. | Fail for a second issue read. Agents use the stock issue workflow, and there is no recurring MCP job requiring a cache override. |
    | Explicitly queued dispatch and `explicitQueue` in run records | Pass for reporting the marker. Stock thread reads do not identify this cause of queueing. | Pass in `thread status --json`, which carries the full run records. Jobs can explain why an earlier item remains queued while another steers the active run. No new dispatch option. | Pass for reporting the marker. Stock `t3_queue list/read` returns queued IDs and message text. | Pass in `thread_status`, which carries the full run records. Agents can inspect the queue before recovery. |
    | Resumed delegation after Stop, restart-cancelled background work, and server fixes for settlement, snoozing, linked tasks, checkout records and prompt recovery | Pass for structured paired run and background status beyond local thread snapshots. | Pass in existing status and waits. Jobs need the observed run state. Fail for an extra wake or recovery-policy control. | Fail for selecting stock task and wait actions, which cover resumption and parent wake delivery. Pass for the richer run records and grouped background state. | Pass in existing `thread_status` for recovery. Server wake scheduling and interrupted prompt recovery need no new tool. |
    | Claude app-note delivery digests and Antigravity timeline rows | Pass for raw note metadata and full paired transcript, beyond stock thread messages. | Fail for note bookkeeping. Pass for normal transcript reads used by job reports. | Pass for raw digest metadata. Fail for reading regular timeline rows, covered by `t3_thread_read`. | Fail for exposing note deduplication. Agents already read ordinary messages and tool items through stock. |
    | Push-hook approval details, stock PR form elicitation and skipped-hook note | Pass for structured pending hook details. Stock CLI has no corresponding approval read or PR create operation. | Pass in `thread requests --json` and the existing watcher. Operators can see what the server asks them to approve. Fail for answering approvals or adding a PR creation command. | Pass for reading recorded thread approval details. Stock PR creation already asks a person when possible and reports skipped hooks otherwise. Fail for duplicating PR creation or its approval step. | Pass in `thread_approvals` for surfacing the server card to a person. Fail for a complementary approval answer or PR creation tool. |
    | Provider descriptor roles, incomplete model snapshots and provider behavior (PATH refresh, catalogs, Antigravity settings and quota, Claude and ACP) | Pass for paired provider status and model metadata beyond local `doctor`. | Pass in existing `provider status --json` and dispatch validation. Jobs use advertised choices and can inspect incomplete catalogs. Fail for a separate provider-recovery or settings tool. | Pass for the full provider snapshot with instance status and budget. Fail for model discovery, served by `orchestrator_capabilities`. | Pass in existing `provider_status` and stock model discovery. Fail for exposing catalog maintenance or provider-internal controls. |
    | Clear kept secrets when a settings patch moves the normalized destination | Pass. Stock has no paired writer for the affected OpenCode, usage-limit source, text generator and Simlock settings. | Fail. Destination changes and supplying a new credential belong to operator setup. The tools have no such settings writer. | Pass. Stock environment preferences do not edit these settings. | Fail. Agents have no recurring job that changes the destinations or supplies replacement secrets. |
    | Exact composer mention/review paths, whitespace-preserving checkout metadata, VCS and submodule fixes, and PR watch matching | Pass for paired exact-path records beyond stock local project and thread commands. | Pass for correct existing workspace and diff results. Fail for a path-normalization switch or a separate VCS repair command. | Fail for stock review, checkout and watch outcomes. Pass for richer paired checkpoint diffs. | Pass for correct existing `thread_diff` and stock VCS and watch results. No separate metadata control. |
    | Terminal snapshot/replay sequence state, conditional writes and aborts, and startup, history and renderer corrections | Pass. Stock has no CLI for these T3 terminal transport operations. | Fail. Jobs need their thread result, not an interactive terminal protocol. | Pass for terminal replay and writes. Stock browser input tools drive browser tabs. | Fail for attachment and writes. Existing `thread_terminals` and `terminal_output` serve the read-only recovery use case. |
    | Asset MIME, inline preview sandbox and relative asset files | Pass for paired raw asset bytes and MIME. Stock CLI has no such read. | Fail. Jobs do not retrieve raw preview assets, and the preview server owns sandbox decisions. | Fail for previewing HTML, which stock `html_preview` serves. Pass for a raw MIME and asset-byte read. | Fail for a separate asset tool. Agents use the rendered preview and can leave sandbox enforcement to the server. |
    | Tagged issue, tracker and pull request failures now use HTTP 503 | Pass for paired raw HTTP error bodies. Stock has no raw-error command. | Fail for a separate diagnostic. The CLI has no issue or pull request command, and the library decodes tags for its callers. | Fail for returning issue and pull request failures through built-in tools. Pass for exposing raw HTTP status and body. | Fail for the raw response. Agents use stock forge errors, and the companion uses fixed tool errors. |
    | Workflow execution fixes for tag filtering, expired signals, older replies, concurrent pause and orphan waits | Pass for a paired live wait on an exact run. Stock reads local snapshots. | Pass for the exact-run wait in the [existing proposal](https://github.com/wyrd-company/t3code-client/issues/197). Fail for controls over internal wake and wait behavior. | Pass for a live wait. Stock `t3_workflow` reads snapshots outside threads. | Fail for a dedicated wait or signal diagnostics tool. Agent jobs follow their threads and schedules. |
    | Android discovery with adb alone and optional emulator tools | Pass. Stock CLI has no device inventory query. | Fail. Current CLI jobs do not choose devices. | Fail. Stock `device_list` exposes discovery. | Pass in stock. Agents testing an app can choose a physical device. |
    | File extraction, diff text decoding, voice dictionary casing/progress, relay cleanup, scheduled-run behavior and telemetry/resource-monitor internals | Pass for standalone diagnostics absent from the stock CLI. Internal daemon fields have no public operation. | Fail for a new command. Jobs consume the corrected data in their existing reads and schedules. | Pass for standalone diagnostics absent from stock. The daemon's private process identity fields do not extend the public resource tool data. | Fail for controls over internal extraction, voice, relay and tracing. Existing resource and thread reads serve diagnosis. |
    | Stock CLI triage cancellation and nonnegative `thread show --messages` | Fail for the stock menu and message-count validation, already handled by those commands. Paired full transcripts remain distinct. | Fail for a separate triage or validation command. Pass in existing `thread read` for job transcripts. | Pass for a triage menu absent from MCP. Fail for recent thread messages via `t3_thread_read`. | Fail for a menu or validation tool. Stock thread reads serve message inspection. |
    | Stock CLI trace summary grammar, automatic port and wildcard-host selection, service pairing instructions and Connect restart guidance | Fail for the local operator flows the stock CLI already handles. A paired trace or server read remains distinct. | Fail for mirroring host setup or user messages. Existing paired status and pairing cover automation. | Pass for server traces, which stock MCP does not summarize. Host startup has no agent tool outcome. | Pass in existing `server_traces` for diagnostics. Fail for mirroring CLI output or startup guidance. |
    | Uppercase theme file extensions | Fail. Stock `t3 theme set` handles these files. | Fail. Theme import is a display preference. | Fail for setting themes, served by `t3_theme_set`. A local filename extension is a CLI detail. | Fail. No recurring agent work depends on theme import. |

    **Existing commands and tools**

    Checked all 41 t3c command leaves and 30 complementary MCP tools. The
    individual reasons in `existing-tools-0-1-10` and the corrections in
    `verdicts-0-1-12` carry forward. The grouping below covers the registered
    surfaces and the comparisons against this build.

    | Existing surface | Gate 1 at 0.1.13 | Gate 2 at 0.1.13 |
    | --- | --- | --- |
    | t3c `run`, `thread start/send/wait` | Pass. Stock start/send use local server state and stock has no standalone paired wait. | Pass. Paired jobs dispatch and continue work and need a run-specific completion and exit status. |
    | t3c `thread read/list/find/status/requests/usage/diff/search` | Pass. Stock show's last-message count and local list do not provide paired full transcripts, provider-session lookup, combined status, full requests, usage, checkpoint patches or native content search. | Pass. Jobs inspect outcomes and prompts, report usage and changes, and find work for continuation. |
    | t3c `thread interrupt/respond/stop/tag`, `thread queue resume/start` | Pass. The stock CLI lacks these paired thread controls, including queue-hold release. | Pass. Operator scripts recover running or held work and organize recurring runs. |
    | t3c `project list/ensure`, `auth pair/status/switch/logout`, `server info`, `version` | Pass. Stock project and auth commands manage the host and Connect; they do not maintain t3c's remote profile and project contract. Stock version does not compare the paired server with the independently versioned client and library. | Pass. Jobs select and reuse projects and credentials, check reachability and diagnose version mismatches. |
    | t3c `requests watch` and `--exec` | Pass. Stock show and workflow questions are local snapshots and do not follow every pending runtime request across projects. | Pass. A shared watcher routes recurring operator requests to the configured workflow. |
    | All 12 t3c `schedule` leaves | Pass. Stock durable workflow commands concern a different job type, and the stock CLI has no scheduled-task tree. | Pass. Jobs operate schedules, validate webhook delivery and recover recurring tasks. |
    | t3c `provider status`, `usage summary` | Pass. Stock doctor is local and lacks paired instance quota or historical transcript usage. | Pass. Jobs inspect current readiness and historical spend before dispatch. |
    | MCP `thread_stop` | **Fail.** Stock `t3_thread_interrupt` with `stop: true` dispatches native Stop even for idle threads and also stops delegated tasks. Propose removing the duplicate. | Pass. Agents use native Stop for recovery. Stock serves this outcome. |
    | MCP `thread_force_stop`, `thread_queue_resume`, `thread_queue_start` | Pass. Stock interrupt has no provider-process kill/release result, and `t3_queue` has no hold release or selected held-message Start. | Pass. Agents recover a stuck process or choose the recovery step that starts first. |
    | MCP `thread_status`, `thread_approvals`, `thread_usage`, `thread_diff`, `thread_search_content`, `thread_family`, `worktree_threads` | Pass. Stock thread, queue, question and worktree tools do not replace these outcomes: combined run/queue state, pending approval cards, usage, checkpoint patches, within-thread search, family resolution and active users of a checkout. | Pass. Agents inspect active work and related threads before steering, recovering or cleaning up. |
    | MCP `thread_tag`, `tagged_threads` | Pass. Stock thread organize and list have no tags or tag filter. | Pass. Agents tag and retrieve members of recurring jobs. |
    | MCP `scheduled_task_endpoint`, `scheduled_task_deliveries`, `scheduled_task_delivery`, `rotate_scheduled_task_webhook`, `scheduled_task_configuration`, `configure_scheduled_task` | Pass. Stock schedule creation can return a webhook URL, but the stock tools do not cover existing endpoints, deliveries, rotation or full execution configuration and its targeted controls. Stock workflow hooks address durable workflows. | Pass. Agents investigate trigger outcomes and repair schedule execution without unrelated changes. |
    | MCP `thread_terminals`, `terminal_output`, `local_servers`, `stop_local_server` | Pass. Stock preview tools manage tabs. They do not provide server terminal reads or list and stop thread-owned local processes. | Pass. Agents can diagnose failed jobs and stop their own completed services. |
    | MCP `server_traces`, `server_processes`, `server_host_resources`, `server_resource_history`, `server_storage_cleanup_report` | Pass. Stock thread, environment and worktree tools do not expose server-wide trace, process, host and cleanup reports. | Pass. Agents diagnose slow or blocked work and check host capacity before dispatch. |
    | MCP `provider_status`, `usage_summary` | Pass. Stock capability discovery and environment reads omit budgeting windows and historical transcript usage. | Pass. Agents choose an available provider and check cost before delegating. |

    **Open capability issues**

    | Proposal | t3c gate 1 | t3c gate 2 | MCP gate 1 | MCP gate 2 |
    | --- | --- | --- | --- | --- |
    | [Stage a remote server update](https://github.com/wyrd-company/t3code-client/issues/173) | Pass. Stock `update` and `service update` affect the local install, with no paired stage-only operation. | Pass. Rollout jobs can prepare a release ahead of downtime. | Pass. Stock environment tools cannot stage a release. | Fail. Deployment preparation belongs to operator jobs. |
    | [Provisional historical usage](https://github.com/wyrd-company/t3code-client/issues/174) | Pass. Stock has no historical transcript usage query. | Pass. Built as `usage summary --provisional` for frequent budget polls. | Pass. Stock has no historical transcript usage query. | Pass in existing `usage_summary` with `provisional: true`. |
    | [Paired schema-validated execution results](https://github.com/wyrd-company/t3code-client/issues/196) | Pass. Stock `thread start/send --output-schema --wait --json` uses local server state. | Pass. Dagu consumes the exact validated output under the originating run ID. | Fail. Stock launch/send/wait and `t3_submit_output` serve this outcome. | Pass in stock. Agents exchange structured results. |
    | [Wait for a paired durable workflow run](https://github.com/wyrd-company/t3code-client/issues/197) | Pass. Stock `workflow list/show` are local snapshots and have no exact-run follow from a remote webhook receipt. | Pass. A Dagu step waits for the run named in its webhook response. | Pass. Stock `t3_workflow` is a snapshot read outside threads. | Fail. Current agent jobs monitor threads and schedules. |
    | [Provision and launch paired multi-repository projects](https://github.com/wyrd-company/t3code-client/issues/198) | Pass. Stock `project add --track` works locally and stock `thread start --worktree` lacks a repository-selection list. | Pass. Jobs can reuse tracked folders and verify the selected worktree layout. | Fail. Stock project create/update/read and thread launch repository selection cover the outcome. | Pass in stock. Agents select the repositories they need. |
    | [Read HTTP quota account windows](https://github.com/wyrd-company/t3code-client/issues/199) | Pass. Stock doctor and existing `provider status` omit configured source accounts. | Pass. Jobs choose whether to dispatch from account-specific quota and freshness. | Pass. Stock environment read and capability discovery lack source-account windows. | Pass. Agents can select an account with available quota. |
    | [Unbind a schedule without changing its mode](https://github.com/wyrd-company/t3code-client/issues/200) | Pass. Stock has no schedule update CLI. Existing `--new-thread` changes thread mode. | Pass. Jobs can recover tasks bound to a retired thread while keeping execution policy. | Pass. Stock `schedule_task` changes mode and resets workspace on unbinding. It refuses unbinding into fresh sessions in one call. | Pass. Agents can repair recurring work with no intermediate mode or workspace change. |

  verdicts-0-1-12: |
    Basis: stock T3 Code v0.1.11 (59651c1761f6c63e9b6056839067066968e6a406)
    and v0.1.12 (ca81b7b97a1c4b91e5ac25768d0f6629f37732fd). The comparison
    uses the [stock command tree](https://github.com/pingdotgg/t3code/tree/v0.1.12/apps/server/src/cli),
    its registration in `apps/server/src/binCli.ts`, and all 95 tools in the
    [stock MCP toolkits](https://github.com/pingdotgg/t3code/tree/v0.1.12/apps/server/src/mcp/toolkits).
    The client inventory is in [the merged library update](https://github.com/wyrd-company/t3code-client/pull/193).
    Rows group wire fields and behavior that serve the same outcome. An existing
    read can pass both gates and already carry the new fields.

    | Capability | t3c gate 1 | t3c gate 2 | MCP gate 1 | MCP gate 2 |
    | --- | --- | --- | --- | --- |
    | Dispatch a turn with a schema and receive the run's submitted output (`message.dispatch.outputSchema`, `run.output-submitted`, stock `untilOutput`) | Pass for paired remote execution. Stock `t3 thread start/send --output-schema --wait --json` mints a session from the local server's state. | Pass. Dagu can branch on the structured result with its run id and job exit status. [Follow-up](https://github.com/wyrd-company/t3code-client/issues/196). | Fail. Stock launch, send, wait and `t3_submit_output` together cover the outcome. | Pass. Agents can exchange validated results through those stock tools. |
    | Wait for a durable workflow run from a webhook receipt (`workflows.subscribe/get`, workflow hook `{runId}`) | Pass. Stock `t3 workflow list/show` are local snapshots. | Pass. A Dagu job can gate dependent steps on the exact remote run and return its result. [Follow-up](https://github.com/wyrd-company/t3code-client/issues/197). | Pass for a live wait. `t3_workflow` gives outside MCP clients read/list snapshots and is hidden from agent threads. | Fail. Current agent jobs monitor their threads and schedules. |
    | Workflow inventory, counts, run/step/reference detail and pending questions | Pass for a paired one-shot inventory. Stock `t3 workflow list/show/questions` cover local reads. | Fail for separate inventory and counters. Automation needs to follow the run it starts. | Pass for in-thread reads and counts. Stock outside MCP exposes list, read and questions. | Fail. Our agents have no recurring workflow inventory task. |
    | Start, answer, resume or cancel a durable workflow, signal/withdraw a question, list hooks and use the workflow store | Pass for remote actions. Stock `t3 workflow` covers the corresponding local actions. | Fail. The integration starts through a configured webhook. Recovery and decisions on pending questions belong to the operator. | Fail for the corresponding outside-client `t3_workflow` actions. It is hidden from threads. `t3_workflow_stop` stops a Claude workflow inside a thread and is a distinct operation. | Fail for a complementary write surface. Agents do not own operator decisions on durable runs. |
    | Read, save or delete workflow definition files, and change workflow enablement and skipped-run retention | Pass. Stock workflow verbs operate on runs or the store. They have no definition editing or settings command. | Fail. Definitions are authored and versioned as code. Enablement and retention are operator setup. | Pass. Stock `t3_workflow` does not manage definitions or server policy. | Fail. Agents work on the definition source through the normal repository workflow. |
    | Durable workflow milestone events, workflow thread origin, and workflow step exclusion from thread listings | Pass for workflow-specific event telemetry beyond local `workflow show`. Existing listings inherit the library's exclusion of step threads. | Fail for a milestone consumer or step-thread listing override. Status and result of a selected workflow run cover the Dagu handoff. | Fail for extra milestone delivery. Stock MCP publishes the events, while workflow step origin and filtering follow server policy. | Fail. Agent thread recovery does not need the private step threads or another milestone feed. |
    | Register and launch a multi-repository project (`trackedFolders`, `trackFolders/untrackFolders`, selected launch `repositories`) | Pass. `t3 project add --track` acts locally and `t3 thread start --worktree` has no repository selection. | Pass. Jobs that provision a shared workspace need to reapply the same project folders and choose which repositories they check out. [Follow-up](https://github.com/wyrd-company/t3code-client/issues/198). | Fail. Stock `t3_project_create/update/read` and `t3_thread_launch.workspaceStrategy.repositories` cover the project and launch. | Pass. Agents can choose the repositories for their work through stock. |
    | Scan folders, inspect discovered paths, read a task folder or attach another repository to it (`workspace.listFolders/scanFolders/taskFolder/addTaskFolderRepository`) | Pass for direct inspection and editing of a remote task folder. Stock `project add` discovers folders at registration. | Fail for a standalone remote scanner or repair action. Jobs need the tracked project and the resulting launch layout. | Pass for scan, layout detail and late attachment. Stock project tools expose tracked folders and worktree tools expose refs and paths. | Fail. Agents can select the required repositories at launch. Changing the layout of a working task stays with the operator. |
    | Inspect and approve project worktree layout commands (`workspace.layoutCommands/approveLayoutCommands`, `t3.json`, policy and project-script scope) | Pass. Stock `t3 policy` handles policy files and settings, without approving commands for a paired project. | Fail. Approval makes a specific project command executable and is an operator decision. | Pass. Stock project reads show saved actions without authorizing layout commands. | Fail. Agents do not decide approvals or widen execution permission. |
    | Preserve exact Git refs across launch, schedules, review, diffs, VCS, worktrees and status | Pass for paired launch/scheduler inputs. Stock `t3 thread start --worktree/--branch` uses stock refs on the local server. | Pass in the existing path. Automation must forward exact refs, including refs made of Unicode whitespace. CLI launch and schedule validation use `GitRefName`. | Fail for new ref handling. Stock worktree handoff and stock VCS operations already honor these names. Existing MCP tools get the typed refs where the library returns them. | Pass for preserving exact names in existing results. No second ref tool is needed. |
    | Per-repository checkpoint patches and scope labels | Pass. Stock `t3 thread show` lacks checkpoint-range patches. | Pass in existing `thread diff --json`; `data.repositories` carries each patch and its path. The library selects the latest completed run's checkpoint for tracked repositories even when the thread root is outside Git. | Pass. Stock `t3_thread_read` and forge diff tools do not read checkpoint-range patches. | Pass in existing `thread_diff`, which carries the same repository patches. |
    | Rollback warnings for repositories left unrestored, attempt modes, run/launch failure detail and title handling | Pass for extra JSON detail through the paired workflow. Stock `thread show` reports failure detail and `thread start --generate-title` handles generated titles locally. | Fail for a dedicated warning, attempt-mode or title command. Jobs already get run and thread state from existing reads and rely on stable invocation identities. | Fail for stock launch and title editing (`t3_thread_launch/update`). Pass for low-level rollback and attempt records absent from stock summaries. | Fail for a separate tool. The agent's recovery flow uses run and thread reads and reports the server's result. |
    | Queued message model edits, slash command queuing, inherited model selection, missed steers and run settlement | Pass for remote queue model editing. Stock CLI send queues a message without editing it. | Fail for independent queue-model editing. Jobs declare the model they dispatch; delivery policy and state ordering come from the server. | Pass for changing a queued run's model. `t3_queue edit` replaces text. Other delivery and settlement rules are server behavior in stock. | Fail. Agents do not need another queue-model control for current recovery work. |
    | Provider phase, dropped turns, authentication verification and `t3_background_wait` availability | Pass for a separate provider session inspection. Stock shows thread and provider health, without these wire details. | Fail for a separate command. Existing diagnostics and lifecycle results serve preflight and recovery. | Fail for awaiting provider background work, served by stock `t3_background_wait` where the provider supports it. Pass for raw provider phase and auth metadata. | Fail for separate controls on the phase or verification URL. Agents use stock wait when available and direct account issues to the operator. |
    | HTTP usage-limit source snapshots, account windows and account model labels | Pass. Stock `t3 doctor` lacks a paired source account read. `provider status` reports provider instances. | Pass. Budget jobs need current per-account quota before dispatching. [Follow-up](https://github.com/wyrd-company/t3code-client/issues/199). | Pass. Stock environment read and model discovery lack account windows. | Pass. Agents can select an instance with quota before delegating. [Follow-up](https://github.com/wyrd-company/t3code-client/issues/199). |
    | Feedback preview, answer and settings, including optional conversation trace | Fail for filing or listing feedback. Stock `t3 feedback` and `feedback list` cover those outcomes. Pass for answering the in-thread card from a remote profile. | Fail. A person chooses whether to send feedback and share its trace. | Fail for asking to send feedback. Stock `t3_feedback` raises the card. Pass for answering it or changing the policy. | Fail for a complementary tool. Agents can ask through stock; the operator owns consent and settings. |
