# ---
# relationships:
#   implements: [library, command-line, mcp]
# ---
version: "3"

includes:
  lib:
    taskfile: packages/t3code-lib/Taskfile.yml
    dir: packages/t3code-lib
  mcp:
    taskfile: packages/t3code-mcp/Taskfile.yml
    dir: packages/t3code-mcp
  cli:
    taskfile: packages/t3code-cli/Taskfile.yml
    dir: packages/t3code-cli

tasks:
  install:
    desc: Install all workspace dependencies
    cmds: [pnpm install]
  build:
    desc: Build workspace packages
    cmds: [pnpm run build]
  fmt:
    desc: Format the workspace
    cmds: [pnpm run fmt]
  lint:
    desc: Check workspace formatting and lint
    cmds: [pnpm run check]
  typecheck:
    desc: Type-check packages and release automation
    cmds: [{ task: build }, pnpm exec tsc --noEmit, pnpm run typecheck]
  test:
    desc: Run package and release automation tests
    cmds: [pnpm run test, { task: "release:test" }]
  test:live:
    desc: Test the pinned server with an isolated temporary home
    cmds: [{ task: build }, pnpm run test:live]
  fixtures:
    desc: Capture sanitized library fixtures from the targeted server
    cmds: [{ task: "lib:fixtures" }]
  package:
    desc: Pack packages and verify consumer installation
    cmds: [pnpm run package]
  intents:
    desc: Validate intents with ephemeral baselines outside this repository
    cmds: [scripts/release/check-intents.sh]
  release:test:
    desc: Test release boundaries without publishing
    cmds: [pnpm exec vp test run]
  homebrew:test:
    desc: Validate a temporary formula with local CLI/library tarballs
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_UPGRADE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      HOMEBREW_NO_AUTOREMOVE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    cmds: [scripts/release/test-homebrew.sh]
  docs:
    desc: Generate the published library API reference
    cmds: [{ task: "cli:docs" }]
  demo:check:
    desc: Render and verify real demo commands without changing tracked assets
    cmds: [{ task: "cli:demo:check" }]
  demo:
    desc: Record the CLI on a fresh pinned server
    cmds: [{ task: "cli:demo" }]
  check:
    desc: All workspace gates before handoff
    cmds:
      - task: intents
      - task: lint
      - task: typecheck
      - task: lib:docs:check
      - task: cli:docs:check
      - task: test
      - task: mcp:test:protocol
      - task: test:live
      - task: package
