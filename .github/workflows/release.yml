name: Release

# A plain `X.Y.Z` tag on the tip of main asks for a release. The tag names the
# version; Intentional must compute the same version from the pending intents
# or nothing happens. On agreement this workflow applies the intents, commits
# the result to main, and pushes the annotated `t3code-client@X.Y.Z` release
# record, which starts the Publish workflow.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Apply and tag the release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Pushes made with the workflow token start no workflows, so the commit
      # and the release tag are pushed with the repository's GitHub App.
      - name: Mint the release credential
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WYRD_CI_APP_ID }}
          private-key: ${{ secrets.WYRD_CI_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Require the tag to name the tip of main
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $VERSION is not plain X.Y.Z."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $VERSION names $GITHUB_SHA, but main is at $(git rev-parse HEAD). Tag the tip of main."
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Check release intents
        uses: wyrd-company/intentional@25b97b64a994f6e3fb88d0e136ecb9f2589c384f # 0.1.6
        with:
          command: check
          intentional-version: "0.1.6"

      - name: Check
        run: |
          pnpm run check
          pnpm run typecheck
          pnpm run test
          pnpm run test:live

      - name: Plan the release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          plan="$RUNNER_TEMP/release-plan.json"
          intentional plan > "$plan"
          planned="$(jq -r '[.tags[] | select(.release_unit == "t3code-client") | .name] | join(" ")' "$plan")"
          if [[ "$planned" != "t3code-client@$VERSION" ]]; then
            echo "::error::Tag $VERSION asks for t3code-client@$VERSION, but the pending intents plan '${planned:-no release}'."
            exit 1
          fi
          jq . "$plan"

      - name: Apply the release
        run: |
          intentional apply
          pnpm run fmt:check

      - name: Commit and tag the release
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(release): t3code-client $VERSION"
          intentional tag --plan "$RUNNER_TEMP/release-plan.json"
          git push --atomic origin HEAD:main "refs/tags/t3code-client@$VERSION"
