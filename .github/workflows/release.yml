name: Release

# The expected set is a guard against applying an unrelated pending unit.
on:
  workflow_dispatch:
    inputs:
      expected-records:
        description: "Exact space-separated records, e.g. t3code-lib@0.1.0 t3code-cli@0.1.0 t3code-mcp@0.1.0 t3c-docs@0.1.1 t3mcp-docs@0.1.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Apply and tag the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      # Pushes made with the workflow token start no workflows, so the commit
      # and the release tag are pushed with the repository's GitHub App.
      - name: Mint the release credential
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.WYRD_CI_APP_ID }}
          private-key: ${{ secrets.WYRD_CI_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
          run-install: true

      - name: Check release intents
        uses: wyrd-company/intentional@0f5ba4ec04c1505831a40f558eb64ab1761d63ef # 0.4.1
        with:
          command: check
          intentional-version: "0.4.1"

      - name: Check
        run: |
          pnpm run build
          pnpm run check
          pnpm exec tsc --noEmit
          pnpm exec vp test run
          pnpm run typecheck
          pnpm run test
          pnpm run test:live

      - name: Plan the release
        env:
          EXPECTED_RECORDS: ${{ inputs.expected-records }}
        run: |
          intentional plan > "$RUNNER_TEMP/release-plan.json"
          scripts/release/verify-plan.sh "$EXPECTED_RECORDS" "$RUNNER_TEMP/release-plan.json"
          scripts/release/verify-readiness.sh "$RUNNER_TEMP/release-plan.json"

      - name: Apply the verified release
        run: |
          scripts/release/apply-plan.sh "$RUNNER_TEMP/release-plan.json"
          pnpm install --lockfile-only
          pnpm run build
          pnpm --filter @wyrd-company/t3code-cli exec node scripts/shrinkwrap.mjs
          pnpm run fmt:check

      - name: Commit and tag the release
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(release): apply independent package versions"
          intentional tag --plan "$RUNNER_TEMP/release-plan.json"
          mapfile -t records < <(jq -r '.tags[].name | "refs/tags/" + .' "$RUNNER_TEMP/release-plan.json")
          git push --atomic origin HEAD:main "${records[@]}"

      # GitHub omits all tag push events when an atomic push has over three tags.
      # Dispatch with the workflow token; workflow_dispatch can start workflows.
      - name: Dispatch packages when tag push events are suppressed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/dispatch-packages.sh "$RUNNER_TEMP/release-plan.json"
