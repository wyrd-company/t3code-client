name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-foundation:
    name: Check release foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Intentional reads release authority from the annotated tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Show Intentional status
        uses: wyrd-company/intentional@7746a3aba9d48e1aafa8706aa017628abf56d2a5 # 0.1.8
        with:
          command: status
          intentional-version: "0.1.8"

      - name: Check release foundation
        run: |
          scripts/release/check-intents.sh
          pnpm run check
          pnpm exec tsc --noEmit
          pnpm exec vp test run

  check:
    name: Check ${{ matrix.unit }}
    needs: release-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        unit: [t3code-lib, t3code-cli, t3code-mcp]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Intentional reads release authority from the annotated tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Check package
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          pnpm --filter "@wyrd-company/$UNIT..." run build
          pnpm --filter "@wyrd-company/$UNIT" run typecheck
          pnpm --filter "@wyrd-company/$UNIT" run test
          pnpm --filter "@wyrd-company/$UNIT" run test:live
          pnpm --filter "@wyrd-company/$UNIT" --if-present run test:protocol
          pnpm --filter "@wyrd-company/$UNIT" run package
