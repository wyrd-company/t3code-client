name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-foundation:
    name: Check release foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Intentional reads release authority from the annotated tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Show Intentional status
        uses: wyrd-company/intentional@0763785af2ebe865cd6131f73981d66f183dcfe5 # 0.2.1
        with:
          command: status
          intentional-version: "0.2.1"

      - name: Check release foundation
        run: |
          scripts/release/check-intents.sh
          pnpm run check
          pnpm exec tsc --noEmit
          pnpm exec vp test run

  check:
    name: Check ${{ matrix.unit }}
    needs: release-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        unit: [t3code-lib, t3code-cli]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Intentional reads release authority from the annotated tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Check package
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          pnpm --filter "@wyrd-company/$UNIT..." run build
          pnpm --filter "@wyrd-company/$UNIT" run typecheck
          pnpm --filter "@wyrd-company/$UNIT" run test
          pnpm --filter "@wyrd-company/$UNIT" run test:live
          pnpm --filter "@wyrd-company/$UNIT" run package
