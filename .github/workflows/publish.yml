name: Publish

# Annotated `t3code-lib@X.Y.Z` and `t3code-cli@X.Y.Z` records start package
# publication. Every job is safe to rerun: an npm version or GitHub Release
# that already exists is verified instead of recreated.
#
# Documentation publishes to wyrd.foo through the reusable workflow, on a CLI
# record (after its GitHub Release exists), on a `t3c-docs@X.Y.Z` record, or on
# a manual run. A `t3c-docs` record pushed with a CLI record is published by the
# CLI run. There is no publish on a plain push to main.
# See docs/technical-designs/releasing.yml.

on:
  push:
    tags:
      - "t3code-lib@*"
      - "t3code-cli@*"
      - "t3c-docs@*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true
      feature:
        description: Feature a product on the front page
        type: boolean
        default: false
      feature-product:
        description: The product key to feature; empty when the repo has one product
        default: ""
      feature-days:
        description: How long the feature lasts, in days
        default: "14"
      feature-reason:
        description: For example "New MCP server"; default "New release"
        default: ""

permissions: {}

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the documentation publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this run publishes documentation
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          publish=false
          case "$EVENT_NAME:$REF_NAME" in
            workflow_dispatch:*) publish=true ;;
            push:t3code-cli@0.0.0) ;; # a baseline record is not a release
            push:t3code-cli@*) publish=true ;;
            push:t3c-docs@*)
              # Pushed with a CLI record, the docs record waits for that run:
              # the product page needs the CLI's GitHub Release first.
              if [[ -z "$(git tag --list 't3code-cli@*' --points-at "$GITHUB_SHA")" ]]; then
                publish=true
              fi
              ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify
    # The baseline record establishes release authority; it is not a release.
    # Docs records and manual runs have no package to build.
    if: >-
      github.event_name == 'push'
      && (startsWith(github.ref_name, 't3code-lib@') || startsWith(github.ref_name, 't3code-cli@'))
      && github.ref_name != 't3code-lib@0.0.0' && github.ref_name != 't3code-cli@0.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      unit: ${{ steps.version.outputs.unit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an Intentional release record for the package version
        id: version
        run: |
          scripts/release/verify-release-tag.sh "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#*@}" >> "$GITHUB_OUTPUT"
          echo "unit=${GITHUB_REF_NAME%@*}" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Check
        run: |
          pnpm run check
          pnpm --filter "@wyrd-company/${GITHUB_REF_NAME%@*}..." run build
          pnpm --filter "@wyrd-company/${GITHUB_REF_NAME%@*}" run typecheck
          pnpm --filter "@wyrd-company/${GITHUB_REF_NAME%@*}" run test
          pnpm --filter "@wyrd-company/${GITHUB_REF_NAME%@*}" run test:live

      - name: Pack
        run: |
          unit="${GITHUB_REF_NAME%@*}"
          tarball="$(scripts/release/verify-package.sh "$unit" "$RUNNER_TEMP/package")"
          if [[ "$unit" == t3code-cli ]]; then
            library="$(scripts/release/verify-package.sh t3code-lib "$RUNNER_TEMP/library")"
            scripts/release/verify-consumer.sh "$tarball" "$unit" "$library"
          else
            scripts/release/verify-consumer.sh "$tarball" "$unit"
          fi
          scripts/release/extract-release-notes.sh "${{ steps.version.outputs.version }}" "packages/$unit/CHANGELOG.md" "$RUNNER_TEMP/package/release-notes.md"
          echo "Packed $tarball"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ github.ref_name }}
          path: ${{ runner.temp }}/package
          if-no-files-found: error

  npm:
    name: Publish to npmjs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.ref_name }}
          path: ${{ runner.temp }}/package

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          UNIT: ${{ needs.build.outputs.unit }}
        run: scripts/release/ensure-npm.sh "$UNIT" "$VERSION" "$RUNNER_TEMP/package"

  github-release:
    name: Create the GitHub Release
    needs: [build, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ github.ref_name }}
          path: ${{ runner.temp }}/package

      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/ensure-github-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/package"

  docs:
    name: Publish documentation to wyrd.foo
    needs: [plan, build, npm, github-release]
    # Package records publish after their GitHub Release; docs records and
    # manual runs skip the package jobs.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.publish == 'true' }}
    permissions:
      contents: read
    uses: wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@v2
    with:
      ref: ${{ inputs.ref || github.ref_name }}
      feature: ${{ inputs.feature || false }}
      feature-product: ${{ inputs.feature-product || '' }}
      feature-days: ${{ inputs.feature-days || '14' }}
      feature-reason: ${{ inputs.feature-reason || '' }}
    # Only the two secrets the reusable workflow declares; the repo's npm and
    # release secrets stay out of the called workflow.
    secrets:
      WYRD_TOOLS_DOCS_PUBLISHER_APP_ID: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
      WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
