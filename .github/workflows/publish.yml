name: Publish

# An annotated `t3code-client@X.Y.Z` release record starts publication. Every
# job is safe to rerun: an npm version or GitHub Release that already exists
# is verified instead of recreated.

on:
  push:
    tags:
      - "t3code-client@*"

permissions: {}

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    # The baseline record establishes release authority; it is not a release.
    if: github.ref_name != 't3code-client@0.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an Intentional release record for the package version
        id: version
        run: |
          scripts/release/verify-release-tag.sh "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#t3code-client@}" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Check
        run: |
          pnpm run check
          pnpm run typecheck
          pnpm run test
          pnpm run test:live

      - name: Pack
        run: |
          tarball="$(scripts/release/verify-package.sh "$RUNNER_TEMP/package")"
          scripts/release/verify-consumer.sh "$tarball"
          scripts/release/extract-release-notes.sh "${{ steps.version.outputs.version }}" CHANGELOG.md "$RUNNER_TEMP/package/release-notes.md"
          echo "Packed $tarball"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
          if-no-files-found: error

  npm:
    name: Publish to npmjs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/release/ensure-npm.sh "$VERSION" "$RUNNER_TEMP/package"

  github-release:
    name: Create the GitHub Release
    needs: [build, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/ensure-github-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/package"
