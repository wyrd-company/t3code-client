name: Publish

# Annotated `t3code-lib@X.Y.Z`, `t3code-cli@X.Y.Z` and `t3code-mcp@X.Y.Z`
# records start package publication. Every job is safe to rerun: an npm
# version or GitHub Release that already exists is verified instead of
# recreated. A library record publishes no documentation.
#
# Documentation publishes to wyrd.foo through the reusable workflow, on a CLI
# or MCP record (after its GitHub Release exists), on a product docs record,
# or on a manual run. Docs records pushed with a CLI or MCP record are
# published by those package runs. There is no publish on a plain push to main.
# See docs/technical-designs/releasing.yml.

on:
  push:
    tags:
      - "t3code-lib@*"
      - "t3code-cli@*"
      - "t3code-mcp@*"
      - "t3c-docs@*"
      - "t3mcp-docs@*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true
      publish-package:
        description: Publish the selected annotated npm release record as well as documentation
        type: boolean
        default: false
      feature:
        description: Feature a product on the front page
        type: boolean
        default: false
      feature-product:
        description: The product key to feature; empty when the repo has one product
        default: ""
      feature-days:
        description: How long the feature lasts, in days
        default: "14"
      feature-reason:
        description: For example "New MCP server"; default "New release"
        default: ""

permissions: {}

concurrency:
  group: publish-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      record: ${{ steps.plan.outputs.record }}
      build-package: ${{ steps.plan.outputs.build-package }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this run publishes a package and documentation
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ inputs.ref || github.ref_name }}
          PUBLISH_PACKAGE: ${{ inputs.publish-package || false }}
        run: |
          scripts/release/plan-package.sh "$EVENT_NAME" "$REF_NAME" "$PUBLISH_PACKAGE" >> "$GITHUB_OUTPUT"
          scripts/release/plan-docs.sh "$EVENT_NAME" "$REF_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify
    needs: plan
    # Manual runs remain docs-only unless package publication is explicit.
    if: needs.plan.outputs.build-package == 'true'
    env:
      RECORD: ${{ needs.plan.outputs.record }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      unit: ${{ steps.version.outputs.unit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.record }}
          persist-credentials: false

      - name: Require an Intentional release record for the package version
        id: version
        run: |
          scripts/release/verify-release-tag.sh "$RECORD"
          echo "version=${RECORD#*@}" >> "$GITHUB_OUTPUT"
          echo "unit=${RECORD%@*}" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Check
        run: |
          pnpm run check
          pnpm --filter "@wyrd-company/${RECORD%@*}..." run build
          pnpm --filter "@wyrd-company/${RECORD%@*}" run typecheck
          pnpm --filter "@wyrd-company/${RECORD%@*}" run test
          pnpm --filter "@wyrd-company/${RECORD%@*}" run test:live

      - name: Pack
        run: |
          unit="${RECORD%@*}"
          tarball="$(scripts/release/verify-package.sh "$unit" "$RUNNER_TEMP/package")"
          if [[ "$unit" != t3code-lib ]]; then
            library="$(scripts/release/verify-package.sh t3code-lib "$RUNNER_TEMP/library")"
            scripts/release/verify-consumer.sh "$tarball" "$unit" "$library"
          else
            scripts/release/verify-consumer.sh "$tarball" "$unit"
          fi
          scripts/release/extract-release-notes.sh "${RECORD#*@}" "packages/$unit/CHANGELOG.md" "$RUNNER_TEMP/package/release-notes.md"
          echo "Packed $tarball"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ needs.plan.outputs.record }}
          path: ${{ runner.temp }}/package
          if-no-files-found: error

  npm:
    name: Publish to npmjs
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.record }}
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ needs.plan.outputs.record }}
          path: ${{ runner.temp }}/package

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          UNIT: ${{ needs.build.outputs.unit }}
        run: scripts/release/ensure-npm.sh "$UNIT" "$VERSION" "$RUNNER_TEMP/package"

  github-release:
    name: Create the GitHub Release
    needs: [plan, build, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.record }}
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ needs.plan.outputs.record }}
          path: ${{ runner.temp }}/package

      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ needs.plan.outputs.record }}
        run: scripts/release/ensure-github-release.sh "$RECORD" "$RUNNER_TEMP/package"

  docs:
    name: Publish documentation to wyrd.foo
    needs: [plan, build, npm, github-release]
    # Package records publish after their GitHub Release; docs records and
    # manual docs-only runs skip the package jobs.
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.publish == 'true' }}
    permissions:
      contents: read
    uses: wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@v2
    with:
      ref: ${{ inputs.ref || github.ref_name }}
      feature: ${{ inputs.feature || false }}
      feature-product: ${{ inputs.feature-product || '' }}
      feature-days: ${{ inputs.feature-days || '14' }}
      feature-reason: ${{ inputs.feature-reason || '' }}
    # Only the two secrets the reusable workflow declares; the repo's npm and
    # release secrets stay out of the called workflow.
    secrets:
      WYRD_TOOLS_DOCS_PUBLISHER_APP_ID: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
      WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
