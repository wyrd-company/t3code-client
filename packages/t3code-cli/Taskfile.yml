# ---
# relationships:
#   implements: command-line
# ---
version: "3"
tasks:
  install:
    desc: Install workspace dependencies
    cmds: [pnpm install]
  build:
    desc: Build the CLI and its library
    cmds: [pnpm --filter @wyrd-company/t3code-lib build, pnpm run build]
  fmt:
    desc: Format CLI sources
    cmds: [pnpm run fmt]
  lint:
    desc: Check CLI formatting and lint
    cmds: [pnpm run check]
  typecheck:
    desc: Type-check CLI sources and tests
    cmds: [pnpm run typecheck]
  test:
    desc: Test CLI composition and output
    cmds: [pnpm run test]
  test:live:
    desc: Test version against pinned or explicit caller server
    deps: [build]
    cmds: [pnpm run test:live]
  acceptance:
    desc: Prove CLI version and Luna on a fresh owned external server home
    deps: [build]
    cmds: [node scripts/acceptance.mjs]
  shrinkwrap:
    desc: Generate registry-resolved shrinkwrap from built library tarball
    cmds: [node scripts/shrinkwrap.mjs]
  package:
    desc: Pack CLI/library and verify installed executable
    cmds: [pnpm run package]
  check:
    desc: All CLI gates
    cmds:
      - task: build
      - task: lint
      - task: typecheck
      - task: test
      - task: test:live
      - task: package
