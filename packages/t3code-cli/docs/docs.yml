# relationships:
#   references: command-line
name: t3c
tagline: Run T3 Code conversations from your terminal and automation.
blurb: >-
  A Node command-line client and TypeScript library for stock T3 Code.
  Pair named servers, run or continue conversations, inspect threads, and
  preserve clear output and exit codes in automation.
category: Development
language: TypeScript
status: preview
repo: https://github.com/wyrd-company/t3code-client
install:
  - label: npm
    command: npm install -g @wyrd-company/t3code-cli
  - label: Homebrew
    command: brew install wyrd-company/tools/t3c
