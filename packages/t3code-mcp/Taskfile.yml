# ---
# relationships:
#   implements: mcp
# ---
version: "3"
tasks:
  install:
    cmds: [pnpm install]
  build:
    desc: Build the MCP server and its library dependency
    cmds: [pnpm --filter @wyrd-company/t3code-lib build, pnpm run build]
  fmt:
    cmds: [pnpm run fmt]
  lint:
    cmds: [pnpm run check]
  typecheck:
    cmds: [pnpm run typecheck]
  test:
    cmds: [pnpm run test]
  test:protocol:
    desc: Verify declarative MCP cases over stdio
    deps: [build]
    cmds: [pnpm run test:protocol]
  test:live:
    desc: Test two isolated pinned T3 servers
    deps: [build]
    cmds: [pnpm run test:live]
  package:
    deps: [build]
    cmds: [pnpm run package]
  check:
    cmds:
      - task: build
      - task: lint
      - task: typecheck
      - task: test
      - task: test:protocol
      - task: test:live
      - task: package
