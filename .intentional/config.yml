$schema: https://intentional.foo/schemas/config.yml
contract: contract-1
settings:
  internal-dependency-bump: patch
  pre-1-0-bump-mapping: component
discovery:
  managed-paths:
    - detector: npm-package
      path: packages/t3code-lib/package.json
      release-unit: t3code-lib
    - detector: npm-package
      path: packages/t3code-cli/package.json
      release-unit: t3code-cli
    - detector: npm-package
      path: packages/t3code-mcp/package.json
      release-unit: t3code-mcp
release-units:
  t3code-lib:
    path: packages/t3code-lib
    projections:
      - adapter: npm
        file: package.json
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
  t3code-cli:
    path: packages/t3code-cli
    projections:
      - adapter: npm
        file: package.json
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
  t3code-mcp:
    path: packages/t3code-mcp
    projections:
      - adapter: npm
        file: package.json
        mode: committed
      - adapter: json
        file: .claude-plugin/plugin.json
        pointer: /version
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
