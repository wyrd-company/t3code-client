$schema: https://intentional.foo/schemas/config.yml
contract: contract-2
settings:
  internal-dependency-bump: patch
discovery:
  managed-paths:
    - detector: npm-package
      path: packages/t3code-lib/package.json
      release-unit: t3code-lib
    - detector: npm-package
      path: packages/t3code-cli/package.json
      release-unit: t3code-cli
    - detector: npm-package
      path: packages/t3code-mcp/package.json
      release-unit: t3code-mcp
    - detector: npm-package
      path: packages/t3code-proxy/package.json
      release-unit: t3code-proxy
    - detector: devcontainer-feature
      path: features/src/t3code-proxy/devcontainer-feature.json
      release-unit: t3code-proxy-feature
release-units:
  t3code-lib:
    path: packages/t3code-lib
    projections:
      - adapter: npm
        file: package.json
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
  t3code-cli:
    path: packages/t3code-cli
    projections:
      - adapter: npm
        file: package.json
        mode: committed
      # The wyrd.foo product page shows the installed version.
      - adapter: yaml
        file: /docs/user/docs.yml
        pointer: /products/t3c/version
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
  t3code-mcp:
    path: packages/t3code-mcp
    projections:
      - adapter: npm
        file: package.json
        mode: committed
      - adapter: yaml
        file: /docs/user/docs.yml
        pointer: /products/t3mcp/version
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
  t3code-proxy:
    path: packages/t3code-proxy
    projections:
      - adapter: npm
        file: package.json
        mode: committed
      - adapter: yaml
        file: /docs/user/docs.yml
        pointer: /products/t3c-proxy/version
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
  t3code-proxy-feature:
    path: features/src/t3code-proxy
    projections:
      - adapter: json
        file: devcontainer-feature.json
        mode: committed
        pointer: /version
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
  # The public docs release on their own, so the docs footer can say which
  # docs describe which t3c version. Docs units are tag-only.
  t3c-docs:
    path: docs/user/t3c
    depends-on:
      - t3code-cli
    projections:
      - adapter: yaml
        file: /docs/user/docs.yml
        pointer: /products/t3c/docs-version
        mode: committed
    tags:
      primary:
        role: primary
        template: '{id}@{version}'
  t3mcp-docs:
    path: docs/user/t3mcp
    depends-on:
      - t3code-mcp
    projections:
      - adapter: yaml
        file: /docs/user/docs.yml
        pointer: /products/t3mcp/docs-version
        mode: committed
    tags:
      primary:
        role: primary
        template: "{id}@{version}"
  t3c-proxy-docs:
    path: docs/user/t3c-proxy
    depends-on:
      - t3code-proxy
    projections:
      - adapter: yaml
        file: /docs/user/docs.yml
        pointer: /products/t3c-proxy/docs-version
        mode: committed
    tags:
      primary:
        role: primary
        template: "{id}@{version}"
